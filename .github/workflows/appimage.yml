name: Linux AppImage

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SYNVEIL_ENABLE_QMLCACHEGEN_WRAPPER: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: Build, reproduce, inspect, and smoke AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      # Pinned action and exact official Qt archive; all Qt host tools and
      # runtime libraries therefore come from one compatible toolchain.
      - name: Install Qt 6.7.3 toolchain
        uses: jurplel/install-qt-action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005
        with:
          version: '6.7.3'
          host: linux
          target: desktop
          arch: linux_gcc_64
          cache: true
      - name: Install conservative build/runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y file shellcheck pkg-config libdbus-1-dev \
            libfuse2 xvfb xauth
          sudo install -d -m 0777 /usr/src/synveil
      - name: Static contracts and shell checks
        run: |
          bash -n deploy/packages/build-appimage.sh scripts/validate-appimage-build.sh
          shellcheck -S warning deploy/packages/build-appimage.sh deploy/packages/appimage/AppRun scripts/validate-appimage-build.sh
          ./scripts/validate-appimage-build.sh
          cargo test -p synveil-install-engine --test appimage_integration --locked
      - name: Build and independently reproduce AppImage
        run: ./deploy/packages/build-appimage.sh
      - name: Inspect exact artifact, manifest, and bundled runtime
        run: |
          APPIMAGE="target/packages/Synveil-$(bash -c 'source deploy/packages/common/version.sh; synveil_cargo_version')-x86_64.AppImage"
          ./scripts/validate-appimage-build.sh --artifact "$APPIMAGE" \
            --manifest target/packages/SYNVEIL-RELEASE-MANIFEST.json
          python3 scripts/release_manifest.py validate --artifact-root target/packages \
            target/packages/SYNVEIL-RELEASE-MANIFEST.json
          cat target/packages/SYNVEIL-RELEASE-MANIFEST.json
      - name: Host-decontaminated bounded QML smoke
        run: |
          APPIMAGE="target/packages/Synveil-$(bash -c 'source deploy/packages/common/version.sh; synveil_cargo_version')-x86_64.AppImage"
          ./scripts/validate-appimage-build.sh --artifact "$APPIMAGE" --smoke
      - name: Real AppImage current-user integration lifecycle
        run: ./scripts/validate-appimage-runtime.sh "$(find target/packages -maxdepth 1 -name '*.AppImage' -print -quit)"
      - name: Record ABI symbol baseline
        run: |
          APPIMAGE=$(find target/packages -maxdepth 1 -name '*.AppImage' -print -quit)
          work=$(mktemp -d)
          (cd "$work" && env -u APPIMAGE_EXTRACT_AND_RUN "$GITHUB_WORKSPACE/$APPIMAGE" --appimage-extract >/dev/null)
          find "$work/squashfs-root/usr/bin" -type f -exec strings {} + | \
            grep -Eo 'GLIBC(_[A-Z]+)?_[0-9]+\.[0-9]+(\.[0-9]+)?' | sort -Vu | tail -20 | tee target/packages/ABI-SYMBOLS.txt
          sha256sum "$APPIMAGE" | tee target/packages/APPIMAGE-SHA256.txt
      - name: Upload unsigned portable artifact and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synveil-appimage-x86_64
          path: |
            target/packages/*.AppImage
            target/packages/SYNVEIL-RELEASE-MANIFEST.json
            target/packages/ABI-SYMBOLS.txt
            target/packages/APPIMAGE-SHA256.txt
          if-no-files-found: error
