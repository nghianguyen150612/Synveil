name: Server self-host acceptance

on:
  pull_request:
    paths:
      - "crates/server-bootstrap/**"
      - "crates/server-config/**"
      - "crates/server-storage/**"
      - "crates/server-service/**"
      - "crates/server-network/**"
      - "crates/server-host/**"
      - "crates/metadata/tests/scheduled_maintenance_cycle_runner_postgres.rs"
      - "crates/auth/**"
      - "crates/api/**"
      - "deploy/**"
      - "docs/v0.2/**"
      - "scripts/validate-end-to-end-self-host.py"
      - "scripts/validate-server-service-installation.py"
      - "scripts/build-host-server-input.sh"
      - "scripts/validate-p036-production-artifacts.py"
      - "scripts/requirements-p036.txt"
      - "scripts/tests/**"
      - "scripts/materialize-p036-trust-keyring.py"
      - "scripts/p036_native_acceptance.py"
      - "scripts/p036-snapshot-state.py"
      - "scripts/p036_power_interruption.py"
      - "scripts/run-p036-native-acceptance.sh"
      - "scripts/run-p036-power-interruption.sh"
      - "acceptance/p036/**"
      - ".github/workflows/server-self-host-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install native Rust and D-Bus build prerequisites
        run: sudo apt-get update -qq && sudo apt-get install --yes --no-install-recommends build-essential pkg-config libdbus-1-dev python3-venv
      - run: python3 scripts/validate-end-to-end-self-host.py
      - run: cargo fmt --all -- --check
      - run: cargo test -p synveil-server-bootstrap --locked
      - run: cargo test -p synveil-server-config --locked
      - run: cargo test -p synveil-server-storage --locked
      - run: cargo test -p synveil-server-network --locked
      - run: cargo test -p synveil-server-service --locked
      - run: cargo test -p synveil-api --locked
      - run: cargo clippy -p synveil-server-bootstrap --all-targets --locked --no-deps -- -D warnings
      - run: cargo test -p synveil-server-host --locked
      - run: cargo check -p synveil-server-host --features p036-acceptance --bin synveil-p036-native-acceptance --locked
      - name: Check harness and builder script syntax
        run: |
          bash -n scripts/build-host-server-input.sh scripts/run-p036-native-acceptance.sh scripts/run-p036-power-interruption.sh
          python3 -m py_compile deploy/server/prepare-host-runtime.py scripts/validate-p036-production-artifacts.py scripts/p036_native_acceptance.py scripts/p036-snapshot-state.py scripts/p036_power_interruption.py scripts/materialize-p036-trust-keyring.py
      - run: python3 scripts/validate-server-service-installation.py

  artifact-identity:
    runs-on: ubuntu-24.04
    env:
      SYNVEIL_P036_TRUSTED_KEYRING_B64: ${{ vars.SYNVEIL_P036_TRUSTED_KEYRING_B64 }}
      SYNVEIL_P036_INVENTORY_FINGERPRINT: ${{ vars.SYNVEIL_P036_INVENTORY_FINGERPRINT }}
      SYNVEIL_P036_DESKTOP_FINGERPRINT: ${{ vars.SYNVEIL_P036_DESKTOP_FINGERPRINT }}
      SYNVEIL_P036_SERVER_FINGERPRINT: ${{ vars.SYNVEIL_P036_SERVER_FINGERPRINT }}
      SYNVEIL_P036_POSTGRESQL17_FINGERPRINT: ${{ vars.SYNVEIL_P036_POSTGRESQL17_FINGERPRINT }}
      SYNVEIL_P036_EDGE_FINGERPRINT: ${{ vars.SYNVEIL_P036_EDGE_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize approved public publisher keyring
        run: python3 scripts/materialize-p036-trust-keyring.py
      - name: Validate strict inventory schema and rejection cases
        run: |
          python3 -m venv /tmp/synveil-p036-schema
          /tmp/synveil-p036-schema/bin/pip install --disable-pip-version-check -r scripts/requirements-p036.txt
          /tmp/synveil-p036-schema/bin/python -m unittest scripts/tests/test_p036_artifact_inventory.py -v
      - name: Verify exact production files, provenance, signatures, versions, and licenses
        run: >-
          python3 scripts/validate-p036-production-artifacts.py
          --platform ubuntu-24.04
          --inventory acceptance/p036/production-artifacts.json
          --inventory-signature acceptance/p036/production-artifacts.json.sig
          --artifact-root acceptance/p036/artifacts

  ubuntu-host:
    runs-on: [self-hosted, linux, x64, synveil-ubuntu-24.04-p036]
    env:
      SYNVEIL_P036_TRUSTED_KEYRING_B64: ${{ vars.SYNVEIL_P036_TRUSTED_KEYRING_B64 }}
      SYNVEIL_P036_INVENTORY_FINGERPRINT: ${{ vars.SYNVEIL_P036_INVENTORY_FINGERPRINT }}
      SYNVEIL_P036_DESKTOP_FINGERPRINT: ${{ vars.SYNVEIL_P036_DESKTOP_FINGERPRINT }}
      SYNVEIL_P036_SERVER_FINGERPRINT: ${{ vars.SYNVEIL_P036_SERVER_FINGERPRINT }}
      SYNVEIL_P036_POSTGRESQL17_FINGERPRINT: ${{ vars.SYNVEIL_P036_POSTGRESQL17_FINGERPRINT }}
      SYNVEIL_P036_EDGE_FINGERPRINT: ${{ vars.SYNVEIL_P036_EDGE_FINGERPRINT }}
      SYNVEIL_P036_NATIVE_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize approved public publisher keyring
        run: python3 scripts/materialize-p036-trust-keyring.py
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/run-p036-native-acceptance.sh ubuntu-24.04

  fedora-host:
    runs-on: [self-hosted, linux, x64, synveil-fedora-42-p036]
    env:
      SYNVEIL_P036_TRUSTED_KEYRING_B64: ${{ vars.SYNVEIL_P036_TRUSTED_KEYRING_B64 }}
      SYNVEIL_P036_INVENTORY_FINGERPRINT: ${{ vars.SYNVEIL_P036_INVENTORY_FINGERPRINT }}
      SYNVEIL_P036_DESKTOP_FINGERPRINT: ${{ vars.SYNVEIL_P036_DESKTOP_FINGERPRINT }}
      SYNVEIL_P036_SERVER_FINGERPRINT: ${{ vars.SYNVEIL_P036_SERVER_FINGERPRINT }}
      SYNVEIL_P036_POSTGRESQL17_FINGERPRINT: ${{ vars.SYNVEIL_P036_POSTGRESQL17_FINGERPRINT }}
      SYNVEIL_P036_EDGE_FINGERPRINT: ${{ vars.SYNVEIL_P036_EDGE_FINGERPRINT }}
      SYNVEIL_P036_NATIVE_ACCEPTANCE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Materialize approved public publisher keyring
        run: python3 scripts/materialize-p036-trust-keyring.py
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/run-p036-native-acceptance.sh fedora-42

  interruption-recovery:
    runs-on: [self-hosted, linux, x64, synveil-p036-vm-control]
    env:
      SYNVEIL_P036_VM_NAME: ${{ vars.SYNVEIL_P036_VM_NAME }}
      SYNVEIL_P036_VM_UUID: ${{ vars.SYNVEIL_P036_VM_UUID }}
      SYNVEIL_P036_VM_SSH_HOST: ${{ vars.SYNVEIL_P036_VM_SSH_HOST }}
      SYNVEIL_P036_VM_SSH_USER: ${{ vars.SYNVEIL_P036_VM_SSH_USER }}
      SYNVEIL_P036_VM_SSH_IDENTITY: ${{ vars.SYNVEIL_P036_VM_SSH_IDENTITY }}
      SYNVEIL_P036_VM_KNOWN_HOSTS: ${{ vars.SYNVEIL_P036_VM_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: ./scripts/run-p036-power-interruption.sh

  guided-self-hosting-gate:
    if: always()
    needs: [contract-and-source, artifact-identity, ubuntu-host, fedora-host, interruption-recovery]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every Phase-E result
        env:
          SOURCE: ${{ needs.contract-and-source.result }}
          ARTIFACTS: ${{ needs.artifact-identity.result }}
          UBUNTU: ${{ needs.ubuntu-host.result }}
          FEDORA: ${{ needs.fedora-host.result }}
          INTERRUPTION: ${{ needs.interruption-recovery.result }}
        run: |
          for result in "$SOURCE" "$ARTIFACTS" "$UBUNTU" "$FEDORA" "$INTERRUPTION"; do
            test "$result" = success
          done
