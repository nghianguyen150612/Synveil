name: Installation resilience hardening
on:
  pull_request:
  push:
    branches: [feat/installation-resilience-hardening]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: installation-resilience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  journal-fault-injection:
    name: Journal durability faults and process restart
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p synveil-install-engine --test journal_contract --locked
      - run: cargo test -p synveil-install-engine --test error_model_contract --locked
      - run: cargo clippy -p synveil-install-engine --all-targets --locked -- -D warnings

  lifecycle-interruption:
    name: Lifecycle and common-engine interruption fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p synveil-install-engine --test engine_contract --test lifecycle_contract --locked
      - run: cargo test -p synveil-install-engine --test journal_contract forced_process_termination_restarts_from_durable_evidence --locked

  acquisition-disk-full:
    name: Acquisition and deterministic ENOSPC (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r scripts/requirements-installer-security.txt
      - run: python -m unittest discover -s tests/release_download -v
      - run: python scripts/validate-install-error-model.py
      - run: python -m py_compile scripts/release_download.py scripts/linux_quick_install.py scripts/validate-install-error-model.py
      - if: runner.os == 'Linux'
        run: python -m unittest discover -s tests/linux_quick_install -v

  linux-native-package-reconciliation:
    name: Linux APT/DNF reconciliation boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: python3 -m unittest discover -s tests/linux_quick_install -v
      - run: ./scripts/validate-linux-quick-install.sh
      - run: python3 scripts/validate-debian-package-ux.py
      - run: python3 scripts/validate-rpm-package-ux.py
      - run: cargo test -p synveil-install-engine --test linux_package_integration --locked

  appimage-interruption:
    name: AppImage partial integration recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p synveil-install-engine --test appimage_integration --locked
      - run: python3 scripts/validate-appimage-build.py

  windows-lifecycle-boundaries:
    name: Windows ownership and lifecycle preservation boundaries
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate-windows-installer.py
      - run: python -m unittest discover -s scripts -p test_windows_lifecycle.py -v
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p synveil-install-engine --test lifecycle_contract --test engine_contract --test error_model_contract --locked
      - name: Record native interruption evidence boundary
        shell: pwsh
        run: |
          Write-Output 'Native Windows interruption and lifecycle evidence is exercised by windows-installer.yml.'
          Write-Output 'This focused source job alone makes no native Inno Setup claim.'

  preservation-regression:
    name: Preservation and recovery static regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p synveil-install-engine --test journal_contract --test lifecycle_contract --test appimage_integration --locked
      - run: python3 -m unittest discover -s tests/linux_quick_install -v
      - run: python3 scripts/validate-installation-resilience-hardening.py

  docs-static-validator:
    name: Resilience docs and acceptance-scope validator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ripgrep
      - run: python3 scripts/validate-installation-resilience-hardening.py
      - run: python3 -m py_compile scripts/validate-installation-resilience-hardening.py
      - run: python3 scripts/validate-installer-security-hardening.py
      - run: ./scripts/validate-docs.sh
      - run: ./scripts/validate-install-acceptance.sh
      - run: git diff --check

  strict-quality:
    name: Strict format and installer-engine quality
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p synveil-install-engine --all-targets --locked -- -D warnings
      - run: cargo test -p synveil-install-engine --locked
