name: Windows installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true
      - name: Select and authenticate the MSVC linker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:VCToolsInstallDir)) {
            throw 'MSVC_LINKER_SELECTION_FAILURE: VCToolsInstallDir was not exported by the developer environment'
          }
          $linker = [IO.Path]::GetFullPath((Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'))
          $toolsRoot = [IO.Path]::GetFullPath($env:VCToolsInstallDir).TrimEnd('\') + '\'
          if (!$linker.StartsWith($toolsRoot, [StringComparison]::OrdinalIgnoreCase) -or !(Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw 'MSVC_LINKER_SELECTION_FAILURE: the selected linker is outside the active Visual C++ tools root or missing'
          }
          $linkerFile = Get-Item -LiteralPath $linker
          if ($null -ne $linkerFile.LinkType) {
            throw 'MSVC_LINKER_SELECTION_FAILURE: the selected linker must be a regular, non-reparse-point file'
          }
          $identity = [Diagnostics.FileVersionInfo]::GetVersionInfo($linker)
          if ($identity.CompanyName -notmatch '^Microsoft Corporation$' -or $identity.OriginalFilename -notmatch '^LINK\.EXE$') {
            throw "MSVC_LINKER_SELECTION_FAILURE: unexpected linker identity company='$($identity.CompanyName)' original='$($identity.OriginalFilename)'"
          }
          $bytes = [IO.File]::ReadAllBytes($linker)
          if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw 'MSVC_LINKER_SELECTION_FAILURE: the selected linker is not a PE executable'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 6 -ge $bytes.Length -or [BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550 -or [BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw 'MSVC_LINKER_SELECTION_FAILURE: the selected linker is not an AMD64 PE executable'
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Authenticated MSVC linker: $linker"
          Write-Host "Version: $($identity.FileVersion)"
          Write-Host "SHA-256: $((Get-FileHash -LiteralPath $linker -Algorithm SHA256).Hash.ToLowerInvariant())"
      - name: Validate reviewed installer sources
        shell: bash
        run: |
          python scripts/validate-windows-installer.py
          ./scripts/test-windows-rustflags.sh
      - name: Build runtime payload
        shell: bash
        run: |
          set -euo pipefail
          source deploy/packages/common/reproducible.sh
          synveil_prepare_reproducible_rust_build "$PWD"
          cargo build --release --locked -p synveil-desktop -p synveil-client
          ./deploy/packages/build-windows.sh \
            --desktop-binary=target/release/synveil-desktop.exe \
            --client-binary=target/release/synveil-client.exe \
            --output-dir=target/windows-packages \
            --staging-dir=target/windows-installer-runtime
          test "$(find target/windows-packages -maxdepth 1 -name 'synveil-*-windows-x86_64.zip' -type f | wc -l)" -eq 1
      - name: Exercise negative runtime closure cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Expect-Rejected([string]$Name, [scriptblock]$Mutation) {
            $fixture = Join-Path $env:RUNNER_TEMP ("synveil-negative-" + $Name)
            Remove-Item $fixture -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item target/windows-installer-runtime $fixture -Recurse
            & $Mutation $fixture
            & pwsh -NoProfile -File ./scripts/build-windows-installer.ps1 -RuntimeStagingDirectory $fixture 2>$null
            if ($LASTEXITCODE -eq 0) { throw "NEGATIVE_RUNTIME_FAILURE: $Name fixture was accepted" }
          }
          Expect-Rejected 'missing-qwindows' { param($p) Remove-Item (Join-Path $p 'platforms/qwindows.dll') }
          Expect-Rejected 'corrupt-dll' { param($p) Add-Content -LiteralPath (Join-Path $p 'platforms/qwindows.dll') -Value 'corrupt' }
          Expect-Rejected 'unexpected-dll' { param($p) Copy-Item (Join-Path $p 'platforms/qwindows.dll') (Join-Path $p 'unexpected.dll') }
          Expect-Rejected 'developer-file' { param($p) Set-Content -LiteralPath (Join-Path $p 'leaked.lib') -Value 'not-runtime' }
      - name: Build installer twice and require reproducibility
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1 -RuntimeStagingDirectory target/windows-installer-runtime
          Copy-Item target/windows-installer/SynveilSetup.exe target/windows-installer-build-a.exe
          Copy-Item target/windows-installer-generated/payload-inventory.json target/payload-inventory-a.json
          Copy-Item target/windows-installer-generated/files.iss target/files-a.iss
          Copy-Item target/windows-installer-generated/version.iss target/version-a.iss
          Copy-Item target/windows-installer-generated/build.iss target/build-a.iss
          ./scripts/build-windows-installer.ps1 -RuntimeStagingDirectory target/windows-installer-runtime
          foreach ($pair in @(
            @('target/windows-installer-build-a.exe','target/windows-installer/SynveilSetup.exe'),
            @('target/payload-inventory-a.json','target/windows-installer-generated/payload-inventory.json'),
            @('target/files-a.iss','target/windows-installer-generated/files.iss'),
            @('target/version-a.iss','target/windows-installer-generated/version.iss'),
            @('target/build-a.iss','target/windows-installer-generated/build.iss'))) {
            if ((Get-FileHash $pair[0]).Hash -cne (Get-FileHash $pair[1]).Hash) { throw "non-reproducible installer input/output: $($pair[1])" }
          }
      - name: Silent current-user install and uninstall smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path target/windows-installer/SynveilSetup.exe).Path
          $installLog = Join-Path $env:RUNNER_TEMP 'synveil-install.log'
          $uninstallLog = Join-Path $env:RUNNER_TEMP 'synveil-uninstall.log'
          $sentinel = Join-Path $env:LOCALAPPDATA 'Synveil/state-sentinel/p022.txt'
          New-Item (Split-Path $sentinel) -ItemType Directory -Force | Out-Null
          Set-Content $sentinel 'P022 synthetic non-secret state sentinel'
          $process = Start-Process $setup -Wait -PassThru -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/STARTUP=0','/DESKTOPICON=0','/LAUNCH=0',('/LOG=' + $installLog))
          if ($process.ExitCode -ne 0) { throw "INSTALL_SMOKE_FAILURE: installer exit $($process.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'Programs/Synveil'
          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Synveil.lnk'
          if (Test-Path $desktopShortcut) { throw 'INSTALL_SMOKE_FAILURE: /DESKTOPICON=0 created a shortcut' }
          foreach ($file in @('synveil-desktop.exe','synveil-client.exe','qt.conf','LICENSE','NOTICE','platforms/qwindows.dll')) { if (!(Test-Path (Join-Path $root $file))) { throw "INSTALL_SMOKE_FAILURE: missing $file" } }
          ./scripts/test-windows-installed-runtime.ps1 -RuntimeRoot $root -Manifest (Join-Path $root 'SYNVEIL-MANIFEST.txt')
          $shortcut = Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/Synveil.lnk'
          if (!(Test-Path $shortcut)) { throw 'INSTALL_SMOKE_FAILURE: Start Menu shortcut missing' }
          $expectedVersion = (Get-Content target/windows-installer/SYNVEIL-RELEASE-MANIFEST.json -Raw | ConvertFrom-Json).product_version
          $entries = @(Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.PSChildName -eq '{7DDE2E8A-376A-4FC8-96FF-7DB529F0945D}_is1' -and $_.DisplayName -eq 'Synveil' -and $_.DisplayVersion -eq $expectedVersion -and $_.InstallLocation.TrimEnd('\') -eq $root.TrimEnd('\') })
          if ($entries.Count -ne 1 -or !(Test-Path $entries[0].UninstallString.Trim('"'))) { throw 'INSTALL_SMOKE_FAILURE: unique HKCU uninstall registration missing' }
          foreach ($name in @('QT_ROOT_DIR','QT_PLUGIN_PATH','QML2_IMPORT_PATH','QML_IMPORT_PATH')) { Remove-Item "Env:$name" -ErrorAction SilentlyContinue }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_DEBUG_PLUGINS = '1'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $runtimeDiagnostics = Join-Path $env:RUNNER_TEMP 'synveil-runtime-smoke.log'
          $runtimeStdout = Join-Path $env:RUNNER_TEMP 'synveil-runtime-smoke.stdout.log'
          $unrelatedCwd = Join-Path $env:RUNNER_TEMP 'synveil-unrelated-cwd'
          New-Item $unrelatedCwd -ItemType Directory -Force | Out-Null
          $probe = Start-Process (Join-Path $root 'synveil-desktop.exe') -WorkingDirectory $unrelatedCwd -ArgumentList '--qml-smoke-test' -RedirectStandardOutput $runtimeStdout -RedirectStandardError $runtimeDiagnostics -PassThru
          if (!$probe.WaitForExit(15000)) { $probe.Kill(); throw 'INSTALL_SMOKE_FAILURE: installed desktop probe timed out' }
          if ($probe.ExitCode -ne 0) { throw "INSTALL_SMOKE_FAILURE: desktop probe exit $($probe.ExitCode)" }
          $diagnosticText = Get-Content $runtimeDiagnostics -Raw
          if ($diagnosticText -match [regex]::Escape($env:RUNNER_WORKSPACE) -or $diagnosticText -match 'hostedtoolcache.*Qt') { throw 'INSTALL_SMOKE_FAILURE: desktop resolved a build-tree/SDK runtime path' }
          $env:QT_DEBUG_PLUGINS = '0'
          $clientLog = Join-Path $env:RUNNER_TEMP 'synveil-client-smoke.log'
          $clientStdout = Join-Path $env:RUNNER_TEMP 'synveil-client-smoke.stdout.log'
          $clientProbe = Start-Process (Join-Path $root 'synveil-client.exe') -WorkingDirectory $unrelatedCwd -RedirectStandardOutput $clientStdout -RedirectStandardError $clientLog -PassThru
          if (!$clientProbe.WaitForExit(15000)) { $clientProbe.Kill(); throw 'INSTALL_SMOKE_FAILURE: installed client bounded configuration probe timed out' }
          if ($clientProbe.ExitCode -ne 78) { throw "INSTALL_SMOKE_FAILURE: client configuration probe expected safe no-config exit 78, got $($clientProbe.ExitCode)" }
          $uninstaller = $entries[0].UninstallString.Trim('"')
          $process = Start-Process $uninstaller -Wait -PassThru -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/LOG=' + $uninstallLog))
          if ($process.ExitCode -ne 0) { throw "UNINSTALL_SMOKE_FAILURE: uninstaller exit $($process.ExitCode)" }
          if (Test-Path $root) { throw 'UNINSTALL_SMOKE_FAILURE: package root remains' }
          if (Test-Path $shortcut) { throw 'UNINSTALL_SMOKE_FAILURE: shortcut remains' }
          if (!(Test-Path $sentinel)) { throw 'UNINSTALL_SMOKE_FAILURE: external state sentinel was removed' }
          $process = Start-Process $setup -Wait -PassThru -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/STARTUP=0','/DESKTOPICON=1','/LAUNCH=0',('/LOG=' + $installLog))
          if ($process.ExitCode -ne 0 -or !(Test-Path $desktopShortcut)) { throw 'INSTALL_SMOKE_FAILURE: /DESKTOPICON=1 did not create the current-user shortcut' }
          $entry = Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall' | ForEach-Object { Get-ItemProperty $_.PSPath } | Where-Object { $_.PSChildName -eq '{7DDE2E8A-376A-4FC8-96FF-7DB529F0945D}_is1' }
          $process = Start-Process $entry.UninstallString.Trim('"') -Wait -PassThru -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/LOG=' + $uninstallLog))
          if ($process.ExitCode -ne 0 -or (Test-Path $desktopShortcut)) { throw 'UNINSTALL_SMOKE_FAILURE: selected desktop shortcut was not removed' }
          if (!(Test-Path $sentinel)) { throw 'UNINSTALL_SMOKE_FAILURE: external state sentinel was removed after option test' }
      - name: Upload installer and bounded smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-p024
          if-no-files-found: error
          retention-days: 7
          path: |
            target/windows-installer/SynveilSetup.exe
            target/windows-installer/SYNVEIL-RELEASE-MANIFEST.json
            ${{ runner.temp }}/synveil-install.log
            ${{ runner.temp }}/synveil-uninstall.log
            ${{ runner.temp }}/synveil-runtime-smoke.log
            ${{ runner.temp }}/synveil-runtime-smoke.stdout.log
            ${{ runner.temp }}/synveil-client-smoke.log
            ${{ runner.temp }}/synveil-client-smoke.stdout.log
