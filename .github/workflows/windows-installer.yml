name: Windows installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer-smoke:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          cache: true
      - name: Select and authenticate the MSVC linker
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:VCToolsInstallDir)) {
            throw 'MSVC_LINKER_SELECTION_FAILURE: VCToolsInstallDir was not exported by the developer environment'
          }
          $linker = [IO.Path]::GetFullPath((Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\link.exe'))
          $toolsRoot = [IO.Path]::GetFullPath($env:VCToolsInstallDir).TrimEnd('\') + '\'
          if (!$linker.StartsWith($toolsRoot, [StringComparison]::OrdinalIgnoreCase) -or !(Test-Path -LiteralPath $linker -PathType Leaf)) {
            throw 'MSVC_LINKER_SELECTION_FAILURE: the selected linker is outside the active Visual C++ tools root or missing'
          }
          $linkerFile = Get-Item -LiteralPath $linker
          if ($null -ne $linkerFile.LinkType) {
            throw 'MSVC_LINKER_SELECTION_FAILURE: the selected linker must be a regular, non-reparse-point file'
          }
          $identity = [Diagnostics.FileVersionInfo]::GetVersionInfo($linker)
          if ($identity.CompanyName -notmatch '^Microsoft Corporation$' -or $identity.OriginalFilename -notmatch '^LINK\.EXE$') {
            throw "MSVC_LINKER_SELECTION_FAILURE: unexpected linker identity company='$($identity.CompanyName)' original='$($identity.OriginalFilename)'"
          }
          $bytes = [IO.File]::ReadAllBytes($linker)
          if ($bytes.Length -lt 512 -or $bytes[0] -ne 0x4d -or $bytes[1] -ne 0x5a) {
            throw 'MSVC_LINKER_SELECTION_FAILURE: the selected linker is not a PE executable'
          }
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3c)
          if ($peOffset -lt 0 -or $peOffset + 6 -ge $bytes.Length -or [BitConverter]::ToUInt32($bytes, $peOffset) -ne 0x00004550 -or [BitConverter]::ToUInt16($bytes, $peOffset + 4) -ne 0x8664) {
            throw 'MSVC_LINKER_SELECTION_FAILURE: the selected linker is not an AMD64 PE executable'
          }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Authenticated MSVC linker: $linker"
          Write-Host "Version: $($identity.FileVersion)"
          Write-Host "SHA-256: $((Get-FileHash -LiteralPath $linker -Algorithm SHA256).Hash.ToLowerInvariant())"
      - name: Validate reviewed installer sources
        shell: bash
        run: |
          python scripts/validate-windows-installer.py
          ./scripts/test-windows-rustflags.sh
      - name: Build runtime payload
        shell: bash
        run: |
          set -euo pipefail
          source deploy/packages/common/reproducible.sh
          synveil_prepare_reproducible_rust_build "$PWD"
          cargo build --release --locked -p synveil-desktop -p synveil-client
          ./deploy/packages/build-windows.sh \
            --desktop-binary=target/release/synveil-desktop.exe \
            --client-binary=target/release/synveil-client.exe \
            --output-dir=target/windows-packages \
            --staging-dir=target/windows-installer-runtime
          test "$(find target/windows-packages -maxdepth 1 -name 'synveil-*-windows-x86_64.zip' -type f | wc -l)" -eq 1
      - name: Exercise negative runtime closure cases
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Expect-Rejected([string]$Name, [scriptblock]$Mutation) {
            $fixture = Join-Path $env:RUNNER_TEMP ("synveil-negative-" + $Name)
            Remove-Item $fixture -Recurse -Force -ErrorAction SilentlyContinue
            Copy-Item target/windows-installer-runtime $fixture -Recurse
            & $Mutation $fixture
            & pwsh -NoProfile -File ./scripts/build-windows-installer.ps1 -RuntimeStagingDirectory $fixture 2>$null
            if ($LASTEXITCODE -eq 0) { throw "NEGATIVE_RUNTIME_FAILURE: $Name fixture was accepted" }
          }
          Expect-Rejected 'missing-qwindows' { param($p) Remove-Item (Join-Path $p 'platforms/qwindows.dll') }
          Expect-Rejected 'corrupt-dll' { param($p) Add-Content -LiteralPath (Join-Path $p 'platforms/qwindows.dll') -Value 'corrupt' }
          Expect-Rejected 'unexpected-dll' { param($p) Copy-Item (Join-Path $p 'platforms/qwindows.dll') (Join-Path $p 'unexpected.dll') }
          Expect-Rejected 'developer-file' { param($p) Set-Content -LiteralPath (Join-Path $p 'leaked.lib') -Value 'not-runtime' }
      - name: Build installer twice and require reproducibility
        shell: pwsh
        run: |
          ./scripts/build-windows-installer.ps1 -RuntimeStagingDirectory target/windows-installer-runtime
          Copy-Item target/windows-installer/SynveilSetup.exe target/windows-installer-build-a.exe
          Copy-Item target/windows-installer-generated/payload-inventory.json target/payload-inventory-a.json
          Copy-Item target/windows-installer-generated/files.iss target/files-a.iss
          Copy-Item target/windows-installer-generated/version.iss target/version-a.iss
          Copy-Item target/windows-installer-generated/build.iss target/build-a.iss
          ./scripts/build-windows-installer.ps1 -RuntimeStagingDirectory target/windows-installer-runtime
          foreach ($pair in @(
            @('target/windows-installer-build-a.exe','target/windows-installer/SynveilSetup.exe'),
            @('target/payload-inventory-a.json','target/windows-installer-generated/payload-inventory.json'),
            @('target/files-a.iss','target/windows-installer-generated/files.iss'),
            @('target/version-a.iss','target/windows-installer-generated/version.iss'),
            @('target/build-a.iss','target/windows-installer-generated/build.iss'))) {
            if ((Get-FileHash $pair[0]).Hash -cne (Get-FileHash $pair[1]).Hash) { throw "non-reproducible installer input/output: $($pair[1])" }
          }
      - name: Inspect compiled Setup execution level
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Join-Path $env:RUNNER_TEMP 'SynveilSetup.manifest.xml'
          & mt.exe "-inputresource:target/windows-installer/SynveilSetup.exe;#1" "-out:$manifest"
          if ($LASTEXITCODE -ne 0) { throw 'SETUP_MANIFEST_FAILURE: mt.exe could not extract the compiled manifest' }
          $text = Get-Content $manifest -Raw
          if ($text -notmatch 'requestedExecutionLevel\s+level=["'']asInvoker["'']' -or $text -match 'requireAdministrator|highestAvailable') {
            throw 'SETUP_MANIFEST_FAILURE: compiled Setup does not request asInvoker'
          }
          Copy-Item $manifest target/windows-installer/SynveilSetup.manifest.xml
      - name: Qualify installation as a disposable standard user
        shell: pwsh
        run: |
          ./scripts/invoke-windows-standard-user-test.ps1 `
            -Setup target/windows-installer/SynveilSetup.exe `
            -EvidenceDirectory target/windows-per-user-evidence
      - name: Upload installer and bounded acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-p025
          if-no-files-found: error
          retention-days: 7
          path: |
            target/windows-installer/SynveilSetup.exe
            target/windows-installer/SYNVEIL-RELEASE-MANIFEST.json
            target/windows-installer/SynveilSetup.manifest.xml
            target/windows-per-user-evidence
