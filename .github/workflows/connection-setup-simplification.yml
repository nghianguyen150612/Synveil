name: connection setup simplification

on:
  pull_request:
  push:
    branches: [codex/p038-connection-setup-simplification]

jobs:
  address-and-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p synveil-client-sync --locked profiles::tests
      - run: cargo test -p synveil-client --locked controller
      - run: python3 scripts/validate-connection-setup-simplification.py
      - run: python3 -m py_compile scripts/validate-connection-setup-simplification.py

  desktop-presentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Qt and native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libdbus-1-dev pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev-tools \
            libgl1-mesa-dev xvfb \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-dialogs qml6-module-qtquick-layouts \
            qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-qtquick-templates qml6-module-qtquick-nativestyle
      - run: cargo test -p synveil-desktop --locked
      - run: cargo check -p synveil-desktop --locked
      - run: ./scripts/test-desktop-ui.sh

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p synveil-client-sync -p synveil-client -p synveil-desktop --all-targets --locked --no-deps -- -D warnings
      - run: ./scripts/validate-docs.sh
