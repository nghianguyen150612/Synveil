name: Unified Welcome

on:
  pull_request:
    paths:
      - "crates/desktop/**"
      - "docs/v0.2/UNIFIED_WELCOME_EXPERIENCE.md"
      - "docs/v0.2/PROMPT037_MANIFEST.md"
      - "docs/adr/ADR-067-v0.2-unified-first-run-welcome.md"
      - "scripts/validate-unified-welcome.py"
      - ".github/workflows/unified-welcome.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: python3 scripts/validate-unified-welcome.py
      - run: cargo fmt --all -- --check
      - run: cargo test -p synveil-desktop --locked
      - run: cargo clippy -p synveil-desktop --all-targets --locked --no-deps -- -D warnings

  qt-build-and-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y qt6-base-dev qt6-declarative-dev qt6-tools-dev-tools libgl1-mesa-dev xvfb qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs qml6-module-qtquick-layouts qml6-module-qtquick-window qml6-module-qtqml-workerscript qml6-module-qtquick-templates qml6-module-qtquick-nativestyle
      - run: cargo build -p synveil-desktop --locked
      - name: QML lint against generated desktop module metadata
        shell: bash
        run: |
          set -euo pipefail
          module_qmldir="$(find target/debug/build \
            -type f \
            -path '*/out/qt-build-utils/qml_modules/com/synveil/desktop/qmldir' \
            -printf '%T@ %p\n' | sort -n | tail -n 1 | cut -d' ' -f2-)"
          test -n "$module_qmldir"
          module_dir="$(dirname "$module_qmldir")"
          lint_root="$(mktemp -d)"
          trap 'rm -rf -- "$lint_root"' EXIT
          lint_module="$lint_root/com/synveil/desktop"
          mkdir -p "$lint_module/qml"
          cp crates/desktop/qml/Main.qml "$lint_module/qml/Main.qml"
          cp "$module_dir/qmldir" "$lint_module/qmldir"
          cp "$module_dir/plugin.qmltypes" "$lint_module/plugin.qmltypes"
          if command -v qmake6 >/dev/null 2>&1; then
            qmake_bin="$(command -v qmake6)"
          elif [[ -x /usr/lib/qt6/bin/qmake6 ]]; then
            qmake_bin=/usr/lib/qt6/bin/qmake6
          else
            qmake_bin=/usr/lib/qt6/bin/qmake
          fi
          qt_qml_dir="$("$qmake_bin" -query QT_INSTALL_QML)"
          /usr/lib/qt6/bin/qmllint -I "$qt_qml_dir" -I "$lint_root" "$lint_module/qml/Main.qml"
      - name: Offscreen fresh Welcome smoke
        run: xvfb-run -a env SYNVEIL_QML_SMOKE_TEST=1 QT_QPA_PLATFORM=offscreen cargo run -p synveil-desktop --locked
