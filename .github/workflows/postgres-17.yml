name: PostgreSQL 17 scheduled-maintenance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-pg17
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  pg17-scheduled-maintenance:
    name: PG17 live suites (scheduling, worker, cycle, lifecycle, stress)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    services:
      postgres:
        # Use the officially maintained major-version pin. Minor floats within 17.
        # This satisfies the prompt requirement: postgres:17 (not latest without pin).
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    env:
      SYNVEIL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Keep tests isolated in this job; the harness creates child databases via CREATE DATABASE.
      # The postgres superuser used here has disposable CI-only credentials.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libdbus-1-dev postgresql-client \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev-tools

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build DEB for packaged-runtime gate
        run: |
          set -euo pipefail
          ./deploy/packages/build.sh --format=deb
          test -n "$(find target/packages -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Verify migration files unchanged (CI guard)
        run: |
          set -euo pipefail
          count=$(ls migrations/*.sql | wc -l)
          latest=$(ls migrations/*.sql | sort | tail -n 1)
          echo "migrations count=$count latest=$latest"
          test "$count" -eq 36 || { echo "expected 36 migrations, got $count"; exit 1; }
          echo "$latest" | grep -q "20260910000000_sync_retention_handoff_proofs.sql" || { echo "latest migration mismatch $latest"; exit 1; }

      - name: Wait for PostgreSQL readiness (bounded health check)
        run: |
          set -euo pipefail
          echo "Waiting for PostgreSQL 17 to become ready..."
          for i in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then
              echo "PostgreSQL is ready"
              psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -c "SELECT version();" | head -n 5
              exit 0
            fi
            echo "  attempt $i/30 not ready, retrying in 1s..."
            sleep 1
          done
          echo "PostgreSQL failed to become ready within timeout"
          exit 1

      - name: Verify PostgreSQL major version is 17
        run: |
          set -euo pipefail
          ver=$(psql "postgresql://postgres:postgres@127.0.0.1:5432/postgres" -t -A -c "SHOW server_version;" | tr -d ' ')
          echo "server_version=$ver"
          if ! echo "$ver" | grep -q "^17\."; then
            echo "Expected PostgreSQL 17, got $ver"
            exit 1
          fi
          echo "PostgreSQL 17 confirmed"

      # Migration-from-empty gate — must be verified before any live suite.
      - name: Migration gate — fresh DB applies 36 migrations
        run: |
          set -euo pipefail
          cargo test --locked --test pg17_migration_gate_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 86 — retention, handoff proofs, bounded cleanup and races"
        run: |
          set -euo pipefail
          DB="p86_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-metadata --test sync_retention_postgres --locked -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 81–82 — logical and durable rebaseline snapshots"
        run: |
          set -euo pipefail
          DB="p82_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-metadata --test snapshot_postgres --locked -- --ignored --test-threads=1 --nocapture
          cargo test -p synveil-metadata --test durable_snapshot_postgres --locked -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 83C/85 — durable snapshot HTTP transport (25)"
        run: |
          set -euo pipefail
          DB="p83_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-api --test rebaseline_snapshot_http_postgres --locked -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 85 — durable checkpoint handoff and crash-safe resume"
        run: |
          set -euo pipefail
          DB="p85_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-metadata --test rebaseline_handoff_postgres --locked -- --ignored --test-threads=1 --nocapture
          cargo test -p synveil-api --test rebaseline_snapshot_http_postgres --locked -- --ignored --test-threads=1 --nocapture
          cargo test -p synveil-api --test rebaseline_client_e2e_84c_postgres --locked -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 87 — bounded client rebaseline convergence"
        run: |
          set -euo pipefail
          DB="p87_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          # The dedicated target drives every mandatory Prompt 87B recovery
          # branch through PostgreSQL -> Axum -> authentication -> real
          # HttpSyncRemote -> SQLite, with bounded HTTP call assertions.
          cargo test -p synveil-api --test rebaseline_convergence_postgres --locked -- --ignored --test-threads=1 --nocapture
          # Retain the established valid-pending-handoff live regression.
          cargo test -p synveil-api --test rebaseline_client_e2e_84c_postgres --locked -- --ignored --test-threads=1 --nocapture
          cargo test -p synveil-client-sync --lib --locked rebaseline_convergence
          cargo test -p synveil-client-sync --lib --locked durable_rebaseline_snapshot_create

      - name: "Prompt 88 — deterministic durable sync conflicts"
        run: |
          set -euo pipefail
          DB="p88_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-api --test sync_conflict_postgres --locked -- --ignored --test-threads=1 --nocapture
          cargo test -p synveil-client-sync --lib --locked conflict_policy

      - name: "Prompt 89 — adversarial full-sync verification (bounded CI subset)"
        run: |
          set -euo pipefail
          DB="p89_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          # Bounded CI acceptance subset (fast, hard-fail, no retry masking).
          # Full local gate runs all 8 adversarial targets serially; see docs/en/TESTING.md.
          cargo test -p synveil-api --test sync_adversarial_postgres --locked -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 91 — bounded bidirectional sync cycle"
        run: |
          set -euo pipefail
          DB="p91_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          # The target is intentionally ignored by default and is selected by
          # name so the eight Prompt 91 live cases are the hard-fail CI gate.
          # No retry or continue-on-error is permitted for correctness.
          cargo test -p synveil-api --test sync_cycle_postgres --locked -- --ignored --test-threads=1 --nocapture live_pg17_prompt91_
          cargo test -p synveil-client-sync --lib --locked sync_cycle

      - name: "Prompt 92 — long-running sync runtime"
        run: |
          set -euo pipefail
          DB="p92_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          # The live target uses accelerated decisions only in deterministic
          # unit tests; this acceptance case keeps real PostgreSQL, Axum,
          # device auth, HttpSyncRemote, SQLite, and Prompt 91 central.
          cargo test -p synveil-api --test sync_runtime_postgres --locked -- --ignored --test-threads=1 --nocapture live_pg17_runtime_
          cargo test -p synveil-client-sync --lib --locked runtime::tests

      - name: "Prompt 93 — durable-change-first runtime signals"
        run: |
          set -euo pipefail
          DB="p93signals_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          # Canonical durable producers, observation, periodic recovery, and
          # controller Sync Now are hard-fail live acceptance cases. The
          # notifier remains a scheduling hint; the target asserts durable
          # state separately from wake status.
          cargo test -p synveil-api --test sync_runtime_signals_postgres --locked -- --ignored --test-threads=1 --nocapture live_pg17_signal_
          cargo test -p synveil-client-sync --lib --locked signals::tests
          cargo test -p synveil-client-sync --lib --locked durable_observation_batch_wakes_once_and_noop_does_not_wake
          cargo test -p synveil-client-sync --lib --locked rescan_durable_work_emits_one_wake_after_bounded_reconciliation

      - name: "Prompt 94 — desktop sync host and process lifecycle"
        run: |
          set -euo pipefail
          DB="p94host_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          # The host target keeps OS adapters policy-free while exercising the
          # real PostgreSQL -> Axum -> device-auth -> HttpSyncRemote -> SQLite
          # path for each live process-lifecycle case. Failures are not retried
          # or masked.
          cargo test -p synveil-api --test desktop_sync_host_postgres --locked -- --ignored --test-threads=1 --nocapture live_pg17_host
          cargo test -p synveil-client-sync --lib --locked host::tests

      - name: "Prompt 95/97/101 — production desktop process, auth, root, and controller lifecycle"
        run: |
          set -euo pipefail
          DB="p95process_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          # The target exercises the production process bootstrap, Prompt 97
          # controller, and Prompt 101 authentication lifecycle over the real
          # PostgreSQL -> Axum -> device-auth -> HTTP -> SQLite path.
          # It is an ignored target by design and is a hard-fail acceptance
          # gate here; no retry or continue-on-error is permitted.
          cargo test -p synveil-api --test desktop_process_postgres --locked -- --ignored --test-threads=1 --nocapture live_pg17_process_authentication_and_graceful_shutdown
          cargo test -p synveil-client --lib --locked
          cargo test -p synveil-client-sync --lib --locked host::tests
          cargo test -p synveil-client-sync --lib --locked runtime::tests

      # Systemd unit syntax validation (lightweight, no host install)
      - name: Validate systemd units
        run: |
          set -euo pipefail
          echo "Validating timer (must parse cleanly)..."
          systemd-analyze verify deploy/systemd/synveil-scheduled-maintenance.timer
          echo "Validating service syntax (patched ExecStart for isolated check)..."
          cp deploy/systemd/synveil-scheduled-maintenance.service /tmp/synveil-verify.service
          sed -i 's|ExecStart=/usr/bin/synveil-scheduled-maintenance-once|ExecStart=/usr/bin/true|' /tmp/synveil-verify.service
          systemd-analyze verify /tmp/synveil-verify.service
          echo "Checking required directives..."
          grep -q "^Type=oneshot" deploy/systemd/synveil-scheduled-maintenance.service
          grep -q "^ExecStart=/usr/bin/synveil-scheduled-maintenance-once" deploy/systemd/synveil-scheduled-maintenance.service
          grep -q "^Restart=no" deploy/systemd/synveil-scheduled-maintenance.service
          grep -q "^Persistent=true" deploy/systemd/synveil-scheduled-maintenance.timer
          grep -q "^OnCalendar=.*:00" deploy/systemd/synveil-scheduled-maintenance.timer
          grep -q "^RandomizedDelaySec=" deploy/systemd/synveil-scheduled-maintenance.timer
          grep -q "^WantedBy=timers.target" deploy/systemd/synveil-scheduled-maintenance.timer
          grep -q "EnvironmentFile=-/etc/synveil" deploy/systemd/synveil-scheduled-maintenance.service
          echo "systemd units valid"

      # Core scheduled-backup / scheduled-maintenance live suites.
      # Each suite runs against a fresh isolated database to avoid cross-suite
      # global-scheduler pollution (bootstrap singleton, schedule global tick).
      - name: "Prompt 61 — backup_scheduling_postgres (11)"
        run: |
          set -euo pipefail
          DB="p61_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test --test backup_scheduling_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 62 — backup_schedule_occurrences_postgres (9)"
        run: |
          set -euo pipefail
          DB="p62_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test --test backup_schedule_occurrences_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 63 — backup_schedule_handoffs_postgres (11)"
        run: |
          set -euo pipefail
          DB="p63_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test --test backup_schedule_handoffs_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 64–65 — backup_scheduler_tick_postgres (25)"
        run: |
          set -euo pipefail
          DB="p64_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test --test backup_scheduler_tick_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 66 — backup_scheduled_maintenance_worker_postgres (30)"
        run: |
          set -euo pipefail
          DB="p66_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test --test backup_scheduled_maintenance_worker_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 67 — backup_scheduled_maintenance_cycle_postgres (20)"
        run: |
          set -euo pipefail
          DB="p67_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test --test backup_scheduled_maintenance_cycle_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 68 — scheduled_maintenance_cycle_runner_postgres (15)"
        run: |
          set -euo pipefail
          DB="p68_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test --test scheduled_maintenance_cycle_runner_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 71 — scheduled_maintenance_oneshot_postgres (14)"
        run: |
          set -euo pipefail
          DB="p71_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test --test scheduled_maintenance_oneshot_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 72 — scheduled_maintenance_lifecycle_postgres (13)"
        run: |
          set -euo pipefail
          DB="p72_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test --test scheduled_maintenance_lifecycle_postgres -- --ignored --test-threads=1 --nocapture

      # Prompt 49 and other affected backup suites
      - name: "Prompt 49 — backup_maintenance_postgres (9)"
        run: |
          set -euo pipefail
          DB="p49_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test --test backup_maintenance_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Backup — backup_postgres (metadata, lifecycle & manifest)"
        run: |
          set -euo pipefail
          DB="bpost_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-metadata --test backup_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Backup — backup_expiry_postgres"
        run: |
          set -euo pipefail
          DB="bexp_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-metadata --test backup_expiry_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Backup — backup_expiry_execution_postgres"
        run: |
          set -euo pipefail
          DB="bexe_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-metadata --test backup_expiry_execution_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Backup — backup_restore_postgres (metadata)"
        run: |
          set -euo pipefail
          DB="bres_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-metadata --test backup_restore_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Backup — backup_prune_postgres (metadata, 28)"
        run: |
          set -euo pipefail
          DB="bpru_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
