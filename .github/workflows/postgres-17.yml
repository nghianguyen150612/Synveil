          cargo test -p synveil-metadata --test backup_prune_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Backup — backup_retention_postgres"
        run: |
          set -euo pipefail
          DB="bret_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-metadata --test backup_retention_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Backup API — backup_prune_postgres (live, bootstrap-isolated)"
        run: |
          set -euo pipefail
          DB="bapi_pru_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-api --test backup_prune_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Backup API — backup_read_postgres (live, bootstrap-isolated)"
        run: |
          set -euo pipefail
          DB="bapi_read_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-api --test backup_read_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Backup API — backup_mutation_postgres (live, bootstrap-isolated)"
        run: |
          set -euo pipefail
          DB="bapi_mut_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-api --test backup_mutation_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 69 — dedicated 12×25 concurrency proof"
        run: |
          set -euo pipefail
          DB="p69stress_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-metadata --test scheduled_maintenance_prompt69_stress_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 79 — adversarial deployment PG17 suite"
        run: |
          set -euo pipefail
          DB="p79adv_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-api --test linux_deployment_adversarial_postgres -- --ignored --test-threads=1 --nocapture

      - name: "Prompt 79 — packaged maintenance runtime PG17 suite"
        run: |
          set -euo pipefail
          DB="p79pkg_$(date +%s)_$$_${RANDOM}"
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "CREATE DATABASE \"$DB\""
          export SYNVEIL_TEST_DATABASE_URL="postgresql://postgres:postgres@localhost:5432/$DB"
          cargo test -p synveil-api --test packaged_maintenance_runtime_postgres -- --ignored --test-threads=1 --nocapture

      - name: Emit Prompt 88 readiness gate
        if: success()
        run: |
          set -euo pipefail
          echo SYNVEIL_SYNC_CONFLICT_POLICY_FOUNDATION_READY

      - name: Emit Prompt 92 readiness gate
        if: success()
        run: |
          set -euo pipefail
          echo SYNVEIL_SYNC_RUNTIME_AGENT_READY

      - name: Emit Prompt 93 readiness gate
        if: success()
        run: |
          set -euo pipefail
          echo SYNVEIL_SYNC_RUNTIME_SIGNAL_INTEGRATION_READY

      - name: Post-failure diagnostics (disk, DB list)
        if: failure()
        run: |
          set +e
          echo "=== Disk usage ==="
          df -h || true
          echo "=== PostgreSQL databases ==="
          psql "postgresql://postgres:postgres@localhost:5432/postgres" -c "\l" || true
          echo "=== PostgreSQL logs (if available) ==="
          sudo cat /var/log/postgresql/*.log 2>/dev/null | tail -n 100 || true

      - name: Report PG17 gate summary
        if: always()
        run: |
          set -euo pipefail
          echo "PostgreSQL 17 gate completed. All live suites above must have passed."
          echo "SYNVEIL_TEST_DATABASE_URL used disposable superuser postgres/postgres on ephemeral service."
          echo "No test retry was used; failures would have failed the job (no continue-on-error)."
