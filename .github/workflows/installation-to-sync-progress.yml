name: installation to sync progress

on:
  pull_request:
  push:
    branches: [codex/p041-installation-to-sync-progress]

jobs:
  progress-projection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p synveil-client --locked controller
      - run: cargo test -p synveil-client-sync --locked first_sync_

  sync-truth-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p synveil-client-sync --locked result_interpretation_keeps_expected_states_typed
      - run: cargo test -p synveil-client-sync --locked sc1_idle_cycle_is_one_bounded_inbound_step
      - run: cargo test -p synveil-client-sync --locked first_sync_completion_requires_true_idle_after_progress
      - run: cargo test -p synveil-client-sync --locked first_sync_completion_waits_for_a_pending_follow_up_wake
      - run: cargo test -p synveil-client-sync --locked idle_periodic_poll_uses_the_configured_virtual_duration
      - run: cargo test -p synveil-client-sync --locked transient_backoff_doubles_and_success_resets_it
      - run: cargo test -p synveil-client-sync --locked user_pause_blocks_manual_and_background_wakes_until_explicit_resume

  desktop-and-qml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Qt and native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev-tools libgl1-mesa-dev xvfb \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            qml6-module-qtqml-workerscript qml6-module-qtquick-templates \
            qml6-module-qtquick-nativestyle
      - run: cargo test -p synveil-desktop --locked p041_
      - run: cargo test -p synveil-desktop --locked
      - run: cargo check -p synveil-desktop --locked
      - run: ./scripts/test-desktop-ui.sh

  docs-and-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p synveil-client-sync -p synveil-client -p synveil-desktop --all-targets --locked --no-deps -- -D warnings
      - run: python3 scripts/validate-installation-to-sync-progress.py
      - run: python3 -m py_compile scripts/validate-installation-to-sync-progress.py
      - run: ./scripts/validate-docs.sh
      - run: ./scripts/validate-install-acceptance.sh
      - run: git diff --check
