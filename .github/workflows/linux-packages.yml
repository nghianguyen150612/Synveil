name: Linux native packages (DEB + RPM)

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-linux-packages
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SYNVEIL_ENABLE_QMLCACHEGEN_WRAPPER: "1"

jobs:
  linux-packages:
    name: Build and validate DEB + RPM (unsigned CI artifacts)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native packaging tooling
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            dpkg-dev rpm fakeroot systemd shellcheck \
            pkg-config libdbus-1-dev \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev-tools \
            qt6-qpa-plugins \
            qml6-module-qtqml qml6-module-qtqml-models qml6-module-qtqml-workerscript \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-dialogs \
            qml6-module-qtquick-layouts qml6-module-qtquick-templates qml6-module-qtquick-window
          sudo install -d -m 0777 /usr/src/synveil

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify single version source (Cargo.toml)
        run: |
          set -euo pipefail
          grep -A3 '\[workspace.package\]' Cargo.toml | grep 'version'
          test -f deploy/packages/common/version.sh
          bash -c 'source deploy/packages/common/version.sh && synveil_cargo_version'

      - name: Shell syntax validation (packages + install lifecycle)
        run: |
          set -euo pipefail
          bash -n deploy/packages/build.sh
          bash -n deploy/packages/common/version.sh
          bash -n deploy/packages/common/arch.sh
          bash -n deploy/packages/common/payload.sh
          bash -n deploy/packages/common/reproducible.sh
          bash -n scripts/validate-release-artifacts.sh
          bash -n scripts/validate-release-manifest.sh
          bash -n scripts/validate-rpm-package-ux.sh
          bash -n scripts/verify-release-build-reproducibility.sh
          bash -n scripts/diagnose-desktop-reproducibility.sh
          bash -n scripts/linux-acceptance-vm.sh
          sh -n deploy/packages/debian/postinst
          sh -n deploy/packages/debian/prerm
          sh -n deploy/packages/debian/postrm
          bash -n deploy/install/install.sh
          bash -n deploy/install/uninstall.sh
          bash -n deploy/install/common.sh
          bash -n deploy/install/quick-install.sh
          bash -n scripts/run-linux-quick-install-acceptance.sh
          shellcheck -S warning \
            deploy/packages/build.sh deploy/packages/build-windows.sh \
            deploy/packages/common/reproducible.sh \
            scripts/validate-release-artifacts.sh \
            scripts/verify-release-build-reproducibility.sh \
            scripts/diagnose-desktop-reproducibility.sh \
            deploy/install/quick-install.sh scripts/run-linux-quick-install-acceptance.sh \
            deploy/packages/debian/postinst deploy/packages/debian/prerm deploy/packages/debian/postrm

      - name: Prompt017 static and adversarial quick-install contracts
        run: ./scripts/validate-linux-quick-install.sh

      - name: Prompt018 platform policy and adversarial fixture matrix
        run: ./scripts/validate-linux-platform-detection.sh

      - name: Prompt013 DEB UX source and CI ordering contract
        run: ./scripts/validate-debian-package-ux.sh

      - name: Prompt014 RPM UX source contract
        run: ./scripts/validate-rpm-package-ux.sh

      - name: Build release binary + DEB + RPM
        run: |
          set -euo pipefail
          ./deploy/packages/build.sh --format=all
          ls -la target/packages/

      - name: Rebuild release binaries after clearing release outputs
        run: scripts/verify-release-build-reproducibility.sh

      - name: DEB inspection (dpkg-deb info + contents)
        run: |
          set -euo pipefail
          DEB="$(ls target/packages/*.deb | head -n 1)"
          echo "DEB=$DEB"
          dpkg-deb --info "$DEB"
          dpkg-deb --contents "$DEB"
          for path in \
            ./usr/bin/synveil-client \
            ./usr/bin/synveil-desktop \
            ./usr/bin/synveil-scheduled-maintenance-once \
            ./usr/lib/systemd/user/synveil-client.service \
            ./usr/share/applications/synveil.desktop \
            ./usr/share/icons/hicolor/scalable/apps/synveil.svg \
            ./usr/share/doc/synveil/LICENSE \
            ./usr/share/doc/synveil/NOTICE; do
            dpkg-deb --contents "$DEB" | grep -F " $path"
          done
          if dpkg-deb --contents "$DEB" | grep -F '/usr/lib/systemd/system/synveil-client.service'; then
            echo 'user service was incorrectly packaged as a system service' >&2
            exit 1
          fi
          dpkg-deb --field "$DEB" Depends | grep -F 'libdbus-1-3'
          dpkg-deb --field "$DEB" Depends | grep -F 'libsystemd0'

      - name: RPM inspection (query info + list + requires)
        run: |
          set -euo pipefail
          RPM="$(ls target/packages/*.rpm | grep -v '.src.' | head -n 1)"
          echo "RPM=$RPM"
          rpm -qpi "$RPM"
          rpm -qpl -v "$RPM"
          rpm -qp --requires "$RPM"
          python3 scripts/validate-rpm-package-ux.py --rpm "$RPM"

      - name: Reproducible DEB and RPM rebuilds
        run: |
          set -euo pipefail
          ./deploy/packages/build.sh --format=all \
            --output-dir=target/packages-reproducible \
            --binary=target/release/synveil-scheduled-maintenance-once \
            --client-binary=target/release/synveil-client \
            --desktop-binary=target/release/synveil-desktop
          DEB="$(ls target/packages/*.deb | head -n 1)"
          DEB_REPRO="$(ls target/packages-reproducible/*.deb | head -n 1)"
          RPM="$(ls target/packages/*.rpm | grep -v '.src.' | head -n 1)"
          RPM_REPRO="$(ls target/packages-reproducible/*.rpm | grep -v '.src.' | head -n 1)"
          source deploy/packages/common/reproducible.sh
          synveil_require_identical_artifacts "$DEB" "$DEB_REPRO" DEB
          synveil_require_identical_artifacts "$RPM" "$RPM_REPRO" RPM
          synveil_require_identical_artifacts \
            target/packages/SYNVEIL-LINUX-ARTIFACT-MANIFEST.txt \
            target/packages-reproducible/SYNVEIL-LINUX-ARTIFACT-MANIFEST.txt \
            release-artifact-manifest
          synveil_require_identical_artifacts \
            target/packages/SYNVEIL-RELEASE-MANIFEST.json \
            target/packages-reproducible/SYNVEIL-RELEASE-MANIFEST.json \
            unified-release-manifest
          sha256sum "$DEB" "$DEB_REPRO" "$RPM" "$RPM_REPRO"

      - name: Validate release artifact provenance and metadata
        run: |
          set -euo pipefail
          scripts/validate-release-artifacts.sh \
            --manifest=target/packages/SYNVEIL-LINUX-ARTIFACT-MANIFEST.txt
          scripts/validate-release-artifacts.sh \
            --manifest=target/packages-reproducible/SYNVEIL-LINUX-ARTIFACT-MANIFEST.txt
          python3 scripts/release_manifest.py validate --artifact-root target/packages \
            target/packages/SYNVEIL-RELEASE-MANIFEST.json
          python3 scripts/release_manifest.py validate --artifact-root target/packages-reproducible \
            target/packages-reproducible/SYNVEIL-RELEASE-MANIFEST.json
          ./scripts/validate-release-manifest.sh

      - name: Static packaging units (version/arch/metadata/parity/safety)
        run: |
          set -euo pipefail
          cargo test -p synveil-metadata --test linux_native_packaging_units --locked -- --nocapture
          cargo test -p synveil-metadata --test release_artifact_units --locked -- --nocapture
          cargo test -p synveil-metadata --test production_packaging_units --locked -- --nocapture
          cargo test -p synveil-metadata --test linux_desktop_launch_units --locked -- --nocapture
          cargo test -p synveil-metadata --test windows_desktop_packaging_units --locked -- --nocapture

      - name: Prompt 75/76/78 focused regressions (identity/install/sandbox/lifecycle)
        run: |
          set -euo pipefail
          cargo test -p synveil-metadata --test linux_service_identity_units -- --nocapture
          cargo test -p synveil-metadata --test linux_install_lifecycle -- --nocapture
          cargo test -p synveil-metadata --test linux_sandbox_hardening_units -- --nocapture
          cargo test -p synveil-metadata --test scheduled_maintenance_lifecycle_units -- --nocapture

      - name: P020 isolated sysusers/tmpfiles validation
        run: |
          set -euo pipefail
          cargo test -p synveil-metadata --test systemd_isolated_fragments --locked -- --nocapture

      - name: Prompt 79 adversarial deployment units
        run: |
          set -euo pipefail
          cargo test -p synveil-metadata --test linux_deployment_adversarial_units -- --nocapture

      - name: systemd unit verification
        run: |
          set -euo pipefail
          systemd-analyze verify deploy/systemd/synveil-scheduled-maintenance.timer
          cp deploy/systemd/synveil-scheduled-maintenance.service /tmp/synveil-pkg-verify.service
          sed -i 's|ExecStart=/usr/bin/synveil-scheduled-maintenance-once|ExecStart=/usr/bin/true|' /tmp/synveil-pkg-verify.service
          systemd-analyze verify /tmp/synveil-pkg-verify.service
          sed 's|ExecStart=/usr/bin/synveil-client|ExecStart=/usr/bin/true|' \
            deploy/systemd-user/synveil-client.service > /tmp/synveil-pkg-verify-user.service
          systemd-analyze verify /tmp/synveil-pkg-verify-user.service

      - name: Upload unsigned package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synveil-linux-packages
          path: |
            target/packages/*.deb
            target/packages/*.rpm
          if-no-files-found: error

      - name: Report packaging summary
        if: always()
        run: |
          # Explicit diagnostic branch (not a masked gate): report checksums when
          # artifacts exist, otherwise state that the build step above failed.
          set -euo pipefail
          echo "Unsigned CI artifacts only; package signing deferred to release engineering."
          echo "No APT/YUM repository is published by this workflow."
          if ls target/packages/synveil_* >/dev/null 2>&1; then
            sha256sum target/packages/synveil_*
          else
            echo "no package artifacts present (build step failed; see earlier steps)"
          fi

  desktop-qt-reproducibility:
    name: Desktop Qt reproducibility with generated-input diagnosis
    # Hosted CI is the authoritative environment for Qt/reproducibility
    # validation. The desktop shell cannot be built in a sandbox without Qt 6,
    # so no local run may be cited as evidence for this gate.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install native Qt and packaging toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libdbus-1-dev \
            qt6-base-dev qt6-declarative-dev qt6-tools-dev-tools \
            qml6-module-qtqml qml6-module-qtqml-models \
            qml6-module-qtquick qml6-module-qtquick-controls \
            qml6-module-qtquick-layouts qml6-module-qtquick-window \
            readelf file
          sudo install -d -m 0777 /usr/src/synveil

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Record the QML toolchain under test
        run: |
          set -euo pipefail
          {
            echo "qmake=$(command -v qmake6 || command -v qmake || echo unavailable)"
            if command -v qmake6 >/dev/null 2>&1; then
              qmake6 -query QT_VERSION
              qmake6 -query QT_HOST_LIBEXECS
            elif command -v qmake >/dev/null 2>&1; then
              qmake -query QT_VERSION
              qmake -query QT_HOST_LIBEXECS
            else
              echo "qmake=unavailable"
            fi
            echo "rustc=$(rustc -V)"
          } | tee qt-toolchain.txt

      - name: Build two independent release trees and gate byte-identity
        env:
          # Retain both trees so the diagnosis below can run on a passing build
          # as well as a failing one.
          SYNVEIL_REPRO_KEEP_BUILD_TREES: "1"
        run: scripts/verify-release-build-reproducibility.sh

      - name: Compare generated QML/C++ inputs and binary sections
        # Runs unconditionally. A green gate can still hide a checkout-dependent
        # generated input, and this comparison is what proves otherwise.
        if: always()
        run: |
          set -euo pipefail
          mapfile -t trees < <(
            find target -maxdepth 1 -type d -name 'synveil-repro-build-*' | LC_ALL=C sort
          )
          if [[ ${#trees[@]} -ne 2 ]]; then
            echo "expected exactly two retained build trees, found ${#trees[@]}" >&2
            printf '%s\n' "${trees[@]:-none}" >&2
            exit 1
          fi
          scripts/diagnose-desktop-reproducibility.sh \
            "${trees[0]}" "${trees[1]}" target/synveil-repro-diagnosis

      - name: Show every absolute path embedded in the generated QML output
        # The root cause under investigation is an absolute QML source path in
        # generated C++. This prints what is actually there, so a hosted run
        # records the current state instead of only its pass/fail verdict.
        if: always()
        run: |
          set -euo pipefail
          report=target/synveil-repro-diagnosis/qml-absolute-paths.txt
          mkdir -p "$(dirname "$report")"
          : > "$report"
          mapfile -t trees < <(
            find target -maxdepth 1 -type d -name 'synveil-repro-build-*' | LC_ALL=C sort
          )
          for tree in "${trees[@]:-}"; do
            [[ -d "$tree" ]] || continue
            while IFS= read -r file; do
              grep -aoE '(/usr/src/synveil|/home/[!-~]{0,120}|/tmp/[!-~]{0,120})' "$file" 2>/dev/null |
                sort -u | while read -r marker; do
                  printf '%s :: %s\n' "${file#"$tree"/}" "$marker" >> "$report"
                done
            done < <(
              find "$tree" -path '*qmlcachegen*' -type f \( -name '*.cpp' -o -name '*.h' \) 2>/dev/null |
                LC_ALL=C sort
            )
          done
          echo "--- absolute paths found in generated qmlcachegen output ---"
          if [[ -s "$report" ]]; then
            cat "$report"
          else
            echo "(none: generated QML C++ carries no absolute path)"
          fi

      - name: Upload desktop reproducibility diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synveil-desktop-repro-diagnosis
          path: |
            target/synveil-repro-diagnosis/
            qt-toolchain.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Remove retained build trees
        if: always()
        run: rm -rf target/synveil-repro-build-*

  systemd-249-compat:
    name: sysusers/tmpfiles validation on systemd 249
    # Ubuntu 22.04 ships systemd 249, which has no --dry-run and no --graceful.
    # Running the fragment validation here proves the version-compatible
    # isolated strategy actually works on that systemd rather than only on the
    # newer runners the rest of CI uses.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Report the systemd version under test
        run: |
          set -euo pipefail
          systemd-tmpfiles --version | head -n 1
          if systemd-tmpfiles --help 2>&1 | grep -q -- '--dry-run'; then
            echo 'unexpected: this image advertises --dry-run; the 249 path would be untested' >&2
          else
            echo 'confirmed: --dry-run is absent, so the isolated --root path is exercised'
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Validate shipped fragments and lifecycle regressions
        run: |
          set -euo pipefail
          cargo test -p synveil-metadata --test systemd_isolated_fragments --locked -- --nocapture
          cargo test -p synveil-metadata --test linux_service_identity_units --locked -- --nocapture
          cargo test -p synveil-metadata --test linux_install_lifecycle --locked -- --nocapture

  deb-native-ux:
    name: APT install, non-root launch, removal, and preservation
    needs: linux-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact package source
        uses: actions/checkout@v4

      - name: Download exact newly-built package artifact
        uses: actions/download-artifact@v4
        with:
          name: synveil-linux-packages
          path: target/packages

      - name: Install exact DEB through authenticated quick install and verify rerun
        run: |
          set -euo pipefail
          DETECTION="$(./deploy/install/quick-install.sh --detect-only)"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert (d["os_id"], d["version_id"], d["architecture"], d["profile"], d["artifact_type"], d["package_manager"]) == ("ubuntu", "24.04", "x86_64", "debian-x86_64", "deb", "APT")' "$DETECTION"
          DEB="$(find target/packages -maxdepth 1 -type f -name 'synveil_*_amd64.deb' -print -quit)"
          test -n "$DEB"
          python3 scripts/validate-debian-package-ux.py --deb "$DEB"
          if pgrep -x synveil-desktop || pgrep -x synveil-client; then
            echo 'Synveil unexpectedly running before package installation' >&2
            exit 1
          fi
          VERSION="$(dpkg-deb --field "$DEB" Version | cut -d- -f1)"
          ./scripts/run-linux-quick-install-acceptance.sh deb "$PWD/$DEB" "$VERSION"
          test -x /usr/bin/synveil-desktop
          test -x /usr/bin/synveil-client
          test -f /usr/share/applications/synveil.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/synveil.svg
          test -f /usr/lib/systemd/user/synveil-client.service
          if pgrep -x synveil-desktop || pgrep -x synveil-client; then
            echo 'package installation auto-launched Synveil' >&2
            exit 1
          fi
          if systemctl --user is-enabled synveil-client.service 2>/dev/null; then
            echo 'package installation enabled the user client service' >&2
            exit 1
          fi
          test ! -e "$HOME/.config/autostart/synveil.desktop"

      - name: Launch installed desktop offscreen as non-root runner
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          SMOKE_ROOT="$(mktemp -d "$RUNNER_TEMP/synveil-installed-smoke.XXXXXX")"
          mkdir -p "$SMOKE_ROOT/config" "$SMOKE_ROOT/data" "$SMOKE_ROOT/cache" "$SMOKE_ROOT/runtime"
          chmod 700 "$SMOKE_ROOT/runtime"
          env -u CARGO_HOME -u CARGO_TARGET_DIR -u QML2_IMPORT_PATH -u QT_PLUGIN_PATH \
            HOME="$SMOKE_ROOT" \
            XDG_CONFIG_HOME="$SMOKE_ROOT/config" \
            XDG_DATA_HOME="$SMOKE_ROOT/data" \
            XDG_CACHE_HOME="$SMOKE_ROOT/cache" \
            XDG_RUNTIME_DIR="$SMOKE_ROOT/runtime" \
            SYNVEIL_CONFIG_DIR="$SMOKE_ROOT/config/synveil" \
            SYNVEIL_DATA_DIR="$SMOKE_ROOT/data/synveil" \
            SYNVEIL_CACHE_DIR="$SMOKE_ROOT/cache/synveil" \
            SYNVEIL_RUNTIME_DIR="$SMOKE_ROOT/runtime/synveil" \
            SYNVEIL_CLIENT_CONFIG="$SMOKE_ROOT/config/synveil/client.conf" \
            QT_QPA_PLATFORM=offscreen QML_DISABLE_DISK_CACHE=1 \
            timeout 15s /usr/bin/synveil-desktop --qml-smoke-test

      - name: Remove natively and verify durable state preservation
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/synveil" "$HOME/.local/state/synveil"
          printf 'p013-config\n' > "$HOME/.config/synveil/p013-preserve"
          printf 'p013-profile\n' > "$HOME/.local/state/synveil/p013-preserve"
          sudo mkdir -p /etc/synveil /var/lib/synveil
          printf 'p013-admin-config\n' | sudo tee /etc/synveil/p013-preserve >/dev/null
          printf 'p013-app-state\n' | sudo tee /var/lib/synveil/p013-preserve >/dev/null
          sudo apt-get remove -y synveil
          for path in \
            /usr/bin/synveil-desktop \
            /usr/bin/synveil-client \
            /usr/share/applications/synveil.desktop \
            /usr/share/icons/hicolor/scalable/apps/synveil.svg \
            /usr/lib/systemd/user/synveil-client.service; do
            test ! -e "$path"
          done
          test "$(cat "$HOME/.config/synveil/p013-preserve")" = p013-config
          test "$(cat "$HOME/.local/state/synveil/p013-preserve")" = p013-profile
          test "$(sudo cat /etc/synveil/p013-preserve)" = p013-admin-config
          test "$(sudo cat /var/lib/synveil/p013-preserve)" = p013-app-state

  rpm-native-ux:
    name: Fedora 42 userspace DNF install, launch, erase, and preservation
    needs: linux-packages
    runs-on: ubuntu-latest
    container: fedora:42
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Fedora acceptance tooling
        run: |
          set -euo pipefail
          dnf install -y git findutils procps-ng shadow-utils util-linux sudo openssl python3

      - name: Check out exact package source
        uses: actions/checkout@v4

      - name: Download exact newly-built package artifact
        uses: actions/download-artifact@v4
        with:
          name: synveil-linux-packages
          path: target/packages

      - name: DNF install exact RPM through authenticated quick install and verify rerun
        run: |
          set -euo pipefail
          DETECTION="$(./deploy/install/quick-install.sh --detect-only)"
          python3 -c 'import json,sys; d=json.loads(sys.argv[1]); assert (d["os_id"], d["version_id"], d["architecture"], d["profile"], d["artifact_type"], d["package_manager"]) == ("fedora", "42", "x86_64", "fedora-x86_64", "rpm", "DNF")' "$DETECTION"
          RPM="$(find target/packages -maxdepth 1 -type f -name 'synveil-*.x86_64.rpm' -print -quit)"
          test -n "$RPM"
          python3 scripts/validate-rpm-package-ux.py --rpm "$RPM"
          if pgrep -x synveil-desktop || pgrep -x synveil-client; then
            echo 'Synveil unexpectedly running before package installation' >&2
            exit 1
          fi
          useradd --create-home --user-group synveil-installer
          printf 'synveil-installer ALL=(root) NOPASSWD: /usr/bin/dnf\n' > /etc/sudoers.d/synveil-installer
          chmod 0440 /etc/sudoers.d/synveil-installer
          chown -R synveil-installer:synveil-installer "$PWD"
          VERSION="$(rpm -qp --qf '%{VERSION}' "$RPM")"
          runuser -u synveil-installer -- ./scripts/run-linux-quick-install-acceptance.sh \
            rpm "$PWD/$RPM" "$VERSION"
          rpm -q synveil
          rpm -V synveil
          test -x /usr/bin/synveil-desktop
          test -x /usr/bin/synveil-client
          test -f /usr/share/applications/synveil.desktop
          test -f /usr/share/icons/hicolor/scalable/apps/synveil.svg
          test -f /usr/lib/systemd/user/synveil-client.service
          test ! -e /usr/lib/systemd/system/synveil-client.service
          if pgrep -x synveil-desktop || pgrep -x synveil-client; then
            echo 'RPM installation auto-launched Synveil' >&2
            exit 1
          fi
          test ! -e /etc/xdg/autostart/synveil.desktop
          if find /etc/systemd/user /root/.config/systemd/user -type l \
              -path '*/synveil-client.service' -print -quit 2>/dev/null | grep -q .; then
            echo 'RPM installation enabled the user client service' >&2
            exit 1
          fi

      - name: Installed non-root desktop smoke
        run: |
          set -euo pipefail
          useradd --create-home --user-group synveil-ci
          SMOKE_ROOT="$(mktemp -d /tmp/synveil-installed-smoke.XXXXXX)"
          mkdir -p "$SMOKE_ROOT/config" "$SMOKE_ROOT/data" "$SMOKE_ROOT/cache" "$SMOKE_ROOT/runtime"
          chown -R synveil-ci:synveil-ci "$SMOKE_ROOT"
          chmod 700 "$SMOKE_ROOT/runtime"
          runuser -u synveil-ci -- env \
            -u CARGO_HOME -u CARGO_TARGET_DIR -u QML2_IMPORT_PATH -u QT_PLUGIN_PATH \
            HOME="$SMOKE_ROOT" \
            XDG_CONFIG_HOME="$SMOKE_ROOT/config" \
            XDG_DATA_HOME="$SMOKE_ROOT/data" \
            XDG_CACHE_HOME="$SMOKE_ROOT/cache" \
            XDG_RUNTIME_DIR="$SMOKE_ROOT/runtime" \
            SYNVEIL_CONFIG_DIR="$SMOKE_ROOT/config/synveil" \
            SYNVEIL_DATA_DIR="$SMOKE_ROOT/data/synveil" \
            SYNVEIL_CACHE_DIR="$SMOKE_ROOT/cache/synveil" \
            SYNVEIL_RUNTIME_DIR="$SMOKE_ROOT/runtime/synveil" \
            SYNVEIL_CLIENT_CONFIG="$SMOKE_ROOT/config/synveil/client.conf" \
            QT_QPA_PLATFORM=offscreen QML_DISABLE_DISK_CACHE=1 \
            timeout 15s /usr/bin/synveil-desktop --qml-smoke-test

      - name: RPM erase and durable-state preservation
        run: |
          set -euo pipefail
          mkdir -p /etc/synveil /var/lib/synveil \
            /home/synveil-ci/.config/synveil /home/synveil-ci/.local/state/synveil \
            /tmp/synveil-external-library
          printf 'p014-admin-config\n' > /etc/synveil/p014-preserve
          printf 'p014-app-state\n' > /var/lib/synveil/p014-preserve
          printf 'p014-user-config\n' > /home/synveil-ci/.config/synveil/p014-preserve
          printf 'p014-profile\n' > /home/synveil-ci/.local/state/synveil/p014-preserve
          printf 'p014-library-data\n' > /tmp/synveil-external-library/p014-preserve
          chown -R synveil-ci:synveil-ci /home/synveil-ci/.config /home/synveil-ci/.local \
            /tmp/synveil-external-library
          dnf remove -y synveil
          if rpm -q synveil; then
            echo 'synveil remains in the RPM database after erase' >&2
            exit 1
          fi
          for path in \
            /usr/bin/synveil-desktop \
            /usr/bin/synveil-client \
            /usr/share/applications/synveil.desktop \
            /usr/share/icons/hicolor/scalable/apps/synveil.svg \
            /usr/lib/systemd/user/synveil-client.service; do
            test ! -e "$path"
          done
          test "$(cat /etc/synveil/p014-preserve)" = p014-admin-config
          test "$(cat /var/lib/synveil/p014-preserve)" = p014-app-state
          test "$(cat /home/synveil-ci/.config/synveil/p014-preserve)" = p014-user-config
          test "$(cat /home/synveil-ci/.local/state/synveil/p014-preserve)" = p014-profile
          test "$(cat /tmp/synveil-external-library/p014-preserve)" = p014-library-data
