name: Android CI

on:
  push:
    paths:
      - "clients/android/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "clients/android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      run_api36:
        description: "Run API 36 emulator instrumentation"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Android host gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: clients/android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Clean and assemble debug/release APKs and AAB
        run: ./gradlew --no-daemon clean assembleDebug assembleRelease bundleRelease

      - name: Inspect release APK and AAB
        run: ./scripts/validate-release-artifact.sh --apk=app/build/outputs/apk/release/app-release-unsigned.apk --aab=app/build/outputs/bundle/release/app-release.aab

      - name: Run unit tests
        run: ./gradlew test

      - name: Run Android lint
        run: ./gradlew lint

      - name: Upload unsigned release inspection artifacts
        uses: actions/upload-artifact@v4
        with:
          name: synveil-android-release-${{ github.sha }}
          retention-days: 14
          path: |
            clients/android/app/build/outputs/apk/release/app-release-unsigned.apk
            clients/android/app/build/outputs/bundle/release/app-release.aab
            clients/android/app/build/outputs/mapping/release/**

  api36-instrumentation:
    name: API 36 instrumentation (manual opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_api36 }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: clients/android
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run API 36 instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: Pixel_2
          script: ./gradlew --no-daemon connectedDebugAndroidTest
