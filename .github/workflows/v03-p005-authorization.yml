name: v0.3 P005 authorization PostgreSQL 17 regression

on:
  pull_request:
    paths:
      - "crates/api/tests/authorization_postgres.rs"
      - "crates/api/src/mutations.rs"
      - ".github/workflows/v03-p005-authorization.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  authorization-postgres17:
    name: P005 cross-device mutation regression (PostgreSQL 17)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    env:
      SYNVEIL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out exact PR merge candidate
        uses: actions/checkout@v4
      - name: Install API build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev postgresql-client
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Verify PostgreSQL 17 is healthy
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U postgres; then break; fi
            sleep 1
          done
          pg_isready -h 127.0.0.1 -p 5432 -U postgres
          version=$(psql "$SYNVEIL_TEST_DATABASE_URL" -t -A -c 'SHOW server_version;' | tr -d ' ')
          [[ "$version" == 17.* ]] || { echo "Expected PostgreSQL 17"; exit 1; }
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
      - name: Run explicit ignored P005 authorization probe
        run: |
          set -euo pipefail
          cargo test -p synveil-api --test authorization_postgres --locked -- --ignored --test-threads=1 --nocapture
