[package]
name = "synveil-server-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded native Host helper and production canonical-owner adapter"

[dependencies]
serde.workspace = true
serde_json.workspace = true
fs2.workspace = true
sha2.workspace = true
uuid.workspace = true
zeroize.workspace = true
url.workspace = true
synveil-server-bootstrap.workspace = true
synveil-server-config.workspace = true
synveil-server-storage.workspace = true
synveil-server-network.workspace = true
synveil-server-service = { path = "../server-service" }
synveil-core.workspace = true
synveil-auth.workspace = true
synveil-metadata.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["blocking"] }

[target.'cfg(target_os = "linux")'.dependencies]
nix = { workspace = true, features = ["socket", "poll"] }
libc.workspace = true

[[bin]]
name = "synveil-host-helper"
path = "src/bin/helper.rs"
