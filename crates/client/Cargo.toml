[package]
name = "synveil-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Enables only the external synchronization hook used by the ignored
# production-process/QML acceptance target. The default client binary has no
# recovery barrier or filesystem test-control path.
test-support = ["synveil-client-sync/test-support"]

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
synveil-client-sync.workspace = true
synveil-core.workspace = true
synveil-platform.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
