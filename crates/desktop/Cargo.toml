[package]
name = "synveil-desktop"
version.workspace = true
# CXX-Qt 0.10's generated bridge uses CXX syntax that is not yet compatible
# with Rust 2024 parsing; keep the native boundary on the supported edition.
edition = "2021"
license.workspace = true
publish.workspace = true
build = "build.rs"
autolib = false
autobins = false

[[bin]]
name = "synveil-desktop"
path = "src/main.rs"

[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
synveil-client.workspace = true
tokio.workspace = true
url.workspace = true
zeroize.workspace = true

[dev-dependencies]
uuid.workspace = true

[build-dependencies]
cxx-qt-build = "0.10"
cxx-gen.workspace = true
