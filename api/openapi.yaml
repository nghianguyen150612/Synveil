components:
  parameters:
    DeviceCredentialId:
      name: credential_id
      in: path
      required: true
      description: Non-secret UUIDv7 device credential identity; not bearer authority.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    BrowserCsrfHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required with browser-session cookie authority on this POST; not required for an actually authenticated device bearer. Invalid or mixed bearer requests never fall back to cookie/CSRF authority.
      schema:
        type: string
        minLength: 128
        maxLength: 128
        pattern: '^[A-Fa-f0-9]{128}$'
    DeviceId:
      name: device_id
      in: path
      required: true
      description: Opaque UUIDv7 registered device identifier; possession is not authorization and the device must belong to the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ConflictId:
      name: conflict_id
      in: path
      required: true
      description: Opaque UUIDv7 durable conflict identifier; possession is never authorization and exact owner, ACTIVE Device, and Library scope is rechecked.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    UploadSessionId:
      name: upload_session_id
      in: path
      required: true
      description: Opaque UUIDv7 upload-session identifier; possession is not authorization.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    UploadOffset:
      name: Upload-Offset
      in: header
      required: true
      description: Exact authoritative starting offset as canonical bounded unsigned decimal text.
      schema:
        $ref: '#/components/schemas/U64Decimal'
    LibraryId:
      name: library_id
      in: path
      required: true
      description: Opaque UUIDv7 library identifier owned by the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    NodeId:
      name: node_id
      in: path
      required: true
      description: Opaque UUIDv7 node identifier owned by the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    VersionId:
      name: version_id
      in: path
      required: true
      description: Opaque UUIDv7 immutable file-version identifier owned by the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ParentId:
      name: parent_id
      in: query
      required: false
      description: Active directory parent; omitted means the library root.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    BackupSetId:
      name: backup_set_id
      in: path
      required: true
      description: Opaque UUIDv7 logical backup-set identifier; possession is not authorization.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    BackupSnapshotId:
      name: snapshot_id
      in: path
      required: true
      description: Opaque UUIDv7 immutable backup-snapshot identifier; possession is not authorization.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    BackupMaintenanceRunId:
      name: run_id
      in: path
      required: true
      description: Opaque UUIDv7 maintenance-run identifier; possession is not authorization.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    BackupRestorePlanId:
      name: restore_plan_id
      in: path
      required: true
      description: Opaque UUIDv7 restore-plan identifier; possession is not authorization.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    BackupRestoreExecutionId:
      name: restore_execution_id
      in: path
      required: true
      description: Opaque UUIDv7 restore-execution identifier; possession is not authorization.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    BackupPrunePlanId:
