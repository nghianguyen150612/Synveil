      type: object
      additionalProperties: false
      required:
        - prune_plan_id
        - snapshot_id
        - backup_set_id
        - state
        - entry_count
        - distinct_content_count
        - retained_by_other_reference_count
        - would_become_unreferenced_count
        - impact_summary
        - created_at
      properties:
        prune_plan_id:
          $ref: '#/components/schemas/OpaqueId'
        snapshot_id:
          $ref: '#/components/schemas/OpaqueId'
        backup_set_id:
          $ref: '#/components/schemas/OpaqueId'
        state:
          $ref: '#/components/schemas/BackupPrunePlanState'
        entry_count:
          $ref: '#/components/schemas/U64Decimal'
        distinct_content_count:
          $ref: '#/components/schemas/U64Decimal'
        retained_by_other_reference_count:
          $ref: '#/components/schemas/U64Decimal'
        would_become_unreferenced_count:
          $ref: '#/components/schemas/U64Decimal'
        impact_summary:
          type: array
          minItems: 2
          maxItems: 2
          description: Two bounded aggregate buckets; never an unbounded per-content listing.
          items:
            $ref: '#/components/schemas/BackupPruneImpactSummary'
        created_at:
          type: string
          format: date-time
        stale_at:
          type: string
          format: date-time
          description: Present only when canonical revalidation has made the plan STALE.
    ExecuteBackupPrunePlanRequest:
      type: object
      additionalProperties: false
      required: [confirm_snapshot_id]
      properties:
        confirm_snapshot_id:
          allOf:
            - $ref: '#/components/schemas/OpaqueId'
          description: Must exactly equal the snapshot_id bound to the persisted prune plan; it confirms only retention-pin release and never physical deletion.
    BackupPruneExecutionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/BackupPruneExecution'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    BackupPruneExecution:
      type: object
      additionalProperties: false
      required:
        - prune_execution_id
        - prune_plan_id
        - snapshot_id
        - backup_set_id
        - released_content_reference_count
        - distinct_content_count
        - retained_elsewhere_count
        - gc_handoff_count
        - executed_at
      properties:
        prune_execution_id:
          $ref: '#/components/schemas/OpaqueId'
        prune_plan_id:
          $ref: '#/components/schemas/OpaqueId'
        snapshot_id:
          $ref: '#/components/schemas/OpaqueId'
        backup_set_id:
          $ref: '#/components/schemas/OpaqueId'
        released_content_reference_count:
          $ref: '#/components/schemas/U64Decimal'
        distinct_content_count:
          $ref: '#/components/schemas/U64Decimal'
        retained_elsewhere_count:
          $ref: '#/components/schemas/U64Decimal'
        gc_handoff_count:
          allOf:
            - $ref: '#/components/schemas/U64Decimal'
          description: Number of now-unreferenced content objects handed to the internal GC candidate pipeline; not deleted objects, freed bytes, or physically reclaimed bytes.
        executed_at:
          type: string
          format: date-time
    LibraryCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LibraryResource'
        page:
          $ref: '#/components/schemas/Page'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    LibraryResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/LibraryResource'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    NodeCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NodeResource'
        page:
          $ref: '#/components/schemas/Page'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    VersionCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VersionResource'
        page:
          $ref: '#/components/schemas/Page'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    VersionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/VersionResource'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    VersionRestoreResponse:
      type: object
      additionalProperties: false
      required: [data, node, meta]
      properties:
        data:
          $ref: '#/components/schemas/VersionResource'
        node:
          $ref: '#/components/schemas/RestoreNodeConcurrency'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RestoreNodeConcurrency:
      type: object
      additionalProperties: false
      required: [id, revision]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        revision:
          $ref: '#/components/schemas/U64Decimal'
    VersionResource:
      type: object
      additionalProperties: false
      required: [id, type, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: file_version
        attributes:
          $ref: '#/components/schemas/VersionAttributes'
    VersionAttributes:
      type: object
      additionalProperties: false
      required: [node_id, created_at, byte_length, sha256, is_current]
      properties:
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        created_at:
          type: string
          format: date-time
        byte_length:
          $ref: '#/components/schemas/U64Decimal'
        sha256:
          $ref: '#/components/schemas/Hash'
        is_current:
          type: boolean
    Page:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        next_cursor:
          type: string
          maxLength: 512
        has_more:
          type: boolean
    LibraryResource:
      type: object
      additionalProperties: false
      required: [id, type, revision, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: library
        revision:
          $ref: '#/components/schemas/U64Decimal'
        attributes:
          $ref: '#/components/schemas/LibraryAttributes'
    LibraryAttributes:
      type: object
      additionalProperties: false
      required: [name, root_node_id, status, created_at, updated_at]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        root_node_id:
          $ref: '#/components/schemas/OpaqueId'
        status:
          type: string
          enum: [ACTIVE, READ_ONLY, QUARANTINED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NodeResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/NodeResource'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    NodeResource:
      type: object
      additionalProperties: false
      required: [id, type, revision, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: node
        revision:
          $ref: '#/components/schemas/U64Decimal'
        attributes:
          $ref: '#/components/schemas/NodeAttributes'
    NodeAttributes:
      type: object
      additionalProperties: false
      required: [library_id, name, kind, state, created_at, updated_at, purge_eligible]
      properties:
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        parent_id:
          $ref: '#/components/schemas/OpaqueId'
        current_version_id:
          $ref: '#/components/schemas/OpaqueId'
          description: Current immutable file version, omitted when absent. Desktop requires exact agreement with the event at the same revision.
        name:
          type: string
          minLength: 1
          maxLength: 1024
        kind:
          type: string
          enum: [FILE, DIRECTORY]
        state:
          type: string
          enum: [ACTIVE, TRASHED, PURGING]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        trashed_at:
          type: string
          format: date-time
          description: Server-observed timestamp when the node entered TRASHED; omitted for ACTIVE nodes.
        restore_deadline:
          type: string
          format: date-time
          description: Derived inclusive retention deadline; omitted for ACTIVE nodes and never accepted from clients.
        purge_eligible:
          type: boolean
          description: Server-evaluated internal eligibility hint; true does not expose a public delete-now operation.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, login_key, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 1024
          description: Canonical user-visible login identifier.
        login_key:
          type: string
          minLength: 1
          maxLength: 1024
          description: Adapter-supplied canonical uniqueness key paired with login.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
    BootstrapAdminRequest:
      type: object
      additionalProperties: false
      required: [login, login_key, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 1024
          description: Canonical user-visible login identifier.
        login_key:
          type: string
          minLength: 1
          maxLength: 1024
          description: Adapter-supplied canonical uniqueness key paired with login.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          description: Initial administrator password; never returned or logged.
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AuthSessionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AuthSessionData:
      type: object
      additionalProperties: false
      required: [authenticated, user_id, is_instance_admin, session_id]
      properties:
        authenticated:
          type: boolean
          const: true
        user_id:
          $ref: '#/components/schemas/OpaqueId'
        is_instance_admin:
          type: boolean
        session_id:
          $ref: '#/components/schemas/OpaqueId'
        expires_at:
          type: string
          format: date-time
          description: Present on login issuance; current-session inspection may omit it.
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CsrfData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CsrfData:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          minLength: 128
          maxLength: 128
          pattern: '^[A-Fa-f0-9]{128}$'
    OpaqueRequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9._~-]+$'
      description: Diagnostic identifier; not an idempotency key or credential. Client hints containing reserved svd1_ or sve1_ machine-secret prefixes are replaced by a fresh server identifier before echoing or logging.
    OpaqueId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Opaque lowercase UUIDv7 public identifier.
    U64Decimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Non-negative integer serialized as canonical decimal text.
    Hash:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
      description: Algorithm-qualified canonical integrity hash.
    LiveProbe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: live
    ReadyProbe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    SystemHealthResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SystemHealthData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SystemHealthData:
      type: object
      additionalProperties: false
      required: [status, liveness, readiness, components]
      properties:
        status:
          type: string
          enum: [HEALTHY, DEGRADED, UNAVAILABLE, UNKNOWN]
        liveness:
          type: boolean
        readiness:
          type: boolean
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentHealth'
    ComponentHealth:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          enum: [runtime, paths, storage_discovery, secret_store, service_lifecycle]
        status:
          type: string
          enum: [HEALTHY, DEGRADED, UNAVAILABLE, UNKNOWN]
    BootstrapStatusResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [setup_required]
          properties:
            setup_required:
              type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          $ref: '#/components/schemas/OpaqueRequestId'
    ConflictNotOpenDetails:
      type: object
      additionalProperties: false
      required: [lifecycle]
      properties:
        lifecycle:
          type: string
          enum: [RESOLVED, DISMISSED]
      description: Stable conflict_not_open detail for a different decision submitted after terminal state.
    ResolutionConflictDetails:
      type: object
      additionalProperties: false
      required: [resolution_id, replayed, completed_at, reason, resource_id, server_epoch, server_sequence]
      properties:
        resolution_id:
          $ref: '#/components/schemas/ConflictResolutionId'
        replayed:
          type: boolean
          description: True when returning the exact persisted stale result after response loss.
        completed_at:
          type: string
          format: date-time
        reason:
          $ref: '#/components/schemas/ConflictReason'
        resource_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
        current_revision:
          $ref: '#/components/schemas/U64Decimal'
        current_state:
          type: string
          enum: [ACTIVE, TRASHED, PURGING]
        current_parent_id:
          $ref: '#/components/schemas/OpaqueId'
        current_name:
          type: string
          minLength: 1
          maxLength: 1024
        server_epoch:
          $ref: '#/components/schemas/U64Decimal'
        server_sequence:
          $ref: '#/components/schemas/U64Decimal'
      description: Durable stale manual-apply evidence. The conflict remains OPEN and no canonical event is emitted.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Stable machine-readable error code from the reviewed registry.
        message:
          type: string
          minLength: 1
          maxLength: 512
          description: Safe human-readable message; clients must not branch on it.
        request_id:
          $ref: '#/components/schemas/OpaqueRequestId'
        retryable:
          type: boolean
        details:
          anyOf:
            - $ref: '#/components/schemas/ClientMutationConflictDetails'
            - $ref: '#/components/schemas/ConflictNotOpenDetails'
            - $ref: '#/components/schemas/ResolutionConflictDetails'
            - type: object
              description: Operation-specific allow-listed details; never stack traces, paths, secrets, or content.
              additionalProperties: true
