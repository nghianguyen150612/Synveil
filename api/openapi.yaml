          type: string
          format: date-time
    NodeResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/NodeResource'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    NodeResource:
      type: object
      additionalProperties: false
      required: [id, type, revision, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: node
        revision:
          $ref: '#/components/schemas/U64Decimal'
        attributes:
          $ref: '#/components/schemas/NodeAttributes'
    NodeAttributes:
      type: object
      additionalProperties: false
      required: [library_id, name, kind, state, created_at, updated_at, purge_eligible]
      properties:
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        parent_id:
          $ref: '#/components/schemas/OpaqueId'
        current_version_id:
          $ref: '#/components/schemas/OpaqueId'
          description: Current immutable file version, omitted when absent. Desktop requires exact agreement with the event at the same revision.
        name:
          type: string
          minLength: 1
          maxLength: 1024
        kind:
          type: string
          enum: [FILE, DIRECTORY]
        state:
          type: string
          enum: [ACTIVE, TRASHED, PURGING]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        trashed_at:
          type: string
          format: date-time
          description: Server-observed timestamp when the node entered TRASHED; omitted for ACTIVE nodes.
        restore_deadline:
          type: string
          format: date-time
          description: Derived inclusive retention deadline; omitted for ACTIVE nodes and never accepted from clients.
        purge_eligible:
          type: boolean
          description: Server-evaluated internal eligibility hint; true does not expose a public delete-now operation.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, login_key, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 1024
          description: Canonical user-visible login identifier.
        login_key:
          type: string
          minLength: 1
          maxLength: 1024
          description: Adapter-supplied canonical uniqueness key paired with login.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
    BootstrapAdminRequest:
      type: object
      additionalProperties: false
      required: [login, login_key, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 1024
          description: Canonical user-visible login identifier.
        login_key:
          type: string
          minLength: 1
          maxLength: 1024
          description: Adapter-supplied canonical uniqueness key paired with login.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          description: Initial administrator password; never returned or logged.
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AuthSessionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AuthSessionData:
      type: object
      additionalProperties: false
      required: [authenticated, user_id, is_instance_admin, session_id]
      properties:
        authenticated:
          type: boolean
          const: true
        user_id:
          $ref: '#/components/schemas/OpaqueId'
        is_instance_admin:
          type: boolean
        session_id:
          $ref: '#/components/schemas/OpaqueId'
        expires_at:
          type: string
          format: date-time
          description: Present on login issuance; current-session inspection may omit it.
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CsrfData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CsrfData:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          minLength: 128
          maxLength: 128
          pattern: '^[A-Fa-f0-9]{128}$'
    OpaqueRequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9._~-]+$'
      description: Diagnostic identifier; not an idempotency key or credential. Client hints containing reserved svd1_ or sve1_ machine-secret prefixes are replaced by a fresh server identifier before echoing or logging.
    OpaqueId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Opaque lowercase UUIDv7 public identifier.
    U64Decimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Non-negative integer serialized as canonical decimal text.
    Hash:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
      description: Algorithm-qualified canonical integrity hash.
    LiveProbe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: live
    ReadyProbe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    SystemHealthResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SystemHealthData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SystemHealthData:
      type: object
      additionalProperties: false
      required: [status, liveness, readiness, components]
      properties:
        status:
          type: string
          enum: [HEALTHY, DEGRADED, UNAVAILABLE, UNKNOWN]
        liveness:
          type: boolean
        readiness:
          type: boolean
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentHealth'
    ComponentHealth:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          enum: [runtime, paths, storage_discovery, secret_store, service_lifecycle]
        status:
          type: string
          enum: [HEALTHY, DEGRADED, UNAVAILABLE, UNKNOWN]
    BootstrapStatusResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [setup_required]
          properties:
            setup_required:
              type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          $ref: '#/components/schemas/OpaqueRequestId'
    ConflictNotOpenDetails:
      type: object
      additionalProperties: false
      required: [lifecycle]
      properties:
        lifecycle:
          type: string
          enum: [RESOLVED, DISMISSED]
      description: Stable conflict_not_open detail for a different decision submitted after terminal state.
    ResolutionConflictDetails:
      type: object
      additionalProperties: false
      required: [resolution_id, replayed, completed_at, reason, resource_id, server_epoch, server_sequence]
      properties:
        resolution_id:
          $ref: '#/components/schemas/ConflictResolutionId'
        replayed:
          type: boolean
          description: True when returning the exact persisted stale result after response loss.
        completed_at:
          type: string
          format: date-time
        reason:
          $ref: '#/components/schemas/ConflictReason'
        resource_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
        current_revision:
          $ref: '#/components/schemas/U64Decimal'
        current_state:
          type: string
          enum: [ACTIVE, TRASHED, PURGING]
        current_parent_id:
          $ref: '#/components/schemas/OpaqueId'
        current_name:
          type: string
          minLength: 1
          maxLength: 1024
        server_epoch:
          $ref: '#/components/schemas/U64Decimal'
        server_sequence:
          $ref: '#/components/schemas/U64Decimal'
      description: Durable stale manual-apply evidence. The conflict remains OPEN and no canonical event is emitted.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Stable machine-readable error code from the reviewed registry.
        message:
          type: string
          minLength: 1
          maxLength: 512
          description: Safe human-readable message; clients must not branch on it.
        request_id:
          $ref: '#/components/schemas/OpaqueRequestId'
        retryable:
          type: boolean
        details:
          anyOf:
            - $ref: '#/components/schemas/ClientMutationConflictDetails'
            - $ref: '#/components/schemas/ConflictNotOpenDetails'
            - $ref: '#/components/schemas/ResolutionConflictDetails'
            - type: object
              description: Operation-specific allow-listed details; never stack traces, paths, secrets, or content.
              additionalProperties: true
