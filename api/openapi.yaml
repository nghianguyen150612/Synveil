openapi: 3.1.0
info:
  title: Synveil API
  version: 0.1.0-blueprint
  summary: Authenticated metadata and exact-offset resumable upload API contract
  description: |
    This is the checked-in OpenAPI contract for the authenticated logical
    file/folder metadata and resumable-upload slice. It records transport-wide conventions,
    foundation health routes, browser authentication transport, the first-run
    bootstrap boundary, owner-scoped library/root/node operations, security
    schemes, exact-offset raw-byte upload sessions, and shared response shapes.

    Upload creation, owner-scoped status, bounded streaming append, retry-safe
    completion, and abort are implemented through the transport-neutral upload
    application service. The API never exposes staging handles, object keys,
    physical paths, or backend credentials. Download, upload product UI, sync,
    backup, sharing, garbage collection, and device operations remain planned.
  contact:
    name: Synveil Architecture / Contracts
  license:
    name: MIT
    identifier: MIT
  x-synveil-status: HTTP_UPLOAD_IMPLEMENTED
  x-synveil-gate: SYNVEIL_HTTP_UPLOAD_READY
  x-synveil-next-step: |
    Review the completed Prompt 11-20 batch before beginning download,
    synchronization, backup, sharing, garbage collection, or device work.
servers:
  - url: /
    description: Deployment-relative base URL; TLS is supplied by the supported proxy topology.
tags:
  - name: Operations
    description: Foundation liveness/readiness probes and restricted health.
  - name: Authentication
    description: Implemented browser-session login, session inspection, CSRF issuance, and logout transport.
  - name: Bootstrap
    description: Implemented one-time setup status and first-administrator creation; no automatic session issuance.
  - name: Files
    description: Implemented authenticated owner-scoped logical library, directory, and node metadata operations; no byte transfer.
  - name: Uploads
    description: Implemented authenticated, CSRF-protected exact-offset upload sessions with bounded streaming byte append.
paths:
  /health/live:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Return process liveness
      x-synveil-status: SKELETON_IMPLEMENTED
      x-synveil-owner: DevOps / Release
      description: |
        An unversioned, unauthenticated deployment probe. It must not expose
        dependency, version, topology, configuration, or user-data details.
      security: []
      responses:
        '200':
          description: The process can answer requests.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveProbe'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Return bounded service readiness
      x-synveil-status: SKELETON_IMPLEMENTED
      x-synveil-owner: DevOps / Release
      description: |
        An unversioned deployment probe. A not-ready response is safe and
        intentionally coarse; detailed authenticated health belongs under the
        foundation /api/v1/system/health operation.
      security: []
      responses:
        '200':
          description: Required configured dependencies passed their bounded readiness checks.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyProbe'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /live:
    get:
      tags: [Operations]
      operationId: getShortLiveness
      summary: Return process liveness through the short probe alias
      x-synveil-status: SKELETON_IMPLEMENTED
      x-synveil-owner: DevOps / Release
      description: Compatibility alias for the canonical `/health/live` probe.
      security: []
      responses:
        '200':
          description: The process can answer requests.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveProbe'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ready:
    get:
      tags: [Operations]
      operationId: getShortReadiness
      summary: Return bounded service readiness through the short probe alias
      x-synveil-status: SKELETON_IMPLEMENTED
      x-synveil-owner: DevOps / Release
      description: Compatibility alias for the canonical `/health/ready` probe.
      security: []
      responses:
        '200':
          description: Required configured dependencies passed their bounded readiness checks.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyProbe'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an authenticated browser session
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Auth / Security, Rust Backend
      description: |
        Verify the canonical login identifier and password, then issue a new
        opaque browser session. The raw session credential is presented only
        in a Secure/HttpOnly host-only cookie and is never returned in JSON.
        Login is intentionally exempt from the authenticated-session CSRF
        requirement; deployments still use same-origin browser defaults and
        exact-origin policy for state-changing authenticated requests.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: A new authenticated browser session was created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current browser session
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Auth / Security, Rust Backend
      description: |
        Revoke the currently valid browser session and clear the matching
        session and CSRF cookies. A missing, malformed, expired, or already
        revoked session is handled as a safe repeated logout. A currently
        valid session requires the session-bound X-CSRF-Token header and
        same-origin request provenance.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Logout completed or was safely repeated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getCurrentSession
      summary: Return the safe current browser principal
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Auth / Security, Rust Backend
      description: |
        Validate the opaque browser session cookie and return only the safe
        current principal. The response never contains the raw session
        credential, verifier, password, or database row.
      security:
        - BrowserSession: []
      responses:
        '200':
          description: Safe current-session identity.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Issue a session-bound CSRF proof
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Auth / Security, Rust Backend
      description: |
        Issue a fresh signed double-submit proof bound to the authenticated
        browser session. The proof is returned for the web boundary and also
        written to a non-HttpOnly CSRF cookie; state-changing requests must
        send it in X-CSRF-Token. It is not accepted from a query parameter.
      security:
        - BrowserSession: []
      responses:
        '200':
          description: A fresh session-bound CSRF proof.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/system/health:
    get:
      tags: [Operations]
      operationId: getSystemHealth
      summary: Return restricted bounded system health
      x-synveil-status: SKELETON_IMPLEMENTED
      x-synveil-owner: Rust Backend / Operations
      description: |
        Foundation transport route for a richer health representation. The
        route is fail-closed until an authenticated system-health authorizer is
        supplied. It exposes bounded component states only; paths, provider
        URLs, credentials, stack traces, and topology details are excluded.
      security:
        - BrowserSession: []
        - DeviceBearer: []
      responses:
        '200':
          description: Authorized bounded system health.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/system/bootstrap-status:
    get:
      tags: [Bootstrap]
      operationId: getBootstrapStatus
      summary: Report whether first-run setup is still required
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Auth / Security, Rust Backend
      description: |
        Return only the minimum state needed to render first-run UX. The
        response contains no setup secret, password, database detail, or
        administrator identity and is always marked no-store. The route is
        intentionally bounded and has no distributed rate limiter in this
        phase; deployments must keep first-run exposure on a trusted/private
        or correctly terminated TLS network.
      security: []
      responses:
        '200':
          description: Current one-time bootstrap eligibility.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatusResponse'
        '503':
          $ref: '#/components/responses/BootstrapServiceUnavailable'
  /api/v1/bootstrap/admin:
    post:
      tags: [Bootstrap]
      operationId: createFirstAdmin
      summary: Create the first administrator and close setup
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Auth / Security, Rust Backend
      x-synveil-max-body-bytes: 16384
      description: |
        Create the first administrator through the existing race-safe
        bootstrap service. The request is strict, bounded JSON using the
        canonical login, login_key, and password fields. Browser requests are
        checked for same-origin provenance when Origin or Sec-Fetch-Site is
        present. No setup-secret field is part of the accepted contract, so
        deployment/network exposure is an explicit first-run trust assumption
        until a later installer or secret-gate contract is reviewed.

        A successful response reports setup_required=false and contains no
        password, verifier, session credential, or administrator record. This
        endpoint does not issue a browser session; the client must use the
        normal login route explicitly. Concurrent or repeated claims after the
        first successful transaction return bootstrap_closed and never reopen
        setup.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapAdminRequest'
      responses:
        '200':
          description: The first administrator was created and setup closed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatusResponse'
        '400':
          $ref: '#/components/responses/BootstrapInvalidRequest'
        '413':
          $ref: '#/components/responses/BootstrapPayloadTooLarge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/BootstrapClosed'
        '503':
          $ref: '#/components/responses/BootstrapServiceUnavailable'
  /api/v1/libraries:
    get:
      tags: [Files]
      operationId: listLibraries
      summary: List libraries owned by the authenticated user
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Metadata / Rust Backend
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A bounded owner-scoped library page.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryCollectionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/libraries/{library_id}/nodes:
    get:
      tags: [Files]
      operationId: listLibraryChildren
      summary: List active direct children under a library root or directory
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Metadata / Rust Backend
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/ParentId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A bounded active-child page in immutable node-ID order.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeCollectionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Files]
      operationId: createDirectory
      summary: Create an empty logical directory
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Metadata / Rust Backend
      x-synveil-max-body-bytes: 16384
      description: |
        Create a directory under the supplied active parent, or under the
        library root when parent_id is omitted. The operation writes only
        metadata. Raw logical-name semantics are preserved; this contract does
        not add filesystem normalization, case folding, reserved-name rules,
        or a sibling uniqueness policy.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDirectoryRequest'
      responses:
        '201':
          description: The empty directory was created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/nodes/{node_id}:
    get:
      tags: [Files]
      operationId: getNode
      summary: Read safe logical metadata for an owned node
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Metadata / Rust Backend
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
      responses:
        '200':
          description: Safe node metadata without bytes, object paths, or provider fields.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [Files]
      operationId: updateNodeMetadata
      summary: Rename or move an owned node
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Metadata / Rust Backend
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNodeRequest'
      responses:
        '200':
          description: The renamed or moved node metadata.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/nodes/{node_id}/trash:
    post:
      tags: [Files]
      operationId: trashNode
      summary: Logically delete an empty owned node
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Metadata / Rust Backend
      description: |
        Transition one non-root node to TRASHED without deleting file versions
        or object references. A directory with any child is rejected with
        invalid_state because the recursive subtree-precondition contract is
        still open. This route does not purge data.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The node is logically trashed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/nodes/{node_id}/restore:
    post:
      tags: [Files]
      operationId: restoreNode
      summary: Restore an owned trashed node under its active parent
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Metadata / Rust Backend
      description: |
        Restore a node only when its existing parent is present, active, and
        still valid. No guessed recovery destination or TrashEntry model is
        introduced by this metadata-only slice.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/NodeId'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: The node is active again.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidState'
        '428':
          $ref: '#/components/responses/PreconditionRequired'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/upload-sessions:
    post:
      tags: [Uploads]
      operationId: createUploadSession
      summary: Create an owner-scoped resumable upload session
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Storage / Uploads, Rust Backend
      x-synveil-max-json-body-bytes: 16384
      description: |
        Freeze either a CREATE_FILE destination or a REPLACE_CONTENT target and
        its canonical expected revision. The authenticated principal is the
        owner; no user_id is accepted from the client. Object keys, replica
        identifiers, staging handles, and physical paths are never returned.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadSessionRequest'
      responses:
        '201':
          description: The upload session was created with authoritative offset zero.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Upload-Offset:
              $ref: '#/components/headers/UploadOffset'
            Location:
              $ref: '#/components/headers/UploadLocation'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/UploadConflict'
        '413':
          $ref: '#/components/responses/UploadPayloadTooLarge'
        '507':
          $ref: '#/components/responses/CapacityUnavailable'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/upload-sessions/{upload_session_id}:
    get:
      tags: [Uploads]
      operationId: getUploadSession
      summary: Read safe upload status and the authoritative resume offset
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Storage / Uploads, Rust Backend
      description: |
        Return the owner-scoped upload projection and Upload-Offset header.
        Clients use this operation after any ambiguous PATCH outcome and resume
        from received_bytes. This safe read does not require a CSRF header.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
      responses:
        '200':
          description: Safe upload state and authoritative current offset.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Upload-Offset:
              $ref: '#/components/headers/UploadOffset'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [Uploads]
      operationId: appendUploadChunk
      summary: Stream a bounded raw-byte chunk at one exact offset
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Storage / Uploads, Rust Backend
      x-synveil-default-max-chunk-bytes: 8388608
      description: |
        Stream application/octet-stream bytes through the authoritative upload
        service. Upload-Offset is one canonical unsigned decimal value. A
        stale or gap offset appends nothing and returns the current offset with
        invalid_offset. The configured service chunk limit, 8 MiB by default,
        bounds the aggregate body without collecting it in memory.

        A connection may fail after one or more frames are durable but before
        the client receives the response. The recovery contract is always GET
        status, accept its Upload-Offset/received_bytes value as canonical, and
        resume from there. Never replay blindly or increment progress locally.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
        - $ref: '#/components/parameters/UploadOffset'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Non-empty raw bytes; never multipart, JSON, or base64.
      responses:
        '204':
          description: Accepted frames are durable and the returned offset is authoritative.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Upload-Offset:
              $ref: '#/components/headers/UploadOffset'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '400':
          $ref: '#/components/responses/InvalidUploadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '409':
          $ref: '#/components/responses/InvalidUploadOffset'
        '410':
          $ref: '#/components/responses/UploadExpired'
        '413':
          $ref: '#/components/responses/UploadPayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedUploadMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '507':
          $ref: '#/components/responses/CapacityUnavailable'
  /api/v1/upload-sessions/{upload_session_id}/complete:
    post:
      tags: [Uploads]
      operationId: completeUpload
      summary: Verify, promote, and logically commit an upload once
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Storage / Uploads, Rust Backend
      description: |
        Delegate completion to the validated upload application service. It
        verifies expected length and optional SHA-256, reconciles ambiguous
        promotion, rechecks REPLACE_CONTENT revision, and returns the same
        canonical completion on a successful retry. HTTP code does not write
        object, FileVersion, or replica rows directly.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Canonical completion metadata, including on a safe repeat.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCompletionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '409':
          $ref: '#/components/responses/UploadConflict'
        '410':
          $ref: '#/components/responses/UploadExpired'
        '412':
          $ref: '#/components/responses/UploadPreconditionFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/upload-sessions/{upload_session_id}/abort:
    post:
      tags: [Uploads]
      operationId: abortUpload
      summary: Abort an upload session through the application service
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Storage / Uploads, Rust Backend
      description: |
        Request abort through the owner-scoped upload service. A repeat is safe.
        API code never removes staging files or committed recoverable content.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Current safe session state after abort or a safe repeat.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Upload-Offset:
              $ref: '#/components/headers/UploadOffset'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    UploadSessionId:
      name: upload_session_id
      in: path
      required: true
      description: Opaque UUIDv7 upload-session identifier; possession is not authorization.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    UploadOffset:
      name: Upload-Offset
      in: header
      required: true
      description: Exact authoritative starting offset as canonical bounded unsigned decimal text.
      schema:
        $ref: '#/components/schemas/U64Decimal'
    LibraryId:
      name: library_id
      in: path
      required: true
      description: Opaque UUIDv7 library identifier owned by the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    NodeId:
      name: node_id
      in: path
      required: true
      description: Opaque UUIDv7 node identifier owned by the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ParentId:
      name: parent_id
      in: query
      required: false
      description: Active directory parent; omitted means the library root.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque bounded listing cursor scoped to this collection and parent.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Bounded page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Signed opaque node ETag returned by a prior safe read or mutation.
      schema:
        type: string
        minLength: 3
        maxLength: 256
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF proof issued by the authenticated CSRF endpoint; never use a query parameter.
      schema:
        type: string
        minLength: 128
        maxLength: 128
        pattern: '^[A-Fa-f0-9]{128}$'
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: synveil_session
      description: Opaque Secure/HttpOnly browser session; only its verifier is stored server-side.
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Scoped, rotatable, revocable device credential; never a password or URL parameter.
    PublicShareContext:
      type: apiKey
      in: cookie
      name: synveil_share
      description: Separate bounded public-share context; never promoted to a user session.
  headers:
    XRequestId:
      description: Trusted diagnostic request identifier echoed in the JSON envelope.
      schema:
        $ref: '#/components/schemas/OpaqueRequestId'
    ETag:
      description: Opaque quoted resource revision used by conditional mutation.
      schema:
        type: string
        minLength: 3
        maxLength: 256
    RetryAfter:
      description: Seconds or HTTP date for bounded retry backoff.
      schema:
        type: string
    SetCookie:
      description: Browser cookie attributes are defined by the server; raw session credentials are never JSON fields.
      schema:
        type: string
    CacheControl:
      description: Sensitive authentication, bootstrap, and upload responses are not cacheable.
      schema:
        type: string
        const: no-store
    UploadOffset:
      description: Authoritative durable byte offset for this upload session.
      schema:
        $ref: '#/components/schemas/U64Decimal'
    UploadLocation:
      description: Canonical status/resume resource for the created upload session.
      schema:
        type: string
        pattern: '^/api/v1/upload-sessions/[0-9a-f-]{36}$'
  responses:
    InvalidRequest:
      description: The request body or bounded input is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidUploadRequest:
      description: The upload request, empty body, Upload-Offset header, or bounded input is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidUploadOffset:
      description: The exact offset or current upload state conflicts; invalid_offset includes the authoritative Upload-Offset header and current_offset detail.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Upload-Offset:
          $ref: '#/components/headers/UploadOffset'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadConflict:
      description: The upload state, expected length, target revision, or completion result conflicts with the requested operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadNotFound:
      description: The upload session does not exist or is not owned by the authenticated principal.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadExpired:
      description: The upload session expired and cannot accept the requested mutation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadPreconditionFailed:
      description: Uploaded content does not match the declared canonical SHA-256 digest.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadPayloadTooLarge:
      description: The JSON command or aggregate raw-byte chunk exceeds its operation-specific limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedUploadMediaType:
      description: Raw upload append requires exactly application/octet-stream.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CapacityUnavailable:
      description: The upload cannot be admitted within current configured capacity.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource was not found or is not visible to the current principal.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VersionConflict:
      description: The node revision changed before the conditional mutation was applied.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: A required If-Match node ETag was omitted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidState:
      description: The metadata operation is not valid for the resource state.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required for the requested restricted operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Request provenance or CSRF proof could not be verified.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: The request exceeded a bounded abuse or concurrency limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: The process or a required operation dependency is unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BootstrapInvalidRequest:
      description: The bounded first-run request body is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BootstrapClosed:
      description: First-run setup was already closed by an earlier successful claim.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BootstrapPayloadTooLarge:
      description: The first-run request body exceeds the 16 KiB transport limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BootstrapServiceUnavailable:
      description: The bootstrap state or first-administrator operation is unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateUploadSessionRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateFileUploadRequest'
        - $ref: '#/components/schemas/ReplaceContentUploadRequest'
      discriminator:
        propertyName: operation
        mapping:
          CREATE_FILE: '#/components/schemas/CreateFileUploadRequest'
          REPLACE_CONTENT: '#/components/schemas/ReplaceContentUploadRequest'
    CreateFileUploadRequest:
      type: object
      additionalProperties: false
      required: [operation, library_id, parent_id, name, expected_bytes]
      properties:
        operation:
          type: string
          const: CREATE_FILE
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        parent_id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
          minLength: 1
          maxLength: 1024
          description: Raw logical name, never interpreted as an operating-system path.
        expected_bytes:
          $ref: '#/components/schemas/U64Decimal'
        expected_sha256:
          $ref: '#/components/schemas/Hash'
    ReplaceContentUploadRequest:
      type: object
      additionalProperties: false
      required: [operation, library_id, node_id, expected_revision, expected_bytes]
      properties:
        operation:
          type: string
          const: REPLACE_CONTENT
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
        expected_bytes:
          $ref: '#/components/schemas/U64Decimal'
        expected_sha256:
          $ref: '#/components/schemas/Hash'
    UploadSessionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/UploadSessionResource'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    UploadSessionResource:
      type: object
      additionalProperties: false
      required: [id, type, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: upload_session
        attributes:
          $ref: '#/components/schemas/UploadSessionAttributes'
    UploadSessionAttributes:
      type: object
      additionalProperties: false
      required:
        - operation
        - state
        - received_bytes
        - expected_bytes
        - created_at
        - updated_at
        - expires_at
        - target
      properties:
        operation:
          type: string
          enum: [CREATE_FILE, REPLACE_CONTENT]
        state:
          $ref: '#/components/schemas/UploadSessionState'
        received_bytes:
          $ref: '#/components/schemas/U64Decimal'
        expected_bytes:
          $ref: '#/components/schemas/U64Decimal'
        expected_sha256:
          $ref: '#/components/schemas/Hash'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        target:
          $ref: '#/components/schemas/UploadTarget'
        last_error_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Allow-listed stable diagnostic code only.
        terminal_failure_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Allow-listed stable terminal failure code only.
        completion:
          $ref: '#/components/schemas/UploadCompletionResource'
    UploadSessionState:
      type: string
      enum: [OPEN, VERIFYING, COMMITTING, COMMITTED, FAILED, EXPIRED, ABORTED]
    UploadTarget:
      oneOf:
        - $ref: '#/components/schemas/CreateFileUploadTarget'
        - $ref: '#/components/schemas/ReplaceContentUploadTarget'
      discriminator:
        propertyName: operation
        mapping:
          CREATE_FILE: '#/components/schemas/CreateFileUploadTarget'
          REPLACE_CONTENT: '#/components/schemas/ReplaceContentUploadTarget'
    CreateFileUploadTarget:
      type: object
      additionalProperties: false
      required: [operation, library_id, parent_id, node_id, name]
      properties:
        operation:
          type: string
          const: CREATE_FILE
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        parent_id:
          $ref: '#/components/schemas/OpaqueId'
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
          minLength: 1
          maxLength: 1024
    ReplaceContentUploadTarget:
      type: object
      additionalProperties: false
      required: [operation, library_id, node_id, expected_revision]
      properties:
        operation:
          type: string
          const: REPLACE_CONTENT
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
    UploadCompletionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/UploadCompletionResource'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    UploadCompletionResource:
      type: object
      additionalProperties: false
      required: [id, type, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: upload_completion
        attributes:
          $ref: '#/components/schemas/UploadCompletionAttributes'
    UploadCompletionAttributes:
      type: object
      additionalProperties: false
      required:
        - node_id
        - file_version_id
        - object_id
        - node_revision
        - bytes
        - sha256
        - committed_at
      properties:
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        file_version_id:
          $ref: '#/components/schemas/OpaqueId'
        object_id:
          $ref: '#/components/schemas/OpaqueId'
        node_revision:
          $ref: '#/components/schemas/U64Decimal'
        bytes:
          $ref: '#/components/schemas/U64Decimal'
        sha256:
          $ref: '#/components/schemas/Hash'
        committed_at:
          type: string
          format: date-time
    CreateDirectoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
          description: Raw logical directory name; no host-filesystem normalization is applied.
        parent_id:
          $ref: '#/components/schemas/OpaqueId'
    UpdateNodeRequest:
      oneOf:
        - $ref: '#/components/schemas/RenameNodeRequest'
        - $ref: '#/components/schemas/MoveNodeRequest'
      description: Exactly one logical metadata change is accepted per request.
    RenameNodeRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
    MoveNodeRequest:
      type: object
      additionalProperties: false
      required: [parent_id]
      properties:
        parent_id:
          $ref: '#/components/schemas/OpaqueId'
    LibraryCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LibraryResource'
        page:
          $ref: '#/components/schemas/Page'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    NodeCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NodeResource'
        page:
          $ref: '#/components/schemas/Page'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Page:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        next_cursor:
          type: string
          maxLength: 512
        has_more:
          type: boolean
    LibraryResource:
      type: object
      additionalProperties: false
      required: [id, type, revision, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: library
        revision:
          $ref: '#/components/schemas/U64Decimal'
        attributes:
          $ref: '#/components/schemas/LibraryAttributes'
    LibraryAttributes:
      type: object
      additionalProperties: false
      required: [name, root_node_id, status, created_at, updated_at]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        root_node_id:
          $ref: '#/components/schemas/OpaqueId'
        status:
          type: string
          enum: [ACTIVE, READ_ONLY, QUARANTINED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NodeResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/NodeResource'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    NodeResource:
      type: object
      additionalProperties: false
      required: [id, type, revision, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: node
        revision:
          $ref: '#/components/schemas/U64Decimal'
        attributes:
          $ref: '#/components/schemas/NodeAttributes'
    NodeAttributes:
      type: object
      additionalProperties: false
      required: [library_id, name, kind, state, created_at, updated_at]
      properties:
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        parent_id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
          minLength: 1
          maxLength: 1024
        kind:
          type: string
          enum: [FILE, DIRECTORY]
        state:
          type: string
          enum: [ACTIVE, TRASHED, PURGING]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, login_key, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 1024
          description: Canonical user-visible login identifier.
        login_key:
          type: string
          minLength: 1
          maxLength: 1024
          description: Adapter-supplied canonical uniqueness key paired with login.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
    BootstrapAdminRequest:
      type: object
      additionalProperties: false
      required: [login, login_key, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 1024
          description: Canonical user-visible login identifier.
        login_key:
          type: string
          minLength: 1
          maxLength: 1024
          description: Adapter-supplied canonical uniqueness key paired with login.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          description: Initial administrator password; never returned or logged.
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AuthSessionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AuthSessionData:
      type: object
      additionalProperties: false
      required: [authenticated, user_id, is_instance_admin, session_id]
      properties:
        authenticated:
          type: boolean
          const: true
        user_id:
          $ref: '#/components/schemas/OpaqueId'
        is_instance_admin:
          type: boolean
        session_id:
          $ref: '#/components/schemas/OpaqueId'
        expires_at:
          type: string
          format: date-time
          description: Present on login issuance; current-session inspection may omit it.
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CsrfData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CsrfData:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          minLength: 128
          maxLength: 128
          pattern: '^[A-Fa-f0-9]{128}$'
    OpaqueRequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9._~-]+$'
      description: Diagnostic identifier; not an idempotency key or credential.
    OpaqueId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Opaque lowercase UUIDv7 public identifier.
    U64Decimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Non-negative integer serialized as canonical decimal text.
    Hash:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
      description: Algorithm-qualified canonical integrity hash.
    LiveProbe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: live
    ReadyProbe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    SystemHealthResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SystemHealthData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SystemHealthData:
      type: object
      additionalProperties: false
      required: [status, liveness, readiness, components]
      properties:
        status:
          type: string
          enum: [HEALTHY, DEGRADED, UNAVAILABLE, UNKNOWN]
        liveness:
          type: boolean
        readiness:
          type: boolean
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentHealth'
    ComponentHealth:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          enum: [runtime, paths, storage_discovery, secret_store, service_lifecycle]
        status:
          type: string
          enum: [HEALTHY, DEGRADED, UNAVAILABLE, UNKNOWN]
    BootstrapStatusResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [setup_required]
          properties:
            setup_required:
              type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          $ref: '#/components/schemas/OpaqueRequestId'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Stable machine-readable error code from the reviewed registry.
        message:
          type: string
          minLength: 1
          maxLength: 512
          description: Safe human-readable message; clients must not branch on it.
        request_id:
          $ref: '#/components/schemas/OpaqueRequestId'
        retryable:
          type: boolean
        details:
          type: object
          description: Operation-specific allow-listed details; never stack traces, paths, secrets, or content.
          additionalProperties: true
