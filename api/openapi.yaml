    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque bounded listing cursor scoped to this collection and parent.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Bounded page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    ConflictLimit:
      name: limit
      in: query
      required: false
      description: Bounded OPEN-conflict page size; canonical unsigned decimal text only.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    ConflictCursor:
      name: cursor
      in: query
      required: false
      description: Opaque bounded HMAC-authenticated keyset cursor bound to owner, Device, Library, OPEN filter, and immutable descending order key; never authorization.
      schema:
        type: string
        minLength: 1
        maxLength: 384
    SyncLimit:
      name: limit
      in: query
      required: false
      description: Bounded incremental-feed page size; the server default is 100 and the maximum is 500.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 100
    RebaselineBootstrapId:
      name: bootstrap_id
      in: path
      required: true
