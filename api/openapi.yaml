          type: string
          format: date-time
    ConflictDetailResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ConflictDetailData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ConflictDetailData:
      type: object
      additionalProperties: false
      required: [conflict_id, original_client_mutation_id, mutation_kind, resource_id, reason, lifecycle, created_at, original_intent, historical_server_observation]
      properties:
        conflict_id:
          $ref: '#/components/schemas/SyncConflictId'
        original_client_mutation_id:
          $ref: '#/components/schemas/ClientMutationId'
        mutation_kind:
          $ref: '#/components/schemas/ClientMutationKind'
        resource_id:
          $ref: '#/components/schemas/OpaqueId'
        reason:
          $ref: '#/components/schemas/ConflictReason'
        lifecycle:
          $ref: '#/components/schemas/ConflictLifecycle'
        created_at:
          type: string
          format: date-time
        original_intent:
          $ref: '#/components/schemas/ConflictOriginalIntent'
        historical_server_observation:
          $ref: '#/components/schemas/ConflictHistoricalObservation'
        terminal_resolution:
          $ref: '#/components/schemas/ConflictTerminalResolution'
    ConflictOriginalIntent:
      type: object
      additionalProperties: false
