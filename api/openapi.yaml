        kind:
          $ref: '#/components/schemas/ClientMutationKind'
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        parent_node_id:
          $ref: '#/components/schemas/OpaqueId'
        requested_parent_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
        expected_parent_revision:
          $ref: '#/components/schemas/U64Decimal'
        requested_name:
          type: string
          minLength: 1
          maxLength: 1024
          description: Logical name only; never a filesystem path.
    ConflictHistoricalObservation:
      type: object
      additionalProperties: false
      required: [resource_id, reason, server_epoch_at_conflict, server_sequence_at_conflict]
      description: Immutable evidence captured when the original mutation conflicted; these fields are explicitly not current canonical truth.
      properties:
        resource_id:
          $ref: '#/components/schemas/OpaqueId'
        reason:
          $ref: '#/components/schemas/ConflictReason'
        original_expected_revision:
          $ref: '#/components/schemas/U64Decimal'
        server_revision_at_conflict:
          $ref: '#/components/schemas/U64Decimal'
        server_state_at_conflict:
          type: string
          enum: [ACTIVE, TRASHED, PURGING]
        server_parent_id_at_conflict:
          $ref: '#/components/schemas/OpaqueId'
        server_name_at_conflict:
          type: string
          minLength: 1
          maxLength: 1024
        server_epoch_at_conflict:
          $ref: '#/components/schemas/U64Decimal'
        server_sequence_at_conflict:
          $ref: '#/components/schemas/U64Decimal'
    ConflictTerminalResolution:
      type: object
      additionalProperties: false
      required: [resolution_id, action, completed_at]
      description: Present only for a terminal conflict; journal fields exist only for a successful APPLY_CLIENT_INTENT.
      properties:
        resolution_id:
          $ref: '#/components/schemas/ConflictResolutionId'
        action:
          $ref: '#/components/schemas/ConflictResolutionAction'
        completed_at:
          type: string
          format: date-time
        journal_event_id:
          $ref: '#/components/schemas/OpaqueId'
        journal_sequence:
          $ref: '#/components/schemas/U64Decimal'
    ConflictResolutionRequest:
      oneOf:
        - $ref: '#/components/schemas/AcceptServerResolutionRequest'
        - $ref: '#/components/schemas/ApplyClientIntentResolutionRequest'
      discriminator:
        propertyName: action
        mapping:
          ACCEPT_SERVER: '#/components/schemas/AcceptServerResolutionRequest'
          APPLY_CLIENT_INTENT: '#/components/schemas/ApplyClientIntentResolutionRequest'
      description: Strict manual-decision body. The 16 KiB body bound applies before deserialization, and unknown fields are rejected.
    AcceptServerResolutionRequest:
      type: object
      additionalProperties: false
      required: [resolution_id, action]
      properties:
        resolution_id:
          $ref: '#/components/schemas/ConflictResolutionId'
        action:
          type: string
          const: ACCEPT_SERVER
    ApplyClientIntentResolutionRequest:
      type: object
      additionalProperties: false
      required: [resolution_id, action, expected_current_revision]
      properties:
        resolution_id:
          $ref: '#/components/schemas/ConflictResolutionId'
        action:
          type: string
          const: APPLY_CLIENT_INTENT
        expected_current_revision:
          $ref: '#/components/schemas/U64Decimal'
        expected_current_parent_revision:
          allOf:
            - $ref: '#/components/schemas/U64Decimal'
          description: Required for MOVE_NODE and RESTORE_NODE; forbidden for CREATE_DIRECTORY, RENAME_NODE, and TRASH_NODE.
    ConflictResolutionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ConflictResolutionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ConflictResolutionData:
      type: object
      additionalProperties: false
      required: [outcome, conflict_id, resolution_id, action, lifecycle, replayed, completed_at]
      description: Durable terminal result. Same resolution ID and canonical fingerprint replays every value exactly except replayed becomes true.
      properties:
        outcome:
          type: string
          enum: [ACCEPTED_SERVER, APPLIED_CLIENT_INTENT]
        conflict_id:
          $ref: '#/components/schemas/SyncConflictId'
        resolution_id:
          $ref: '#/components/schemas/ConflictResolutionId'
        action:
          $ref: '#/components/schemas/ConflictResolutionAction'
        lifecycle:
          type: string
          enum: [RESOLVED, DISMISSED]
        replayed:
          type: boolean
        completed_at:
          type: string
          format: date-time
        journal_event_id:
          allOf:
            - $ref: '#/components/schemas/OpaqueId'
          description: Present only for APPLIED_CLIENT_INTENT and identical on replay.
        journal_sequence:
          allOf:
            - $ref: '#/components/schemas/U64Decimal'
          description: Present only for APPLIED_CLIENT_INTENT and identical on replay.
    RebaselineStartRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
