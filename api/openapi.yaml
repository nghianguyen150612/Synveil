      schema:
        $ref: '#/components/schemas/OpaqueId'
    RebaselineCursor:
      name: cursor
      in: query
      required: false
      description: Opaque HMAC-protected keyset cursor for this exact bootstrap scope, generation, cut, and last immutable Node ID.
      schema:
        type: string
        minLength: 1
        maxLength: 320
    RebaselineLimit:
      name: limit
      in: query
      required: false
      description: Bounded logical-manifest page size; the server default is 200 and the maximum is 1000.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 200
    DurableSnapshotId:
      name: snapshot_id
      in: path
      required: true
      description: Opaque UUIDv7 identity for one durable immutable rebaseline snapshot artifact; it is never an authorization credential.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    DurableSnapshotCursor:
      name: cursor
      in: query
      required: false
      description: Opaque hex-encoded keyset cursor snapshot-scoped to snapshot identity and after-node-id; cross-snapshot reuse is rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 256
    DurableSnapshotLimit:
      name: limit
      in: query
      required: false
      description: Bounded entry page size; the server default is 256 and the maximum is 1000.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 256
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Signed opaque node ETag returned by a prior safe read or mutation.
      schema:
        type: string
        minLength: 3
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Bounded authenticated mutation identity; an identical retry replays the stored restore outcome.
      schema:
        type: string
        minLength: 8
        maxLength: 256
        pattern: '^[A-Za-z0-9._~-]+$'
    BackupIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Canonical lowercase UUIDv7 mutation identity. It is scoped by authenticated owner and deterministic endpoint kind; it is never accepted in the request body and never contains session or CSRF material.
      schema:
        type: string
        format: uuid
        minLength: 36
        maxLength: 36
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
    Range:
      name: Range
      in: header
      required: false
      description: 'Exactly one byte range: `bytes=start-end`, `bytes=start-`, or `bytes=-suffix`; multi-range and unsatisfiable values return 416.'
      schema:
        type: string
        minLength: 7
        maxLength: 256
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Optional quoted SHA-256 content validator; a matching value returns 304 before opening the stream.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF proof issued by the authenticated CSRF endpoint; never use a query parameter.
      schema:
        type: string
        minLength: 128
        maxLength: 128
        pattern: '^[A-Fa-f0-9]{128}$'
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: synveil_session
      description: Opaque Secure/HttpOnly browser session; only its verifier is stored server-side.
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: svd1_ followed by 64 lowercase hexadecimal characters
      description: |
        Implemented 256-bit random opaque credential scoped to exactly one
        owner and Device. Only domain-separated SHA-256 verifiers are durable
        server-side; desktop uses OS SecretStore. Revoked/non-ACTIVE Devices,
        inactive owners, and revoked credentials fail on the next request.
        No positive auth cache, cookie jar, automatic rotation or URL tokens.
        Only explicitly marked inbound routes permit this class; mutation,
        conflict inspection/resolution, upload and browser/admin routes do not.
        Verified HTTPS is mandatory; desktop redirects and proxies are disabled.
    PublicShareContext:
      type: apiKey
      in: cookie
      name: synveil_share
      description: Separate bounded public-share context; never promoted to a user session.
  headers:
    XRequestId:
      description: Trusted diagnostic request identifier echoed in the JSON envelope.
      schema:
        $ref: '#/components/schemas/OpaqueRequestId'
    Location:
      description: Canonical path to the created descriptor resource.
      schema:
        type: string
        format: uri-reference
    ETag:
      description: Opaque quoted resource revision used by conditional mutation.
      schema:
        type: string
        minLength: 3
        maxLength: 256
    RetryAfter:
      description: Seconds or HTTP date for bounded retry backoff.
      schema:
        type: string
    SetCookie:
      description: Browser cookie attributes are defined by the server; raw session credentials are never JSON fields.
      schema:
        type: string
    CacheControl:
      description: Sensitive authentication, bootstrap, and upload responses are not cacheable.
      schema:
        type: string
        const: no-store
    PrivateNoStore:
      description: Authenticated content is private and must not be stored by an intermediary or browser cache.
      schema:
        type: string
        const: private, no-store
    AcceptRanges:
      description: The configured content backend accepts single byte ranges.
      schema:
        type: string
        const: bytes
    ContentLength:
      description: Exact decimal byte length of the response body; on 206 this is the selected range length.
      schema:
        $ref: '#/components/schemas/U64Decimal'
    ContentRange:
      description: Inclusive selected byte range and complete immutable content length.
      schema:
        type: string
        pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$'
    ContentType:
      description: Safe fallback media type for the downloaded attachment.
      schema:
        type: string
        const: application/octet-stream
    ContentDisposition:
      description: Attachment disposition with a safe fallback and RFC 5987 encoded logical filename when available.
      schema:
        type: string
    UploadOffset:
      description: Authoritative durable byte offset for this upload session.
      schema:
        $ref: '#/components/schemas/U64Decimal'
    UploadLocation:
      description: Canonical status/resume resource for the created upload session.
      schema:
        type: string
        pattern: '^/api/v1/upload-sessions/[0-9a-f-]{36}$'
  responses:
    DevicePrivateError:
      description: |
        Stable safe error envelope; private/no-store. invalid_enrollment is
        generic for malformed, expired, consumed or revoked grants (401).
        authentication_failed is an unknown/incorrect bearer (401);
        device_revoked is disclosed only after valid bearer proof (401).
        Browser CSRF failures use permission_denied (403); inaccessible
        owner/Device/credential scopes use not_found (404). Invalid JSON uses
        invalid_request (400), over 2048 bytes uses payload_too_large (413),
        and unavailable dependencies use internal_dependency_unavailable (503).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineInvalidRequest:
      description: The scope/body is invalid, limit is outside 1..1000, cursor is malformed/oversized/tampered, or completion token is malformed/oversized/tampered. Stable codes include invalid_request, invalid_limit, invalid_cursor, and invalid_bootstrap_token.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineUnauthorized:
      description: Authentication is absent or invalid; the stable code is authentication_failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineForbidden:
      description: The state-changing request lacks valid same-origin CSRF evidence; the stable code is permission_denied.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineNotFound:
      description: The currently authenticated owner cannot access an ACTIVE device, library, or bootstrap in this exact scope; cross-owner and revoked-device cases are concealed with not_found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineConflict:
      description: Newer checkpoint/generation progress fenced this bootstrap, or the captured epoch/retention boundary is no longer usable. Stable codes are bootstrap_conflict and sync_rebaseline_required.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineExpired:
      description: PostgreSQL/server time has expired the OPEN bootstrap; the stable code is bootstrap_expired and its proof cannot replace a checkpoint.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
