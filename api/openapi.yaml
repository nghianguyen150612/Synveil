      type: string
      enum: [AWAITING_ADVANCE, SNAPSHOT_CAPTURED, EXPIRY_PLANNED, AWAITING_EXECUTION, AWAITING_CONFIRMATION, COMPLETED, STALE]
      description: Truthful UI phase derived from durable state; no background-running claim is made.
