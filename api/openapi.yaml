      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Canonical completion metadata, including on a safe repeat.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadCompletionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '409':
          $ref: '#/components/responses/UploadConflict'
        '410':
          $ref: '#/components/responses/UploadExpired'
        '412':
          $ref: '#/components/responses/UploadPreconditionFailed'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/upload-sessions/{upload_session_id}/abort:
    post:
      tags: [Uploads]
      operationId: abortUpload
      summary: Abort an upload session through the application service
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Storage / Uploads, Rust Backend
      description: |
        Request abort through the owner-scoped upload service. A repeat is safe.
        API code never removes staging files or committed recoverable content.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/UploadSessionId'
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '200':
          description: Current safe session state after abort or a safe repeat.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Upload-Offset:
              $ref: '#/components/headers/UploadOffset'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSessionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/UploadNotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  parameters:
    UploadSessionId:
      name: upload_session_id
      in: path
      required: true
      description: Opaque UUIDv7 upload-session identifier; possession is not authorization.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    UploadOffset:
      name: Upload-Offset
      in: header
      required: true
      description: Exact authoritative starting offset as canonical bounded unsigned decimal text.
      schema:
        $ref: '#/components/schemas/U64Decimal'
    LibraryId:
      name: library_id
      in: path
      required: true
      description: Opaque UUIDv7 library identifier owned by the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    NodeId:
      name: node_id
      in: path
      required: true
      description: Opaque UUIDv7 node identifier owned by the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    VersionId:
      name: version_id
      in: path
      required: true
      description: Opaque UUIDv7 immutable file-version identifier owned by the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ParentId:
      name: parent_id
      in: query
      required: false
      description: Active directory parent; omitted means the library root.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque bounded listing cursor scoped to this collection and parent.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Bounded page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Signed opaque node ETag returned by a prior safe read or mutation.
      schema:
        type: string
        minLength: 3
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Bounded authenticated mutation identity; an identical retry replays the stored restore outcome.
      schema:
        type: string
        minLength: 8
        maxLength: 256
        pattern: '^[A-Za-z0-9._~-]+$'
    Range:
      name: Range
      in: header
      required: false
      description: 'Exactly one byte range: `bytes=start-end`, `bytes=start-`, or `bytes=-suffix`; multi-range and unsatisfiable values return 416.'
      schema:
        type: string
        minLength: 7
        maxLength: 256
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Optional quoted SHA-256 content validator; a matching value returns 304 before opening the stream.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF proof issued by the authenticated CSRF endpoint; never use a query parameter.
      schema:
        type: string
        minLength: 128
        maxLength: 128
        pattern: '^[A-Fa-f0-9]{128}$'
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: synveil_session
      description: Opaque Secure/HttpOnly browser session; only its verifier is stored server-side.
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Scoped, rotatable, revocable device credential; never a password or URL parameter.
    PublicShareContext:
      type: apiKey
      in: cookie
      name: synveil_share
      description: Separate bounded public-share context; never promoted to a user session.
  headers:
    XRequestId:
      description: Trusted diagnostic request identifier echoed in the JSON envelope.
      schema:
        $ref: '#/components/schemas/OpaqueRequestId'
    ETag:
      description: Opaque quoted resource revision used by conditional mutation.
      schema:
        type: string
        minLength: 3
        maxLength: 256
    RetryAfter:
      description: Seconds or HTTP date for bounded retry backoff.
      schema:
        type: string
    SetCookie:
      description: Browser cookie attributes are defined by the server; raw session credentials are never JSON fields.
      schema:
        type: string
    CacheControl:
      description: Sensitive authentication, bootstrap, and upload responses are not cacheable.
      schema:
        type: string
        const: no-store
    PrivateNoStore:
      description: Authenticated content is private and must not be stored by an intermediary or browser cache.
      schema:
        type: string
        const: private, no-store
    AcceptRanges:
      description: The configured content backend accepts single byte ranges.
      schema:
        type: string
        const: bytes
    ContentLength:
      description: Exact decimal byte length of the response body; on 206 this is the selected range length.
      schema:
        $ref: '#/components/schemas/U64Decimal'
    ContentRange:
      description: Inclusive selected byte range and complete immutable content length.
      schema:
        type: string
        pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$'
    ContentType:
      description: Safe fallback media type for the downloaded attachment.
      schema:
        type: string
        const: application/octet-stream
    ContentDisposition:
      description: Attachment disposition with a safe fallback and RFC 5987 encoded logical filename when available.
      schema:
        type: string
    UploadOffset:
      description: Authoritative durable byte offset for this upload session.
      schema:
        $ref: '#/components/schemas/U64Decimal'
    UploadLocation:
      description: Canonical status/resume resource for the created upload session.
      schema:
        type: string
        pattern: '^/api/v1/upload-sessions/[0-9a-f-]{36}$'
  responses:
    InvalidRequest:
      description: The request body or bounded input is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidUploadRequest:
      description: The upload request, empty body, Upload-Offset header, or bounded input is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidUploadOffset:
      description: The exact offset or current upload state conflicts; invalid_offset includes the authoritative Upload-Offset header and current_offset detail.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Upload-Offset:
          $ref: '#/components/headers/UploadOffset'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadConflict:
      description: The upload state, expected length, target revision, or completion result conflicts with the requested operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadNotFound:
      description: The upload session does not exist or is not owned by the authenticated principal.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadExpired:
      description: The upload session expired and cannot accept the requested mutation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadPreconditionFailed:
      description: Uploaded content does not match the declared canonical SHA-256 digest.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadPayloadTooLarge:
      description: The JSON command or aggregate raw-byte chunk exceeds its operation-specific limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedUploadMediaType:
      description: Raw upload append requires exactly application/octet-stream.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CapacityUnavailable:
      description: The upload cannot be admitted within current configured capacity.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource was not found or is not visible to the current principal.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VersionConflict:
      description: The node revision changed before the conditional mutation was applied.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VersionRestoreConflict:
      description: The restore conflicted with the current node revision, resource state, or an existing idempotency-key request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: A required If-Match node ETag was omitted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidState:
      description: The metadata operation is not valid for the resource state.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: The server could not safely complete the content read.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRange:
      description: The requested range is malformed, contains multiple ranges, or is not satisfiable for the immutable content length.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Content-Range:
          description: Unsatisfiable content length in the required `bytes */length` form.
          schema:
            type: string
            pattern: '^bytes \\*/[0-9]+$'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required for the requested restricted operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Request provenance or CSRF proof could not be verified.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: The request exceeded a bounded abuse or concurrency limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: The process or a required operation dependency is unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BootstrapInvalidRequest:
      description: The bounded first-run request body is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BootstrapClosed:
      description: First-run setup was already closed by an earlier successful claim.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BootstrapPayloadTooLarge:
      description: The first-run request body exceeds the 16 KiB transport limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BootstrapServiceUnavailable:
      description: The bootstrap state or first-administrator operation is unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateUploadSessionRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateFileUploadRequest'
        - $ref: '#/components/schemas/ReplaceContentUploadRequest'
      discriminator:
        propertyName: operation
        mapping:
          CREATE_FILE: '#/components/schemas/CreateFileUploadRequest'
          REPLACE_CONTENT: '#/components/schemas/ReplaceContentUploadRequest'
    CreateFileUploadRequest:
      type: object
      additionalProperties: false
      required: [operation, library_id, parent_id, name, expected_bytes]
      properties:
        operation:
          type: string
          const: CREATE_FILE
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        parent_id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
          minLength: 1
          maxLength: 1024
          description: Raw logical name, never interpreted as an operating-system path.
        expected_bytes:
          $ref: '#/components/schemas/U64Decimal'
        expected_sha256:
          $ref: '#/components/schemas/Hash'
    ReplaceContentUploadRequest:
      type: object
      additionalProperties: false
      required: [operation, library_id, node_id, expected_revision, expected_bytes]
      properties:
        operation:
          type: string
          const: REPLACE_CONTENT
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
        expected_bytes:
          $ref: '#/components/schemas/U64Decimal'
        expected_sha256:
          $ref: '#/components/schemas/Hash'
    UploadSessionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/UploadSessionResource'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    UploadSessionResource:
      type: object
      additionalProperties: false
      required: [id, type, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: upload_session
        attributes:
          $ref: '#/components/schemas/UploadSessionAttributes'
    UploadSessionAttributes:
      type: object
      additionalProperties: false
      required:
        - operation
        - state
        - received_bytes
        - expected_bytes
        - created_at
        - updated_at
        - expires_at
        - target
      properties:
        operation:
          type: string
          enum: [CREATE_FILE, REPLACE_CONTENT]
        state:
          $ref: '#/components/schemas/UploadSessionState'
        received_bytes:
          $ref: '#/components/schemas/U64Decimal'
        expected_bytes:
          $ref: '#/components/schemas/U64Decimal'
        expected_sha256:
          $ref: '#/components/schemas/Hash'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        target:
          $ref: '#/components/schemas/UploadTarget'
        last_error_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Allow-listed stable diagnostic code only.
        terminal_failure_code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Allow-listed stable terminal failure code only.
        completion:
          $ref: '#/components/schemas/UploadCompletionResource'
    UploadSessionState:
      type: string
      enum: [OPEN, VERIFYING, COMMITTING, COMMITTED, FAILED, EXPIRED, ABORTED]
    UploadTarget:
      oneOf:
        - $ref: '#/components/schemas/CreateFileUploadTarget'
        - $ref: '#/components/schemas/ReplaceContentUploadTarget'
      discriminator:
        propertyName: operation
        mapping:
          CREATE_FILE: '#/components/schemas/CreateFileUploadTarget'
          REPLACE_CONTENT: '#/components/schemas/ReplaceContentUploadTarget'
    CreateFileUploadTarget:
      type: object
      additionalProperties: false
      required: [operation, library_id, parent_id, node_id, name]
      properties:
        operation:
          type: string
          const: CREATE_FILE
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        parent_id:
          $ref: '#/components/schemas/OpaqueId'
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
          minLength: 1
          maxLength: 1024
    ReplaceContentUploadTarget:
      type: object
      additionalProperties: false
      required: [operation, library_id, node_id, expected_revision]
      properties:
        operation:
          type: string
          const: REPLACE_CONTENT
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
    UploadCompletionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/UploadCompletionResource'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    UploadCompletionResource:
      type: object
      additionalProperties: false
      required: [id, type, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: upload_completion
        attributes:
          $ref: '#/components/schemas/UploadCompletionAttributes'
    UploadCompletionAttributes:
      type: object
      additionalProperties: false
      required:
        - node_id
        - file_version_id
        - object_id
        - node_revision
        - bytes
        - sha256
        - committed_at
      properties:
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        file_version_id:
          $ref: '#/components/schemas/OpaqueId'
        object_id:
          $ref: '#/components/schemas/OpaqueId'
        node_revision:
          $ref: '#/components/schemas/U64Decimal'
        bytes:
          $ref: '#/components/schemas/U64Decimal'
        sha256:
          $ref: '#/components/schemas/Hash'
        committed_at:
          type: string
          format: date-time
    CreateDirectoryRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
          description: Raw logical directory name; no host-filesystem normalization is applied.
        parent_id:
          $ref: '#/components/schemas/OpaqueId'
    UpdateNodeRequest:
      oneOf:
        - $ref: '#/components/schemas/RenameNodeRequest'
        - $ref: '#/components/schemas/MoveNodeRequest'
      description: Exactly one logical metadata change is accepted per request.
    RenameNodeRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
    MoveNodeRequest:
      type: object
      additionalProperties: false
      required: [parent_id]
      properties:
        parent_id:
          $ref: '#/components/schemas/OpaqueId'
    LibraryCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/LibraryResource'
        page:
          $ref: '#/components/schemas/Page'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    NodeCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/NodeResource'
        page:
          $ref: '#/components/schemas/Page'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    VersionCollectionResponse:
      type: object
      additionalProperties: false
      required: [data, page, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/VersionResource'
        page:
          $ref: '#/components/schemas/Page'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    VersionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/VersionResource'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    VersionRestoreResponse:
      type: object
      additionalProperties: false
      required: [data, node, meta]
      properties:
        data:
          $ref: '#/components/schemas/VersionResource'
        node:
          $ref: '#/components/schemas/RestoreNodeConcurrency'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RestoreNodeConcurrency:
      type: object
      additionalProperties: false
      required: [id, revision]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        revision:
          $ref: '#/components/schemas/U64Decimal'
    VersionResource:
      type: object
      additionalProperties: false
      required: [id, type, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: file_version
        attributes:
          $ref: '#/components/schemas/VersionAttributes'
    VersionAttributes:
      type: object
      additionalProperties: false
      required: [node_id, created_at, byte_length, sha256, is_current]
      properties:
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        created_at:
          type: string
          format: date-time
        byte_length:
          $ref: '#/components/schemas/U64Decimal'
        sha256:
          $ref: '#/components/schemas/Hash'
        is_current:
          type: boolean
    Page:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        next_cursor:
          type: string
          maxLength: 512
        has_more:
          type: boolean
    LibraryResource:
      type: object
      additionalProperties: false
      required: [id, type, revision, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: library
        revision:
          $ref: '#/components/schemas/U64Decimal'
        attributes:
          $ref: '#/components/schemas/LibraryAttributes'
    LibraryAttributes:
      type: object
      additionalProperties: false
      required: [name, root_node_id, status, created_at, updated_at]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 1024
        root_node_id:
          $ref: '#/components/schemas/OpaqueId'
        status:
          type: string
          enum: [ACTIVE, READ_ONLY, QUARANTINED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    NodeResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/NodeResource'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    NodeResource:
      type: object
      additionalProperties: false
      required: [id, type, revision, attributes]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        type:
          type: string
          const: node
        revision:
          $ref: '#/components/schemas/U64Decimal'
        attributes:
          $ref: '#/components/schemas/NodeAttributes'
    NodeAttributes:
      type: object
      additionalProperties: false
      required: [library_id, name, kind, state, created_at, updated_at, purge_eligible]
      properties:
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        parent_id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
          minLength: 1
          maxLength: 1024
        kind:
          type: string
          enum: [FILE, DIRECTORY]
        state:
          type: string
          enum: [ACTIVE, TRASHED, PURGING]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        trashed_at:
          type: string
          format: date-time
          description: Server-observed timestamp when the node entered TRASHED; omitted for ACTIVE nodes.
        restore_deadline:
          type: string
          format: date-time
          description: Derived inclusive retention deadline; omitted for ACTIVE nodes and never accepted from clients.
        purge_eligible:
          type: boolean
          description: Server-evaluated internal eligibility hint; true does not expose a public delete-now operation.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [login, login_key, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 1024
          description: Canonical user-visible login identifier.
        login_key:
          type: string
          minLength: 1
          maxLength: 1024
          description: Adapter-supplied canonical uniqueness key paired with login.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
    BootstrapAdminRequest:
      type: object
      additionalProperties: false
      required: [login, login_key, password]
      properties:
        login:
          type: string
          minLength: 1
          maxLength: 1024
          description: Canonical user-visible login identifier.
        login_key:
          type: string
          minLength: 1
          maxLength: 1024
          description: Adapter-supplied canonical uniqueness key paired with login.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          description: Initial administrator password; never returned or logged.
    AuthSessionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AuthSessionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AuthSessionData:
      type: object
      additionalProperties: false
      required: [authenticated, user_id, is_instance_admin, session_id]
      properties:
        authenticated:
          type: boolean
          const: true
        user_id:
          $ref: '#/components/schemas/OpaqueId'
        is_instance_admin:
          type: boolean
        session_id:
          $ref: '#/components/schemas/OpaqueId'
        expires_at:
          type: string
          format: date-time
          description: Present on login issuance; current-session inspection may omit it.
    CsrfResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/CsrfData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CsrfData:
      type: object
      additionalProperties: false
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          minLength: 128
          maxLength: 128
          pattern: '^[A-Fa-f0-9]{128}$'
    OpaqueRequestId:
      type: string
      minLength: 8
      maxLength: 128
      pattern: '^[A-Za-z0-9._~-]+$'
      description: Diagnostic identifier; not an idempotency key or credential.
    OpaqueId:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
      description: Opaque lowercase UUIDv7 public identifier.
    U64Decimal:
      type: string
      pattern: '^(0|[1-9][0-9]*)$'
      description: Non-negative integer serialized as canonical decimal text.
    Hash:
      type: string
      pattern: '^sha256:[0-9a-f]{64}$'
      description: Algorithm-qualified canonical integrity hash.
    LiveProbe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          const: live
    ReadyProbe:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ready]
    SystemHealthResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SystemHealthData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SystemHealthData:
      type: object
      additionalProperties: false
      required: [status, liveness, readiness, components]
      properties:
        status:
          type: string
          enum: [HEALTHY, DEGRADED, UNAVAILABLE, UNKNOWN]
        liveness:
          type: boolean
        readiness:
          type: boolean
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentHealth'
    ComponentHealth:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          enum: [runtime, paths, storage_discovery, secret_store, service_lifecycle]
        status:
          type: string
          enum: [HEALTHY, DEGRADED, UNAVAILABLE, UNKNOWN]
    BootstrapStatusResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: object
          additionalProperties: false
          required: [setup_required]
          properties:
            setup_required:
              type: boolean
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ResponseMeta:
      type: object
      additionalProperties: false
      required: [request_id]
      properties:
        request_id:
          $ref: '#/components/schemas/OpaqueRequestId'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id, retryable]
      properties:
        code:
          type: string
          pattern: '^[a-z][a-z0-9_]{1,63}$'
          description: Stable machine-readable error code from the reviewed registry.
        message:
          type: string
          minLength: 1
          maxLength: 512
          description: Safe human-readable message; clients must not branch on it.
        request_id:
          $ref: '#/components/schemas/OpaqueRequestId'
        retryable:
          type: boolean
        details:
          type: object
          description: Operation-specific allow-listed details; never stack traces, paths, secrets, or content.
          additionalProperties: true
