      in: path
      required: true
      description: Non-secret UUIDv7 device credential identity; not bearer authority.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    BrowserCsrfHeader:
      name: X-CSRF-Token
      in: header
      required: false
      description: Required with browser-session cookie authority on this POST; not required for an actually authenticated device bearer. Invalid or mixed bearer requests never fall back to cookie/CSRF authority.
      schema:
        type: string
        minLength: 128
        maxLength: 128
        pattern: '^[A-Fa-f0-9]{128}$'
    DeviceId:
      name: device_id
      in: path
      required: true
      description: Opaque UUIDv7 registered device identifier; possession is not authorization and the device must belong to the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ConflictId:
      name: conflict_id
      in: path
      required: true
      description: Opaque UUIDv7 durable conflict identifier; possession is never authorization and exact owner, ACTIVE Device, and Library scope is rechecked.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    UploadSessionId:
      name: upload_session_id
      in: path
      required: true
      description: Opaque UUIDv7 upload-session identifier; possession is not authorization.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    UploadOffset:
      name: Upload-Offset
      in: header
      required: true
      description: Exact authoritative starting offset as canonical bounded unsigned decimal text.
      schema:
        $ref: '#/components/schemas/U64Decimal'
    LibraryId:
      name: library_id
      in: path
      required: true
      description: Opaque UUIDv7 library identifier owned by the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    NodeId:
      name: node_id
      in: path
      required: true
      description: Opaque UUIDv7 node identifier owned by the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    VersionId:
      name: version_id
      in: path
      required: true
      description: Opaque UUIDv7 immutable file-version identifier owned by the current principal.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    ParentId:
      name: parent_id
      in: query
      required: false
      description: Active directory parent; omitted means the library root.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque bounded listing cursor scoped to this collection and parent.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    Limit:
      name: limit
      in: query
      required: false
      description: Bounded page size.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    ConflictLimit:
      name: limit
      in: query
      required: false
      description: Bounded OPEN-conflict page size; canonical unsigned decimal text only.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 50
    ConflictCursor:
      name: cursor
      in: query
      required: false
      description: Opaque bounded HMAC-authenticated keyset cursor bound to owner, Device, Library, OPEN filter, and immutable descending order key; never authorization.
      schema:
        type: string
        minLength: 1
        maxLength: 384
    SyncLimit:
      name: limit
      in: query
      required: false
      description: Bounded incremental-feed page size; the server default is 100 and the maximum is 500.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 100
    RebaselineBootstrapId:
      name: bootstrap_id
      in: path
      required: true
      description: Opaque UUIDv7 identity for one owner/device/library logical bootstrap session; it is never an authorization credential.
      schema:
        $ref: '#/components/schemas/OpaqueId'
    RebaselineCursor:
      name: cursor
      in: query
      required: false
      description: Opaque HMAC-protected keyset cursor for this exact bootstrap scope, generation, cut, and last immutable Node ID.
      schema:
        type: string
        minLength: 1
        maxLength: 320
    RebaselineLimit:
      name: limit
      in: query
      required: false
      description: Bounded logical-manifest page size; the server default is 200 and the maximum is 1000.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Signed opaque node ETag returned by a prior safe read or mutation.
      schema:
        type: string
        minLength: 3
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Bounded authenticated mutation identity; an identical retry replays the stored restore outcome.
      schema:
        type: string
        minLength: 8
        maxLength: 256
        pattern: '^[A-Za-z0-9._~-]+$'
    Range:
      name: Range
      in: header
      required: false
      description: 'Exactly one byte range: `bytes=start-end`, `bytes=start-`, or `bytes=-suffix`; multi-range and unsatisfiable values return 416.'
      schema:
        type: string
        minLength: 7
        maxLength: 256
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Optional quoted SHA-256 content validator; a matching value returns 304 before opening the stream.
      schema:
        type: string
        minLength: 1
        maxLength: 1024
    CsrfHeader:
      name: X-CSRF-Token
      in: header
      required: true
      description: Session-bound CSRF proof issued by the authenticated CSRF endpoint; never use a query parameter.
      schema:
        type: string
        minLength: 128
        maxLength: 128
        pattern: '^[A-Fa-f0-9]{128}$'
  securitySchemes:
    BrowserSession:
      type: apiKey
      in: cookie
      name: synveil_session
      description: Opaque Secure/HttpOnly browser session; only its verifier is stored server-side.
    DeviceBearer:
      type: http
      scheme: bearer
      bearerFormat: svd1_ followed by 64 lowercase hexadecimal characters
      description: |
        Implemented 256-bit random opaque credential scoped to exactly one
        owner and Device. Only domain-separated SHA-256 verifiers are durable
        server-side; desktop uses OS SecretStore. Revoked/non-ACTIVE Devices,
        inactive owners, and revoked credentials fail on the next request.
        No positive auth cache, cookie jar, automatic rotation or URL tokens.
        Only explicitly marked inbound routes permit this class; mutation,
        conflict inspection/resolution, upload and browser/admin routes do not.
        Verified HTTPS is mandatory; desktop redirects and proxies are disabled.
    PublicShareContext:
      type: apiKey
      in: cookie
      name: synveil_share
      description: Separate bounded public-share context; never promoted to a user session.
  headers:
    XRequestId:
      description: Trusted diagnostic request identifier echoed in the JSON envelope.
      schema:
        $ref: '#/components/schemas/OpaqueRequestId'
    ETag:
      description: Opaque quoted resource revision used by conditional mutation.
      schema:
        type: string
        minLength: 3
        maxLength: 256
    RetryAfter:
      description: Seconds or HTTP date for bounded retry backoff.
      schema:
        type: string
    SetCookie:
      description: Browser cookie attributes are defined by the server; raw session credentials are never JSON fields.
      schema:
        type: string
    CacheControl:
      description: Sensitive authentication, bootstrap, and upload responses are not cacheable.
      schema:
        type: string
        const: no-store
    PrivateNoStore:
      description: Authenticated content is private and must not be stored by an intermediary or browser cache.
      schema:
        type: string
        const: private, no-store
    AcceptRanges:
      description: The configured content backend accepts single byte ranges.
      schema:
        type: string
        const: bytes
    ContentLength:
      description: Exact decimal byte length of the response body; on 206 this is the selected range length.
      schema:
        $ref: '#/components/schemas/U64Decimal'
    ContentRange:
      description: Inclusive selected byte range and complete immutable content length.
      schema:
        type: string
        pattern: '^bytes [0-9]+-[0-9]+/[0-9]+$'
    ContentType:
      description: Safe fallback media type for the downloaded attachment.
      schema:
        type: string
        const: application/octet-stream
    ContentDisposition:
      description: Attachment disposition with a safe fallback and RFC 5987 encoded logical filename when available.
      schema:
        type: string
    UploadOffset:
      description: Authoritative durable byte offset for this upload session.
      schema:
        $ref: '#/components/schemas/U64Decimal'
    UploadLocation:
      description: Canonical status/resume resource for the created upload session.
      schema:
        type: string
        pattern: '^/api/v1/upload-sessions/[0-9a-f-]{36}$'
  responses:
    DevicePrivateError:
      description: |
        Stable safe error envelope; private/no-store. invalid_enrollment is
        generic for malformed, expired, consumed or revoked grants (401).
        authentication_failed is an unknown/incorrect bearer (401);
        device_revoked is disclosed only after valid bearer proof (401).
        Browser CSRF failures use permission_denied (403); inaccessible
        owner/Device/credential scopes use not_found (404). Invalid JSON uses
        invalid_request (400), over 2048 bytes uses payload_too_large (413),
        and unavailable dependencies use internal_dependency_unavailable (503).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineInvalidRequest:
      description: The scope/body is invalid, limit is outside 1..1000, cursor is malformed/oversized/tampered, or completion token is malformed/oversized/tampered. Stable codes include invalid_request, invalid_limit, invalid_cursor, and invalid_bootstrap_token.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineUnauthorized:
      description: Authentication is absent or invalid; the stable code is authentication_failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineForbidden:
      description: The state-changing request lacks valid same-origin CSRF evidence; the stable code is permission_denied.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineNotFound:
      description: The currently authenticated owner cannot access an ACTIVE device, library, or bootstrap in this exact scope; cross-owner and revoked-device cases are concealed with not_found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineConflict:
      description: Newer checkpoint/generation progress fenced this bootstrap, or the captured epoch/retention boundary is no longer usable. Stable codes are bootstrap_conflict and sync_rebaseline_required.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineExpired:
      description: PostgreSQL/server time has expired the OPEN bootstrap; the stable code is bootstrap_expired and its proof cannot replace a checkpoint.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselinePayloadTooLarge:
      description: The start or complete JSON body exceeds the 2048-byte transport limit; the stable code is payload_too_large.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineInternalError:
      description: Persisted bootstrap data is invalid or an internal invariant failed; stable codes are invalid_persisted_data and internal_error, and no physical detail is exposed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineServiceUnavailable:
      description: PostgreSQL or another required dependency is unavailable; the stable code is dependency_unavailable without topology or credentials.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidSyncRequest:
      description: The synchronization scope, bounded feed limit, or signed acknowledgment token is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SyncConflict:
      description: The checkpoint cannot accept this acknowledgment because it is out of order or the journal requires rebaseline.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SyncRebaselineRequired:
      description: The current journal epoch or retained history cannot satisfy incremental synchronization; start the implemented logical rebaseline bootstrap to establish a new baseline.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SyncPayloadTooLarge:
      description: The signed acknowledgment JSON body exceeds the 2048-byte transport limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ClientMutationInvalidRequest:
      description: The strict typed mutation envelope, canonical UUID/decimal/name field, or closed mutation kind is invalid; the stable code is invalid_mutation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ClientMutationUnauthorized:
      description: Authentication is absent or invalid; the stable code is authentication_failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ClientMutationForbidden:
      description: The state-changing request lacks valid same-origin CSRF evidence; the stable code is permission_denied.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ClientMutationNotFound:
      description: The authenticated owner cannot access the exact ACTIVE device/library scope; cross-owner, unknown, and revoked-device cases are concealed with not_found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ClientMutationConflict:
      description: The typed mutation has a durable optimistic-concurrency conflict, the mutation ID was reused with a different fingerprint, or the base epoch/retention context requires rebaseline. Stable codes are mutation_conflict, mutation_id_conflict, and sync_rebaseline_required; no canonical mutation or journal event is created for a resource conflict.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ClientMutationPayloadTooLarge:
      description: The strict JSON client-mutation envelope exceeds the 16 KiB body limit; the stable code is payload_too_large.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ClientMutationInternalError:
      description: Persisted mutation-operation data or an internal invariant is invalid; stable codes are invalid_persisted_data and internal_error, and no SQL/physical detail is exposed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ClientMutationServiceUnavailable:
      description: PostgreSQL or another required mutation dependency is unavailable; the stable code is dependency_unavailable without topology, SQL, or credentials.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictInvalidRequest:
      description: The list limit/cursor, strict resolution body, UUID, action, or action-specific fresh precondition shape is invalid. Stable codes are invalid_limit, invalid_cursor, invalid_request, and invalid_conflict_resolution.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictUnauthorized:
      description: Authentication is absent or invalid; the stable code is authentication_failed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictForbidden:
      description: The state-changing resolution request lacks valid same-origin CSRF evidence; the stable code is permission_denied. GET inspection routes do not require CSRF.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictNotFound:
      description: The authenticated owner cannot access the exact ACTIVE Device, Library, and conflict scope; cross-owner, wrong-scope, unknown, and revoked-Device cases are concealed with not_found.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictResolutionConflict:
      description: The durable resolution ID has different semantics, the conflict is already terminal, fresh preconditions became stale, or current epoch/history requires rebaseline. Stable codes are resolution_id_conflict, conflict_not_open, resolution_conflict, and sync_rebaseline_required. A stale resolution leaves the conflict OPEN with zero canonical mutation and zero journal event.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictPayloadTooLarge:
      description: The strict JSON resolution envelope exceeds the 16 KiB body limit; the stable code is payload_too_large.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictInternalError:
      description: Persisted conflict/resolution data is invalid or an internal invariant failed; stable codes are invalid_persisted_data and internal_error, and no SQL, lock, name, path, or physical-storage detail is exposed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ConflictServiceUnavailable:
      description: PostgreSQL or another required conflict-management dependency is unavailable; the stable code is dependency_unavailable without topology, SQL, credentials, or internal lock detail.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRequest:
      description: The request body or bounded input is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidUploadRequest:
      description: The upload request, empty body, Upload-Offset header, or bounded input is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidUploadOffset:
      description: The exact offset or current upload state conflicts; invalid_offset includes the authoritative Upload-Offset header and current_offset detail.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Upload-Offset:
          $ref: '#/components/headers/UploadOffset'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadConflict:
      description: The upload state, expected length, target revision, or completion result conflicts with the requested operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadNotFound:
      description: The upload session does not exist or is not owned by the authenticated principal.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadExpired:
      description: The upload session expired and cannot accept the requested mutation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadPreconditionFailed:
      description: Uploaded content does not match the declared canonical SHA-256 digest.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UploadPayloadTooLarge:
      description: The JSON command or aggregate raw-byte chunk exceeds its operation-specific limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnsupportedUploadMediaType:
      description: Raw upload append requires exactly application/octet-stream.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CapacityUnavailable:
      description: The upload cannot be admitted within current configured capacity.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: The resource was not found or is not visible to the current principal.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VersionConflict:
      description: The node revision changed before the conditional mutation was applied.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VersionRestoreConflict:
      description: The restore conflicted with the current node revision, resource state, or an existing idempotency-key request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionRequired:
      description: A required If-Match node ETag was omitted.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidState:
      description: The metadata operation is not valid for the resource state.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: The server could not safely complete the content read.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InvalidRange:
      description: The requested range is malformed, contains multiple ranges, or is not satisfiable for the immutable content length.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Content-Range:
          description: Unsatisfiable content length in the required `bytes */length` form.
          schema:
            type: string
            pattern: '^bytes \\*/[0-9]+$'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required for the requested restricted operation.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Request provenance or CSRF proof could not be verified.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: The request exceeded a bounded abuse or concurrency limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: The process or a required operation dependency is unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BootstrapInvalidRequest:
      description: The bounded first-run request body is invalid.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BootstrapClosed:
      description: First-run setup was already closed by an earlier successful claim.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BootstrapPayloadTooLarge:
      description: The first-run request body exceeds the 16 KiB transport limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BootstrapServiceUnavailable:
      description: The bootstrap state or first-administrator operation is unavailable.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateDeviceEnrollmentGrantRequest:
      type: object
      additionalProperties: false
      required: [target]
      properties:
        target:
          oneOf:
            - type: object
              additionalProperties: false
              required: [kind, device_id]
              properties:
                kind:
                  type: string
                  const: existing
                device_id:
                  $ref: '#/components/schemas/OpaqueId'
            - type: object
              additionalProperties: false
              required: [kind, display_name]
              properties:
                kind:
                  type: string
                  const: new
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: Canonical Device logical display name, within the aggregate 2048-byte JSON limit.
    ExchangeDeviceEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [enrollment_token]
      properties:
        enrollment_token:
          type: string
          minLength: 69
          maxLength: 69
          pattern: '^sve1_[0-9a-f]{64}$'
          writeOnly: true
          description: High-entropy once-only grant secret; never a short numeric pairing code or URL parameter.
    DeviceEnrollmentGrantResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          type: object
          additionalProperties: false
          required: [grant_id, owner_user_id, device_id, enrollment_token, created_at, expires_at]
          properties:
            grant_id:
              $ref: '#/components/schemas/OpaqueId'
            owner_user_id:
              $ref: '#/components/schemas/OpaqueId'
            device_id:
              $ref: '#/components/schemas/OpaqueId'
            enrollment_token:
              type: string
              minLength: 69
              maxLength: 69
              pattern: '^sve1_[0-9a-f]{64}$'
              readOnly: true
              description: Returned once. Secret storage/export, logs and URLs are forbidden.
            created_at:
              type: string
              format: date-time
            expires_at:
              type: string
              format: date-time
              description: Server-created timestamp plus 600 seconds; inclusive expiry rejects exchange.
    DeviceCredentialResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        meta:
          $ref: '#/components/schemas/ResponseMeta'
        data:
          type: object
          additionalProperties: false
          required: [owner_user_id, device_id, credential_id, device_credential, created_at]
          properties:
            owner_user_id:
              $ref: '#/components/schemas/OpaqueId'
            device_id:
              $ref: '#/components/schemas/OpaqueId'
            credential_id:
              $ref: '#/components/schemas/OpaqueId'
            device_credential:
              type: string
              minLength: 69
              maxLength: 69
              pattern: '^svd1_[0-9a-f]{64}$'
              readOnly: true
              description: Returned exactly once; desktop must store only in secure SecretStore.
            created_at:
              type: string
              format: date-time
    DeviceRevokeRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
    ClientMutationRequest:
      oneOf:
        - $ref: '#/components/schemas/ClientMutationCreateDirectoryRequest'
        - $ref: '#/components/schemas/ClientMutationRenameRequest'
        - $ref: '#/components/schemas/ClientMutationMoveRequest'
        - $ref: '#/components/schemas/ClientMutationTrashRequest'
        - $ref: '#/components/schemas/ClientMutationRestoreRequest'
      discriminator:
        propertyName: kind
        mapping:
          CREATE_DIRECTORY: '#/components/schemas/ClientMutationCreateDirectoryRequest'
          RENAME_NODE: '#/components/schemas/ClientMutationRenameRequest'
          MOVE_NODE: '#/components/schemas/ClientMutationMoveRequest'
          TRASH_NODE: '#/components/schemas/ClientMutationTrashRequest'
          RESTORE_NODE: '#/components/schemas/ClientMutationRestoreRequest'
      description: One strict envelope for exactly one typed logical mutation; arbitrary JSON Patch and file bytes are not accepted.
    ClientMutationCreateDirectoryRequest:
      type: object
      additionalProperties: false
      required: [mutation_id, base_epoch, base_sequence, kind, payload]
      properties:
        mutation_id:
          $ref: '#/components/schemas/ClientMutationId'
        base_epoch:
          $ref: '#/components/schemas/U64Decimal'
        base_sequence:
          $ref: '#/components/schemas/U64Decimal'
        kind:
          type: string
          const: CREATE_DIRECTORY
        payload:
          $ref: '#/components/schemas/ClientMutationCreateDirectoryPayload'
    ClientMutationRenameRequest:
      type: object
      additionalProperties: false
      required: [mutation_id, base_epoch, base_sequence, kind, payload]
      properties:
        mutation_id:
          $ref: '#/components/schemas/ClientMutationId'
        base_epoch:
          $ref: '#/components/schemas/U64Decimal'
        base_sequence:
          $ref: '#/components/schemas/U64Decimal'
        kind:
          type: string
          const: RENAME_NODE
        payload:
          $ref: '#/components/schemas/ClientMutationRenamePayload'
    ClientMutationMoveRequest:
      type: object
      additionalProperties: false
      required: [mutation_id, base_epoch, base_sequence, kind, payload]
      properties:
        mutation_id:
          $ref: '#/components/schemas/ClientMutationId'
        base_epoch:
          $ref: '#/components/schemas/U64Decimal'
        base_sequence:
          $ref: '#/components/schemas/U64Decimal'
        kind:
          type: string
          const: MOVE_NODE
        payload:
          $ref: '#/components/schemas/ClientMutationMovePayload'
    ClientMutationTrashRequest:
      type: object
      additionalProperties: false
      required: [mutation_id, base_epoch, base_sequence, kind, payload]
      properties:
        mutation_id:
          $ref: '#/components/schemas/ClientMutationId'
        base_epoch:
          $ref: '#/components/schemas/U64Decimal'
        base_sequence:
          $ref: '#/components/schemas/U64Decimal'
        kind:
          type: string
          const: TRASH_NODE
        payload:
          $ref: '#/components/schemas/ClientMutationTrashPayload'
    ClientMutationRestoreRequest:
      type: object
      additionalProperties: false
      required: [mutation_id, base_epoch, base_sequence, kind, payload]
      properties:
        mutation_id:
          $ref: '#/components/schemas/ClientMutationId'
        base_epoch:
          $ref: '#/components/schemas/U64Decimal'
        base_sequence:
          $ref: '#/components/schemas/U64Decimal'
        kind:
          type: string
          const: RESTORE_NODE
        payload:
          $ref: '#/components/schemas/ClientMutationRestorePayload'
    ClientMutationCreateDirectoryPayload:
      type: object
      additionalProperties: false
      required: [parent_node_id, expected_parent_revision, name]
      properties:
        parent_node_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_parent_revision:
          $ref: '#/components/schemas/U64Decimal'
        name:
          type: string
          minLength: 1
          maxLength: 1024
          description: Logical name only; it is not a filesystem path.
    ClientMutationRenamePayload:
      type: object
      additionalProperties: false
      required: [node_id, expected_revision, new_name]
      properties:
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
        new_name:
          type: string
          minLength: 1
          maxLength: 1024
          description: Logical name only; it is not a filesystem path.
    ClientMutationMovePayload:
      type: object
      additionalProperties: false
      required: [node_id, expected_revision, new_parent_node_id, expected_new_parent_revision]
      properties:
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
        new_parent_node_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_new_parent_revision:
          $ref: '#/components/schemas/U64Decimal'
    ClientMutationTrashPayload:
      type: object
      additionalProperties: false
      required: [node_id, expected_revision]
      properties:
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
    ClientMutationRestorePayload:
      type: object
      additionalProperties: false
      required: [node_id, expected_revision, expected_parent_node_id, expected_parent_revision]
      properties:
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
        expected_parent_node_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_parent_revision:
          $ref: '#/components/schemas/U64Decimal'
    ClientMutationKind:
      type: string
      enum: [CREATE_DIRECTORY, RENAME_NODE, MOVE_NODE, TRASH_NODE, RESTORE_NODE]
    ClientMutationResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ClientMutationAppliedData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ClientMutationAppliedData:
      type: object
      additionalProperties: false
      required: [outcome, mutation_id, kind, replayed, node, journal_event_id, journal_sequence]
      properties:
        outcome:
          type: string
          const: APPLIED
        mutation_id:
          $ref: '#/components/schemas/ClientMutationId'
        kind:
          $ref: '#/components/schemas/ClientMutationKind'
        replayed:
          type: boolean
          description: True when the committed operation result is returned after a retry or lost response.
        node:
          $ref: '#/components/schemas/ClientMutationNode'
        journal_event_id:
          $ref: '#/components/schemas/OpaqueId'
        journal_sequence:
          $ref: '#/components/schemas/U64Decimal'
    ClientMutationNode:
      type: object
      additionalProperties: false
      required: [id, library_id, kind, state, name, revision, created_at, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/OpaqueId'
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        parent_node_id:
          $ref: '#/components/schemas/OpaqueId'
        kind:
          type: string
          enum: [FILE, DIRECTORY]
        state:
          type: string
          enum: [ACTIVE, TRASHED]
        name:
          type: string
          minLength: 1
          maxLength: 1024
        revision:
          $ref: '#/components/schemas/U64Decimal'
        current_version_id:
          $ref: '#/components/schemas/OpaqueId'
        trashed_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClientMutationConflictDetails:
      type: object
      additionalProperties: false
      required: [outcome, replayed, conflict_id, reason, resource_id, server_epoch, server_sequence]
      properties:
        outcome:
          type: string
          const: CONFLICT
        replayed:
          type: boolean
        conflict_id:
          $ref: '#/components/schemas/SyncConflictId'
        reason:
          type: string
          enum: [REVISION_MISMATCH, NODE_STATE_CHANGED, PARENT_CHANGED, NAME_OCCUPIED, DESTINATION_CHANGED, RESOURCE_PURGED]
        resource_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
        current_revision:
          $ref: '#/components/schemas/U64Decimal'
        current_state:
          type: string
          enum: [ACTIVE, TRASHED, PURGING]
        current_parent_id:
          $ref: '#/components/schemas/OpaqueId'
        current_name:
          type: string
          minLength: 1
          maxLength: 1024
        server_epoch:
          $ref: '#/components/schemas/U64Decimal'
        server_sequence:
          $ref: '#/components/schemas/U64Decimal'
    ClientMutationId:
      allOf:
        - $ref: '#/components/schemas/OpaqueId'
      description: Durable UUIDv7 identity scoped to owner, registered device, and library; reuse with a different canonical fingerprint is rejected.
    SyncConflictId:
      allOf:
        - $ref: '#/components/schemas/OpaqueId'
      description: Durable UUIDv7 conflict identity scoped to one owner, originating Device, and Library; possession is never authorization.
    ConflictResolutionId:
      allOf:
        - $ref: '#/components/schemas/OpaqueId'
      description: Durable UUIDv7 manual-decision idempotency identity; reuse with a different canonical typed fingerprint is rejected.
    ConflictLifecycle:
      type: string
      enum: [OPEN, RESOLVED, DISMISSED]
      description: Closed durable lifecycle; OPEN never transitions automatically.
    ConflictReason:
      type: string
      enum: [REVISION_MISMATCH, NODE_STATE_CHANGED, PARENT_CHANGED, NAME_OCCUPIED, DESTINATION_CHANGED, RESOURCE_PURGED]
    ConflictResolutionAction:
      type: string
      enum: [ACCEPT_SERVER, APPLY_CLIENT_INTENT]
      description: Explicit manual action only; no automatic selection policy exists.
    ConflictListResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ConflictListData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ConflictListData:
      type: object
      additionalProperties: false
      required: [conflicts, page]
      properties:
        conflicts:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/ConflictSummary'
        page:
          $ref: '#/components/schemas/ConflictPage'
    ConflictPage:
      type: object
      additionalProperties: false
      required: [has_more]
      properties:
        has_more:
          type: boolean
        next_cursor:
          type: string
          minLength: 1
          maxLength: 384
          description: Opaque HMAC-authenticated cursor for the next immutable keyset page; omitted on the terminal page.
    ConflictSummary:
      type: object
      additionalProperties: false
      required: [conflict_id, original_client_mutation_id, mutation_kind, resource_id, reason, lifecycle, created_at]
      properties:
        conflict_id:
          $ref: '#/components/schemas/SyncConflictId'
        original_client_mutation_id:
          $ref: '#/components/schemas/ClientMutationId'
        mutation_kind:
          $ref: '#/components/schemas/ClientMutationKind'
        resource_id:
          $ref: '#/components/schemas/OpaqueId'
        reason:
          $ref: '#/components/schemas/ConflictReason'
        lifecycle:
          type: string
          const: OPEN
        created_at:
          type: string
          format: date-time
    ConflictDetailResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ConflictDetailData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ConflictDetailData:
      type: object
      additionalProperties: false
      required: [conflict_id, original_client_mutation_id, mutation_kind, resource_id, reason, lifecycle, created_at, original_intent, historical_server_observation]
      properties:
        conflict_id:
          $ref: '#/components/schemas/SyncConflictId'
        original_client_mutation_id:
          $ref: '#/components/schemas/ClientMutationId'
        mutation_kind:
          $ref: '#/components/schemas/ClientMutationKind'
        resource_id:
          $ref: '#/components/schemas/OpaqueId'
        reason:
          $ref: '#/components/schemas/ConflictReason'
        lifecycle:
          $ref: '#/components/schemas/ConflictLifecycle'
        created_at:
          type: string
          format: date-time
        original_intent:
          $ref: '#/components/schemas/ConflictOriginalIntent'
        historical_server_observation:
          $ref: '#/components/schemas/ConflictHistoricalObservation'
        terminal_resolution:
          $ref: '#/components/schemas/ConflictTerminalResolution'
    ConflictOriginalIntent:
      type: object
      additionalProperties: false
      required: [kind]
      description: Closed safe projection of the original Prompt 34 semantic intent; no raw request JSON or physical storage metadata.
      properties:
        kind:
          $ref: '#/components/schemas/ClientMutationKind'
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        parent_node_id:
          $ref: '#/components/schemas/OpaqueId'
        requested_parent_id:
          $ref: '#/components/schemas/OpaqueId'
        expected_revision:
          $ref: '#/components/schemas/U64Decimal'
        expected_parent_revision:
          $ref: '#/components/schemas/U64Decimal'
        requested_name:
          type: string
          minLength: 1
          maxLength: 1024
          description: Logical name only; never a filesystem path.
    ConflictHistoricalObservation:
      type: object
      additionalProperties: false
      required: [resource_id, reason, server_epoch_at_conflict, server_sequence_at_conflict]
      description: Immutable evidence captured when the original mutation conflicted; these fields are explicitly not current canonical truth.
      properties:
        resource_id:
          $ref: '#/components/schemas/OpaqueId'
        reason:
          $ref: '#/components/schemas/ConflictReason'
        original_expected_revision:
          $ref: '#/components/schemas/U64Decimal'
        server_revision_at_conflict:
          $ref: '#/components/schemas/U64Decimal'
        server_state_at_conflict:
          type: string
          enum: [ACTIVE, TRASHED, PURGING]
        server_parent_id_at_conflict:
          $ref: '#/components/schemas/OpaqueId'
        server_name_at_conflict:
          type: string
          minLength: 1
          maxLength: 1024
        server_epoch_at_conflict:
          $ref: '#/components/schemas/U64Decimal'
        server_sequence_at_conflict:
          $ref: '#/components/schemas/U64Decimal'
    ConflictTerminalResolution:
      type: object
      additionalProperties: false
      required: [resolution_id, action, completed_at]
      description: Present only for a terminal conflict; journal fields exist only for a successful APPLY_CLIENT_INTENT.
      properties:
        resolution_id:
          $ref: '#/components/schemas/ConflictResolutionId'
        action:
          $ref: '#/components/schemas/ConflictResolutionAction'
        completed_at:
          type: string
          format: date-time
        journal_event_id:
          $ref: '#/components/schemas/OpaqueId'
        journal_sequence:
          $ref: '#/components/schemas/U64Decimal'
    ConflictResolutionRequest:
      oneOf:
        - $ref: '#/components/schemas/AcceptServerResolutionRequest'
        - $ref: '#/components/schemas/ApplyClientIntentResolutionRequest'
      discriminator:
        propertyName: action
        mapping:
          ACCEPT_SERVER: '#/components/schemas/AcceptServerResolutionRequest'
          APPLY_CLIENT_INTENT: '#/components/schemas/ApplyClientIntentResolutionRequest'
      description: Strict manual-decision body. The 16 KiB body bound applies before deserialization, and unknown fields are rejected.
    AcceptServerResolutionRequest:
      type: object
      additionalProperties: false
      required: [resolution_id, action]
      properties:
        resolution_id:
          $ref: '#/components/schemas/ConflictResolutionId'
        action:
          type: string
          const: ACCEPT_SERVER
    ApplyClientIntentResolutionRequest:
      type: object
      additionalProperties: false
      required: [resolution_id, action, expected_current_revision]
      properties:
        resolution_id:
          $ref: '#/components/schemas/ConflictResolutionId'
        action:
          type: string
          const: APPLY_CLIENT_INTENT
        expected_current_revision:
          $ref: '#/components/schemas/U64Decimal'
        expected_current_parent_revision:
          allOf:
            - $ref: '#/components/schemas/U64Decimal'
          description: Required for MOVE_NODE and RESTORE_NODE; forbidden for CREATE_DIRECTORY, RENAME_NODE, and TRASH_NODE.
    ConflictResolutionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ConflictResolutionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    ConflictResolutionData:
      type: object
      additionalProperties: false
      required: [outcome, conflict_id, resolution_id, action, lifecycle, replayed, completed_at]
      description: Durable terminal result. Same resolution ID and canonical fingerprint replays every value exactly except replayed becomes true.
      properties:
        outcome:
          type: string
          enum: [ACCEPTED_SERVER, APPLIED_CLIENT_INTENT]
        conflict_id:
          $ref: '#/components/schemas/SyncConflictId'
        resolution_id:
          $ref: '#/components/schemas/ConflictResolutionId'
        action:
          $ref: '#/components/schemas/ConflictResolutionAction'
        lifecycle:
          type: string
          enum: [RESOLVED, DISMISSED]
        replayed:
          type: boolean
        completed_at:
          type: string
          format: date-time
        journal_event_id:
          allOf:
            - $ref: '#/components/schemas/OpaqueId'
          description: Present only for APPLIED_CLIENT_INTENT and identical on replay.
        journal_sequence:
          allOf:
            - $ref: '#/components/schemas/U64Decimal'
          description: Present only for APPLIED_CLIENT_INTENT and identical on replay.
    RebaselineStartRequest:
      type: object
      additionalProperties: false
      maxProperties: 0
      description: Exact empty JSON object; bootstrap behavior is fully determined by the authenticated path scope.
    RebaselineCompleteRequest:
      type: object
      additionalProperties: false
      required: [completion_token]
      properties:
        completion_token:
          type: string
          minLength: 1
          maxLength: 336
          description: Opaque terminal-page HMAC evidence; it is integrity proof, never authorization, and must not be logged.
    RebaselineBootstrapResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/RebaselineBootstrapData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RebaselineBootstrapData:
      type: object
      additionalProperties: false
      required: [bootstrap_id, device_id, library_id, state, generation, snapshot_epoch, snapshot_resume_sequence, manifest_item_count, created_at, expires_at]
      properties:
        bootstrap_id:
          $ref: '#/components/schemas/OpaqueId'
        device_id:
          $ref: '#/components/schemas/OpaqueId'
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        state:
          type: string
          enum: [OPEN, COMPLETED, ABORTED, EXPIRED]
        generation:
          $ref: '#/components/schemas/U64Decimal'
        snapshot_epoch:
          $ref: '#/components/schemas/U64Decimal'
        snapshot_resume_sequence:
          $ref: '#/components/schemas/U64Decimal'
        manifest_item_count:
          $ref: '#/components/schemas/U64Decimal'
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: PostgreSQL/server-time expiry for an OPEN session.
        completed_at:
          type: string
          format: date-time
    RebaselineSnapshotPageResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/RebaselineSnapshotPageData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RebaselineSnapshotPageData:
      type: object
      additionalProperties: false
      required: [bootstrap, nodes, has_more]
      properties:
        bootstrap:
          $ref: '#/components/schemas/RebaselineBootstrapData'
        nodes:
          type: array
          maxItems: 1000
          description: Immutable manifest rows ordered by ascending opaque Node ID; never a physical filesystem or ObjectStore listing.
          items:
            $ref: '#/components/schemas/RebaselineSnapshotNode'
        has_more:
          type: boolean
        next_cursor:
          type: string
          minLength: 1
          maxLength: 320
          description: Present only when another keyset page exists.
        completion_token:
          type: string
          minLength: 1
          maxLength: 336
          description: Present only on the actual terminal page and bound to the complete manifest count/terminal marker and coherent cut.
    RebaselineSnapshotNode:
      type: object
      additionalProperties: false
      required: [node_id, name, kind, state, revision]
      properties:
        node_id:
          $ref: '#/components/schemas/OpaqueId'
        parent_node_id:
          $ref: '#/components/schemas/OpaqueId'
        name:
          type: string
          minLength: 1
          maxLength: 1024
          description: Logical component name; never an operating-system path.
        kind:
          type: string
          enum: [FILE, DIRECTORY]
        state:
          type: string
          enum: [ACTIVE, TRASHED]
          description: PURGING is an internal maintenance state and is never materialized in this public logical snapshot.
        revision:
          $ref: '#/components/schemas/U64Decimal'
        current_version_id:
          $ref: '#/components/schemas/OpaqueId'
        current_content:
          $ref: '#/components/schemas/RebaselineSnapshotContent'
    RebaselineSnapshotContent:
      type: object
      additionalProperties: false
      required: [byte_length, sha256]
      properties:
        byte_length:
          $ref: '#/components/schemas/U64Decimal'
        sha256:
          $ref: '#/components/schemas/Hash'
      description: Safe logical identity metadata for the current file bytes; clients use existing content-download routes to obtain bytes.
    RebaselineCompletionResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/RebaselineCompletionData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    RebaselineCompletionData:
      type: object
      additionalProperties: false
      required: [bootstrap, checkpoint, replayed]
      properties:
        bootstrap:
          $ref: '#/components/schemas/RebaselineBootstrapData'
        checkpoint:
          $ref: '#/components/schemas/RebaselineCompletionCheckpoint'
        replayed:
          type: boolean
          description: True when a committed completion is returned safely after response loss/retry.
    RebaselineCompletionCheckpoint:
      type: object
      additionalProperties: false
      required: [journal_epoch, acknowledged_sequence, updated_at]
      properties:
        journal_epoch:
          $ref: '#/components/schemas/U64Decimal'
        acknowledged_sequence:
          $ref: '#/components/schemas/U64Decimal'
        updated_at:
          type: string
          format: date-time
    SyncAckRequest:
      type: object
      additionalProperties: false
      required: [ack_token]
      properties:
        ack_token:
          type: string
          minLength: 1
          maxLength: 256
          description: Opaque server-issued HMAC evidence for one delivered page; integrity evidence only and never an authorization credential.
    SyncCheckpointResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SyncCheckpointData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SyncCheckpointData:
      type: object
      additionalProperties: false
      required: [device_id, library_id, epoch, acknowledged_sequence, created_at, updated_at]
      properties:
        device_id:
          $ref: '#/components/schemas/OpaqueId'
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        epoch:
          $ref: '#/components/schemas/U64Decimal'
        acknowledged_sequence:
          $ref: '#/components/schemas/U64Decimal'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        last_seen_high_watermark:
          $ref: '#/components/schemas/U64Decimal'
    SyncFeedResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/SyncFeedData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    SyncFeedData:
      type: object
      additionalProperties: false
      required: [device_id, library_id, epoch, from_sequence, through_sequence, high_watermark, has_more, changes]
      properties:
        device_id:
          $ref: '#/components/schemas/OpaqueId'
        library_id:
          $ref: '#/components/schemas/OpaqueId'
        epoch:
          $ref: '#/components/schemas/U64Decimal'
        from_sequence:
          $ref: '#/components/schemas/U64Decimal'
        through_sequence:
          $ref: '#/components/schemas/U64Decimal'
        high_watermark:
          $ref: '#/components/schemas/U64Decimal'
        has_more:
          type: boolean
        changes:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/SyncChange'
        ack_token:
          type: string
          minLength: 1
          maxLength: 256
          description: Present only for a non-empty page; signed evidence binds the page start, delivered-through sequence, and high watermark.
    SyncChange:
      type: object
      additionalProperties: false
      required: [event_id, schema_version, sequence, resource_kind, resource_id, change_kind, resource_revision, occurred_at]
      properties:
        event_id:
          $ref: '#/components/schemas/OpaqueId'
        schema_version:
          type: integer
          const: 1
          description: Closed journal projection schema; incompatible versions fail closed in desktop transport.
        sequence:
          $ref: '#/components/schemas/U64Decimal'
        resource_kind:
          type: string
          const: NODE
        resource_id:
          $ref: '#/components/schemas/OpaqueId'
        change_kind:
          type: string
          enum: [NODE_CREATED, NODE_RENAMED, NODE_MOVED, NODE_TRASHED, NODE_RESTORED, FILE_CONTENT_COMMITTED, FILE_VERSION_RESTORED, NODE_PURGED]
        resource_revision:
          $ref: '#/components/schemas/U64Decimal'
        occurred_at:
          type: string
          format: date-time
        parent_node_id:
          $ref: '#/components/schemas/OpaqueId'
        node_kind:
          type: string
          enum: [FILE, DIRECTORY]
        node_state:
          type: string
          enum: [ACTIVE, TRASHED, PURGING]
        current_version_id:
          $ref: '#/components/schemas/OpaqueId'
    CreateUploadSessionRequest:
      oneOf:
        - $ref: '#/components/schemas/CreateFileUploadRequest'
        - $ref: '#/components/schemas/ReplaceContentUploadRequest'
      discriminator:
        propertyName: operation
        mapping:
          CREATE_FILE: '#/components/schemas/CreateFileUploadRequest'
          REPLACE_CONTENT: '#/components/schemas/ReplaceContentUploadRequest'
    CreateFileUploadRequest:
      type: object
