        $ref: '#/components/schemas/OpaqueId'
    BackupSnapshotState:
      name: state
      in: query
      required: false
      description: Optional exact public snapshot lifecycle filter.
      schema:
        $ref: '#/components/schemas/BackupSnapshotState'
    BackupSetCursor:
      name: cursor
      in: query
      required: false
      description: Opaque bounded keyset cursor for the owner-scoped backup-set collection.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    BackupSetLimit:
      name: limit
      in: query
      required: false
      description: Bounded backup-set page size; canonical unsigned decimal text only.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 100
    BackupCursor:
      name: cursor
      in: query
      required: false
      description: Opaque bounded keyset cursor scoped to this backup collection, snapshot filter, and tree parent.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    BackupLimit:
      name: limit
      in: query
      required: false
      description: Bounded logical backup page size; canonical unsigned decimal text only.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 200
    BackupMaintenanceCursor:
      name: cursor
      in: query
      required: false
      description: Opaque bounded keyset cursor for one backup-set maintenance history collection.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    BackupMaintenanceLimit:
      name: limit
      in: query
      required: false
      description: Bounded maintenance-history page size; canonical unsigned decimal text only.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 1000
        default: 200
    BackupOperationKindFilter:
      name: kind
      in: query
      required: false
      description: Optional exact filter for one unified activity kind.
      schema:
        $ref: '#/components/schemas/BackupOperationKind'
    BackupOperationCursor:
      name: cursor
      in: query
      required: false
      description: Opaque bounded keyset cursor bound to this backup set, kind filter, created-at tuple, kind rank, and operation identity.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    BackupOperationLimit:
      name: limit
      in: query
      required: false
      description: Bounded heterogeneous activity page size; canonical unsigned decimal text only.
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 500
        default: 100
    BackupOperationKindPath:
      name: operation_kind
      in: path
      required: true
      description: Kind-qualified semantic operation identity; execution receipts are not accepted as kinds.
      schema:
        $ref: '#/components/schemas/BackupOperationKind'
    BackupOperationIdPath:
      name: operation_id
      in: path
      required: true
      description: Opaque UUIDv7 identity interpreted only within operation_kind.
      schema:
