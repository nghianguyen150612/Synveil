      type: object
      additionalProperties: false
      required: [impact, content_count]
      properties:
        impact:
          $ref: '#/components/schemas/BackupPruneImpact'
        content_count:
          $ref: '#/components/schemas/U64Decimal'
    BackupPrunePlanResponse:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/BackupPrunePlan'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
