      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/PrivateNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RebaselineInternalError:
      description: Persisted bootstrap data is invalid or an internal invariant failed; stable codes are invalid_persisted_data and internal_error, and no physical detail is exposed.
      headers:
        X-Request-Id:
