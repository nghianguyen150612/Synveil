openapi: 3.1.0
info:
  title: Synveil API
  version: 0.1.0-blueprint
  summary: Device enrollment, scoped bearer authentication, desktop inbound synchronization, browser metadata mutations, and bounded content transport
  description: |
    This is the checked-in OpenAPI contract for the authenticated logical
    file/folder metadata, one-way device synchronization, immutable
    version-history metadata, immutable content-download, resumable-upload,
    and metadata-only Trash retention slices.
    It records transport-wide conventions, foundation health routes, browser
    authentication transport, the first-run bootstrap boundary, owner-scoped
    library/root/node operations, immutable file-version listing and direct
    metadata lookup, security schemes, exact-offset raw-byte upload sessions,
    authenticated current and historical full/single-range content reads, and
    shared response shapes.

    Version-history listing is bounded, newest-first, node-scoped keyset
    pagination over immutable FileVersion rows. Direct version metadata uses
    the same opaque version ID accepted by the historical content route. Both
    reads expose only safe logical metadata and do not open an ObjectStore.

    Upload creation, owner-scoped status, bounded streaming append, retry-safe
    completion, and abort are implemented through the transport-neutral upload
    application service. Authenticated current-node and immutable-version
    content downloads are implemented through the transport-neutral content-read
    service with full responses, exactly one byte range, strong SHA-256 ETags,
    safe attachment headers, and bounded streaming. The API never exposes
    staging handles, object keys, physical paths, or backend credentials.
    Safe historical-version restore is implemented as a conditional owner
    mutation that appends one new immutable FileVersion reusing the selected
    version's verified Object; it never mutates history, moves the current
    pointer backward, copies bytes, or creates an UploadSession. The internal
    physical-GC pipeline is implemented behind trusted PostgreSQL/ObjectStore
    services and a private opt-in worker, but it has no public HTTP operation,
    scheduling control, or user-facing purge route. Download UI, multi-range
    responses, backup, sharing, pairing GUI, and all public physical-GC
    controls remain planned. One-time enrollment groundwork, scoped revocable
    device bearer authentication, durable desktop profiles, secure credential
    persistence and the production HTTP inbound adapter are implemented.
    One-way server change-feed polling, durable
    per-device/per-library checkpoints, signed acknowledgment evidence, and a
    materialized logical snapshot/rebaseline bootstrap are implemented and
    validated. The snapshot protocol pages an immutable logical manifest and
    atomically hands off at a journal epoch/sequence cut; it does not transfer
    file bytes or expose physical storage metadata. The authenticated logical
    client-mutation route is implemented with durable mutation IDs, canonical
    fingerprints, explicit base/revision preconditions, deterministic persisted
    conflicts, and exactly one journal event for each applied mutation. It does
    not accept file bytes. Automatic conflict resolution: NOT IMPLEMENTED.
    Last-write-wins, conflict-copy renaming, merge engines, local filesystem
    watching, outbound mutation generation and client GUI remain deferred.
    Trash eligibility and the
    internal metadata-only `PURGING` begin transition do not expose a normal
    user-facing purge route.
  contact:
    name: Synveil Architecture / Contracts
  license:
    name: MIT
    identifier: MIT
  x-synveil-status: DESKTOP_PROFILES_ENROLLMENT_DEVICE_AUTH_AND_HTTP_INBOUND_IMPLEMENTED
  x-synveil-gate: SYNVEIL_DESKTOP_REMOTE_READY
  x-synveil-next-step: |
    Keep physical GC internal and operator-configured. Client logical mutation
    submission and optimistic-concurrency conflict detection are implemented;
    automatic conflict resolution, backup, sharing, watcher/outbound generation
    and desktop GUI remain out of scope. Prompt 38 captures local observations
    and durable outbound intent only; it must not automatically submit mutations.
servers:
  - url: /
    description: Deployment-relative base URL; TLS is supplied by the supported proxy topology.
tags:
  - name: Operations
    description: Foundation liveness/readiness probes and restricted health.
  - name: Authentication
    description: Implemented browser-session login, session inspection, CSRF issuance, and logout transport.
  - name: Device enrollment
    description: Browser-owner grants and revocation; once-only high-entropy enrollment exchange. No GUI, cookies on desktop, or automatic rotation.
  - name: Bootstrap
    description: Implemented one-time setup status and first-administrator creation; no automatic session issuance.
  - name: Files
    description: Implemented authenticated owner-scoped logical library, directory, node metadata, and safe Trash retention status operations.
  - name: Downloads
    description: Implemented authenticated current and historical full or single-range immutable content reads; no multi-range or UI surface.
  - name: Versions
    description: Implemented authenticated immutable file-version history, safe owner restore, and direct safe metadata lookup; no physical purge operation.
  - name: Uploads
    description: Implemented authenticated, CSRF-protected exact-offset upload sessions with bounded streaming byte append.
  - name: Synchronization
    description: Implemented logical snapshot/rebaseline, one-way feed/checkpoints and desktop HTTP inbound sync. Browser-only logical mutations/manual conflicts remain separate; no filesystem watcher, outbound generator or automatic resolution.
paths:
  /api/v1/devices/enrollment-grants:
    post:
      tags: [Device enrollment]
      operationId: createDeviceEnrollmentGrant
      summary: Create one owner-scoped one-time enrollment grant
      x-synveil-status: IMPLEMENTED
      x-synveil-max-body-bytes: 2048
      description: |
        Browser owner plus CSRF creates a grant for an owned PENDING/ACTIVE
        Device or a new canonical PENDING Device. Other owners' Devices and
        PAUSED/REVOKED Devices are rejected. A 256-bit random enrollment token
        is returned once; PostgreSQL stores its domain-separated digest only.
        TTL is 600 seconds (schema upper bound 900 seconds), server controlled.
        No token, cookie, CSRF proof, or bearer may be logged or put in a URL.
        All responses and errors are private/no-store. Production ingress is HTTPS.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceEnrollmentGrantRequest'
      responses:
        '201':
          description: One-time grant secret; retain only until desktop exchange.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEnrollmentGrantResponse'
        '400':
          $ref: '#/components/responses/DevicePrivateError'
        '401':
          $ref: '#/components/responses/DevicePrivateError'
        '403':
          $ref: '#/components/responses/DevicePrivateError'
        '404':
          $ref: '#/components/responses/DevicePrivateError'
        '413':
          $ref: '#/components/responses/DevicePrivateError'
        '503':
          $ref: '#/components/responses/DevicePrivateError'
  /api/v1/device-enrollment/exchange:
    post:
      tags: [Device enrollment]
      operationId: exchangeDeviceEnrollmentGrant
      summary: Consume a grant and hand off one device bearer exactly once
      x-synveil-status: IMPLEMENTED
      x-synveil-max-body-bytes: 2048
      description: |
        The high-entropy enrollment token is the sole authority; neither a
        browser session nor CSRF nor a pre-existing device bearer is required.
        Over verified HTTPS, one transaction checks scope, TTL, consumption and
        revocation, activates the canonical PENDING Device if needed, consumes
        the grant, and stores only a new credential digest. Concurrent/replayed,
        expired and tampered exchanges cannot issue another credential and use
        one generic invalid_enrollment error. No automatic retry is permitted.
        If the response is lost after commit, the owner explicitly calls the
        Device revoke-all route (also revoking outstanding grants), creates a
        new grant and re-enrolls the same Device. The old secret is unrecoverable.
        Desktop persists the credential only in SecretStore, never SQLite.
        Every response and error is private/no-store. No token examples are supplied.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExchangeDeviceEnrollmentRequest'
      responses:
        '201':
          description: Exactly-once device bearer handoff bound to owner and Device.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCredentialResponse'
        '400':
          $ref: '#/components/responses/DevicePrivateError'
        '401':
          $ref: '#/components/responses/DevicePrivateError'
        '413':
          $ref: '#/components/responses/DevicePrivateError'
        '500':
          $ref: '#/components/responses/DevicePrivateError'
        '503':
          $ref: '#/components/responses/DevicePrivateError'
  /api/v1/devices/{device_id}/credentials/{credential_id}/revoke:
    post:
      tags: [Device enrollment]
      operationId: revokeDeviceCredential
      summary: Explicitly revoke one owned device credential
      x-synveil-status: IMPLEMENTED
      x-synveil-max-body-bytes: 2048
      description: |
        Browser owner plus CSRF; exact empty JSON object. Revocation is durable
        and idempotent for the same owned credential. Every subsequent bearer
        request checks current DB state. A valid secret proving a revoked
        credential/Device receives device_revoked; unknown or incorrect bearers
        receive authentication_failed. No device bearer may invoke this route.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/DeviceCredentialId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRevokeRequest'
      responses:
        '204':
          description: Credential revoked; existing local replica data is unchanged.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
        '400':
          $ref: '#/components/responses/DevicePrivateError'
        '401':
          $ref: '#/components/responses/DevicePrivateError'
        '403':
          $ref: '#/components/responses/DevicePrivateError'
        '404':
          $ref: '#/components/responses/DevicePrivateError'
        '413':
          $ref: '#/components/responses/DevicePrivateError'
        '503':
          $ref: '#/components/responses/DevicePrivateError'
  /api/v1/devices/{device_id}/credentials/revoke-all:
    post:
      tags: [Device enrollment]
      operationId: revokeAllDeviceCredentials
      summary: Revoke all credentials and outstanding grants for one owned Device
      x-synveil-status: IMPLEMENTED
      x-synveil-max-body-bytes: 2048
      description: |
        Browser owner plus CSRF; exact empty JSON object. This is the explicit
        recovery path after a lost once-only exchange response. It revokes every
        credential and outstanding grant under the Device lock without revoking
        the Device itself, allowing a fresh owner-created grant for the same
        Device. Local forget is separate and never implies offline server revoke.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/CsrfHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRevokeRequest'
      responses:
        '204':
          description: All owned Device credentials and outstanding grants revoked.
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
        '400':
          $ref: '#/components/responses/DevicePrivateError'
        '401':
          $ref: '#/components/responses/DevicePrivateError'
        '403':
          $ref: '#/components/responses/DevicePrivateError'
        '404':
          $ref: '#/components/responses/DevicePrivateError'
        '413':
          $ref: '#/components/responses/DevicePrivateError'
        '503':
          $ref: '#/components/responses/DevicePrivateError'
  /health/live:
    get:
      tags: [Operations]
      operationId: getLiveness
      summary: Return process liveness
      x-synveil-status: SKELETON_IMPLEMENTED
      x-synveil-owner: DevOps / Release
      description: |
        An unversioned, unauthenticated deployment probe. It must not expose
        dependency, version, topology, configuration, or user-data details.
      security: []
      responses:
        '200':
          description: The process can answer requests.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveProbe'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /health/ready:
    get:
      tags: [Operations]
      operationId: getReadiness
      summary: Return bounded service readiness
      x-synveil-status: SKELETON_IMPLEMENTED
      x-synveil-owner: DevOps / Release
      description: |
        An unversioned deployment probe. A not-ready response is safe and
        intentionally coarse; detailed authenticated health belongs under the
        foundation /api/v1/system/health operation.
      security: []
      responses:
        '200':
          description: Required configured dependencies passed their bounded readiness checks.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyProbe'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /live:
    get:
      tags: [Operations]
      operationId: getShortLiveness
      summary: Return process liveness through the short probe alias
      x-synveil-status: SKELETON_IMPLEMENTED
      x-synveil-owner: DevOps / Release
      description: Compatibility alias for the canonical `/health/live` probe.
      security: []
      responses:
        '200':
          description: The process can answer requests.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveProbe'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /ready:
    get:
      tags: [Operations]
      operationId: getShortReadiness
      summary: Return bounded service readiness through the short probe alias
      x-synveil-status: SKELETON_IMPLEMENTED
      x-synveil-owner: DevOps / Release
      description: Compatibility alias for the canonical `/health/ready` probe.
      security: []
      responses:
        '200':
          description: Required configured dependencies passed their bounded readiness checks.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyProbe'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Create an authenticated browser session
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Auth / Security, Rust Backend
      description: |
        Verify the canonical login identifier and password, then issue a new
        opaque browser session. The raw session credential is presented only
        in a Secure/HttpOnly host-only cookie and is never returned in JSON.
        Login is intentionally exempt from the authenticated-session CSRF
        requirement; deployments still use same-origin browser defaults and
        exact-origin policy for state-changing authenticated requests.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: A new authenticated browser session was created.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the current browser session
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Auth / Security, Rust Backend
      description: |
        Revoke the currently valid browser session and clear the matching
        session and CSRF cookies. A missing, malformed, expired, or already
        revoked session is handled as a safe repeated logout. A currently
        valid session requires the session-bound X-CSRF-Token header and
        same-origin request provenance.
      security:
        - BrowserSession: []
      parameters:
        - $ref: '#/components/parameters/CsrfHeader'
      responses:
        '204':
          description: Logout completed or was safely repeated.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/session:
    get:
      tags: [Authentication]
      operationId: getCurrentSession
      summary: Return the safe current browser principal
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Auth / Security, Rust Backend
      description: |
        Validate the opaque browser session cookie and return only the safe
        current principal. The response never contains the raw session
        credential, verifier, password, or database row.
      security:
        - BrowserSession: []
      responses:
        '200':
          description: Safe current-session identity.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/csrf:
    get:
      tags: [Authentication]
      operationId: getCsrfToken
      summary: Issue a session-bound CSRF proof
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Auth / Security, Rust Backend
      description: |
        Issue a fresh signed double-submit proof bound to the authenticated
        browser session. The proof is returned for the web boundary and also
        written to a non-HttpOnly CSRF cookie; state-changing requests must
        send it in X-CSRF-Token. It is not accepted from a query parameter.
      security:
        - BrowserSession: []
      responses:
        '200':
          description: A fresh session-bound CSRF proof.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/system/health:
    get:
      tags: [Operations]
      operationId: getSystemHealth
      summary: Return restricted bounded system health
      x-synveil-status: SKELETON_IMPLEMENTED
      x-synveil-owner: Rust Backend / Operations
      description: |
        Foundation transport route for a richer health representation. The
        route is fail-closed until an authenticated system-health authorizer is
        supplied. It exposes bounded component states only; paths, provider
        URLs, credentials, stack traces, and topology details are excluded.
        Inbound desktop DeviceBearer credentials do not authorize this route;
        desktop connection probing uses anonymous readiness plus its checkpoint.
      security:
        - BrowserSession: []
      responses:
        '200':
          description: Authorized bounded system health.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/system/bootstrap-status:
    get:
      tags: [Bootstrap]
      operationId: getBootstrapStatus
      summary: Report whether first-run setup is still required
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Auth / Security, Rust Backend
      description: |
        Return only the minimum state needed to render first-run UX. The
        response contains no setup secret, password, database detail, or
        administrator identity and is always marked no-store. The route is
        intentionally bounded and has no distributed rate limiter in this
        phase; deployments must keep first-run exposure on a trusted/private
        or correctly terminated TLS network.
      security: []
      responses:
        '200':
          description: Current one-time bootstrap eligibility.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatusResponse'
        '503':
          $ref: '#/components/responses/BootstrapServiceUnavailable'
  /api/v1/bootstrap/admin:
    post:
      tags: [Bootstrap]
      operationId: createFirstAdmin
      summary: Create the first administrator and close setup
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Auth / Security, Rust Backend
      x-synveil-max-body-bytes: 16384
      description: |
        Create the first administrator through the existing race-safe
        bootstrap service. The request is strict, bounded JSON using the
        canonical login, login_key, and password fields. Browser requests are
        checked for same-origin provenance when Origin or Sec-Fetch-Site is
        present. No setup-secret field is part of the accepted contract, so
        deployment/network exposure is an explicit first-run trust assumption
        until a later installer or secret-gate contract is reviewed.

        A successful response reports setup_required=false and contains no
        password, verifier, session credential, or administrator record. This
        endpoint does not issue a browser session; the client must use the
        normal login route explicitly. Concurrent or repeated claims after the
        first successful transaction return bootstrap_closed and never reopen
        setup.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BootstrapAdminRequest'
      responses:
        '200':
          description: The first administrator was created and setup closed.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BootstrapStatusResponse'
        '400':
          $ref: '#/components/responses/BootstrapInvalidRequest'
        '413':
          $ref: '#/components/responses/BootstrapPayloadTooLarge'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/BootstrapClosed'
        '503':
          $ref: '#/components/responses/BootstrapServiceUnavailable'
  /api/v1/devices/{device_id}/libraries/{library_id}/checkpoint:
    get:
      tags: [Synchronization]
      operationId: getDeviceLibraryCheckpoint
      summary: Read or initialize an authenticated device/library checkpoint
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Sync / Metadata / Security
      description: |
        Return the durable consumer checkpoint for one existing registered
        device and one library owned by the authenticated user. The minimal
        sync-eligible device state is ACTIVE. First use creates a checkpoint
        at the current journal epoch with acknowledged_sequence=0; it never
        silently skips to the current journal head. Device IDs and library
        IDs are not authorization credentials, and inaccessible scopes are
        concealed as not found.
      x-synveil-auth-classes: [BROWSER_SESSION, DEVICE_CREDENTIAL]
      x-synveil-device-auth: Same authenticated Device on scoped routes; active owner, Device and credential checked on every request. Mixed Cookie and Authorization are rejected. Private/no-store for device responses and errors.
      security:
        - BrowserSession: []
        - DeviceBearer: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/LibraryId'
      responses:
        '200':
          description: The durable owner-scoped checkpoint.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncCheckpointResponse'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/devices/{device_id}/libraries/{library_id}/changes:
    get:
      tags: [Synchronization]
      operationId: listDeviceLibraryChanges
      summary: Read a bounded one-way incremental change-feed page
      x-synveil-status: IMPLEMENTED
      x-synveil-owner: Sync / Metadata / Security
      description: |
        Read committed logical journal facts after the durable checkpoint in
        ascending journal sequence order. The page is bounded to a default of
        100 and a maximum of 500 events, uses keyset semantics through the
        checkpoint, and returns the repeatable-read high watermark captured
        with the page. Fetching never advances the checkpoint. A non-empty
        page includes signed acknowledgment evidence that binds the owner,
        device, library, epoch, page start, delivered-through sequence, high
        watermark, and token format version. This is server-to-device polling
        only; it is not a client mutation or conflict-resolution endpoint.
      x-synveil-auth-classes: [BROWSER_SESSION, DEVICE_CREDENTIAL]
      x-synveil-device-auth: Same authenticated Device on scoped routes; active owner, Device and credential checked on every request. Mixed Cookie and Authorization are rejected. Private/no-store for device responses and errors.
      security:
        - BrowserSession: []
        - DeviceBearer: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/LibraryId'
        - $ref: '#/components/parameters/SyncLimit'
      responses:
        '200':
          description: A bounded ascending logical change page.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncFeedResponse'
        '400':
