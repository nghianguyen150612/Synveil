    BackupPruneImpact:
      type: string
      enum: [RETAINED_BY_OTHER_REFERENCE, WOULD_BECOME_UNREFERENCED]
      description: |
        Aggregate logical retention impact after excluding only the target
        snapshot's pins. WOULD_BECOME_UNREFERENCED means the content would have
        no known live FileVersion or other snapshot-pin references after prune
        execution. It does not mean physical deletion has occurred or is
        authorized.
