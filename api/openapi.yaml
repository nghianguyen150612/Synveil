      type: object
      additionalProperties: false
      required: [completed_steps, total_steps]
      properties:
        completed_steps:
          type: integer
          format: int32
          minimum: 0
          description: Number of canonical durable steps completed; it must not exceed total_steps.
        total_steps:
          type: integer
          format: int32
          minimum: 1
          description: Total known steps for this operation kind.
      description: Step-based progress only; no percentage, ETA, or live throughput is exposed.
