# Dependency policy for the Rust workspace. Keep this file reviewed alongside
# Cargo.toml and Cargo.lock; adding a crate is not an implicit policy approval.

[advisories]
version = 2
yanked = "deny"

[bans]
multiple-versions = "warn"
# Workspace crates intentionally inherit all versions from Cargo.toml. Review
# external versions there; cargo-deny cannot distinguish that form from a
# wildcard dependency in member manifests.
wildcards = "allow"
highlight = "all"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "LGPL-2.1-or-later",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
