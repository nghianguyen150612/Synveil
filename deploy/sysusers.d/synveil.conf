# Synveil Linux service identity — Gen-1 persistent system account.
#
# Declares the least-privilege first-party account used by Synveil
# scheduled-maintenance and future Synveil services. Packaging or
# systemd-sysusers creates the account; application runtime never creates
# users, and the service never runs as root.
#
# Account properties (Prompt 75):
#   name:  synveil
#   group: synveil
#   type:  system account (ID auto-allocated, no hardcoded UID/GID)
#   login: disabled (invalid password; shell /usr/sbin/nologin)
#   home:  /var/lib/synveil — stable persistent-state location, not a
#          conventional interactive home (/home/*). The directory itself is
#          created by tmpfiles.d (deploy/tmpfiles.d/synveil.conf) or the
#          distribution package; sysusers only records the passwd home field.
#          This satisfies "stable runtime/state ownership" without requiring
#          an interactive home.
#   supplementary groups: none (no sudo, wheel, docker, disk, adm, root)
#
# UID/GID policy: "-" requests automatic allocation from the system pool.
# Future appliance images may reserve a fixed UID/GID if required, but no
# numeric value is assumed cross-machine in Gen-1.
#
# This file is the authoritative declarative source. Packaging installs it to
# /usr/lib/sysusers.d/synveil.conf (vendor) — administrator overrides in
# /etc/sysusers.d/synveil.conf take precedence per sysusers.d(5).
#
# Validate without host mutation:
#   systemd-sysusers --dry-run --root=/tmp/empty-root deploy/sysusers.d/synveil.conf
# or:
#   systemd-sysusers --cat-config (after install to /usr/lib/sysusers.d)
#
# DynamicUser evaluation (recorded):
#   REJECTED for primary identity. A transient UID cannot provide stable
#   ownership of /var/lib/synveil, /etc/synveil access, or future
#   object-store/data paths. DynamicUser would hide state under
#   /var/lib/private or /run/private via id-mapped mounts, break
#   administrator-visible ownership, and prevent multiple first-party
#   services from sharing one well-known identity. It remains suitable only
#   for fully ephemeral, stateless services — not Synveil.

# Type Name    ID  GECOS                     Home directory   Shell
g synveil - -
u synveil - "Synveil service account" /var/lib/synveil /usr/sbin/nologin
