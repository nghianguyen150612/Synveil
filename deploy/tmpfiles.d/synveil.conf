# Synveil persistent state — tmpfiles.d fragment (Gen-1).
#
# Creates the canonical persistent application-state directory with the
# ownership/mode contract defined in docs/en/DEPLOYMENT.md and
# docs/en/BACKUP.md. Packaging installs this file to
# /usr/lib/tmpfiles.d/synveil.conf; administrator overrides in
# /etc/tmpfiles.d/synveil.conf take precedence per tmpfiles.d(5).
#
# Persistent state (shared by future Synveil services):
#   path:  /var/lib/synveil
#   owner: synveil:synveil
#   mode:  0750 (rwxr-x---) — group-readable for synveil, inaccessible to others
#   type:  d — create directory, adjust mode/ownership, no age-based cleanup
#
# This directory is the authoritative location for non-secret service state
# that outlives a single one-shot invocation and is not yet in PostgreSQL,
# e.g. future appliance-local bookkeeping/durable local metadata. Today
# implementation remains PostgreSQL-exclusive; an empty managed directory is
# acceptable as a future runtime contract (see DEPLOYMENT.md).
# Must not be used for:
#   - executables (/usr, /usr/bin)
#   - administrator configuration (/etc/synveil)
#   - user data / object-store roots (storage architecture governs those)
#   - logs (/var/log/synveil is intentionally not created; journald is preferred)
#
# Runtime ephemeral state (/run/synveil) is intentionally NOT managed here.
# It is created with RuntimeDirectory=synveil in the service unit(s)
# (deploy/systemd/synveil-scheduled-maintenance.service), which ties its
# lifetime to the unit, ensures correct ownership, and cleans up on stop.
# Duplicating it via both RuntimeDirectory and tmpfiles.d would create
# conflicting managers.
#
# StateDirectory evaluation:
#   systemd StateDirectory=synveil would also create /var/lib/synveil per-service
#   on first activation. For Gen-1 the authoritative owner is packaging/tmpfiles,
#   not any single service, because the path will be shared by multiple
#   first-party services (api, worker, gc). A per-service StateDirectory would
#   imply each service independently manages the same directory, creating
#   ambiguous lifecycle ownership. tmpfiles.d provides a single host-level
#   declaration that exists regardless of which Synveil unit runs first.
#
# Validate without host mutation:
#   systemd-tmpfiles --dry-run --create --root=/tmp/empty-root --prefix=/var/lib/synveil
# or (after install):
#   systemd-tmpfiles --cat-config
#
# Do NOT use tmpfiles to create secret-bearing files (e.g. DATABASE_URL).
# Secrets remain root-owned, mounted with restrictive mode (0640) as defined
# in the filesystem ownership contract.

# Type Path              Mode UID     GID     Age Argument
d /var/lib/synveil 0750 synveil synveil - -
