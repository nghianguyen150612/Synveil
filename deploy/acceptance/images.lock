# P020 native clean-machine acceptance image lock.
#
# Every image used for normative Linux acceptance MUST be pinned here with a
# reviewed SHA-256 digest. scripts/linux-acceptance-vm.sh refuses to download
# any image that is not recorded below, so an unpinned or moving `latest` image
# cannot silently become acceptance evidence.
#
# Format:  <image-name>  sha256:<64-hex-digest>  url:<https-url>
#
# The URL is the official distribution location only. It carries no
# authenticity on its own; the digest is what makes the image trustworthy, and
# an unpinned digest means the image must not be downloaded at all.
#
# HOW TO PIN AN IMAGE (do this deliberately, never by guessing):
#   1. Confirm the exact image filename from the distribution's own directory
#      listing. Do not infer it: Fedora, in particular, moves release images
#      between active, archived and EOL trees, so a plausible-looking path can
#      404 or, worse, resolve to a different build.
#   2. Verify the image against the distribution's published signed checksum
#      file (Ubuntu: SHA256SUMS + SHA256SUMS.gpg; Fedora: the matching
#      *-CHECKSUM file).
#   3. Record both the url: and the sha256: values below, and open a review that
#      records which signed file the digest was authenticated against.
#
# The entries below are authenticated against the distribution-published
# signed checksum metadata. They identify immutable release files; they do not
# assert that native acceptance has passed. Native evidence remains absent
# until the clean-machine workflow boots and exercises these guests.
#
# Ubuntu checksum: https://cloud-images.ubuntu.com/releases/server/24.04/release/SHA256SUMS
# Ubuntu signature: https://cloud-images.ubuntu.com/releases/server/24.04/release/SHA256SUMS.gpg
# Ubuntu signing key fingerprint: D2EB44626FDDC30B513D5BB71A5D6C4C7DB87C81
# Fedora checksum: https://archives.fedoraproject.org/pub/archive/fedora/linux/releases/42/Cloud/x86_64/images/Fedora-Cloud-42-1.1-x86_64-CHECKSUM
# Fedora signing key fingerprint: B0F4950458F69E1150C6C5EDC8AC4916105EF944
#
# Only these two platforms are qualified. Do not add Debian, Mint, Pop!_OS,
# Rocky, AlmaLinux, CachyOS or Arch without separate native evidence.

